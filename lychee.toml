# Link checks over the Markdown of the repository (mise run check:links, offline, part of
# `check`; mise run check:links:remote, the network, run by the nightly workflow).
include_fragments = "full"
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
# 429 is a rate limit, not a broken link; GITHUB_TOKEN (read from the environment) keeps
# github.com links clear of it.
accept = ["200..=204", "429"]
# CHANGELOG.md is generated by release-please from commit messages; node_modules and .claude (the
# worktrees of the other checkouts) are not ours, and a glob input does not read the ignore file.
exclude_path = ["(^|/)CHANGELOG\\.md$", "(^|/)node_modules/", "(^|/)\\.claude/"]
# Pages that answer a script with 404 and a browser with 200.
exclude = [
  "^https://github\\.com/getsphericon/sphericon/stargazers$",
  "^https://www\\.ftc\\.gov/business-guidance/",
]
