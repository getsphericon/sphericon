# Example Prometheus alerting rules for sphericon. This file is the single source: the Helm chart
# renders it into a PrometheusRule, and the monitoring page of the documentation site shows it.
# Every alert's runbook_url points at the section of the runbook page with the same name.
# Thresholds are starting points; tune them to your traffic.
#
# The three API surfaces share one set of HTTP metrics and are told apart by operation_id:
# Collect* is /collect, Site* is /site, everything else is the external /api.
groups:
  - name: sphericon.availability
    rules:
      - alert: SphericonDown
        expr: up{job=~".*sphericon.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: sphericon metrics target {{ $labels.instance }} is down
          description: Prometheus has not been able to scrape {{ $labels.instance }} for 5 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericondown

      - alert: SphericonCollectErrorRatioHigh
        expr: |
          sum(rate(ogen_server_request_count_total{operation_id=~"Collect.*", http_response_status_code=~"5.."}[5m]))
            / sum(rate(ogen_server_request_count_total{operation_id=~"Collect.*"}[5m])) > 0.01
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: /collect is failing {{ $value | humanizePercentage }} of requests
          description: More than 1% of tracking requests answered 5xx for 10 minutes; events are being lost.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericoncollecterrorratiohigh

      - alert: SphericonSiteErrorRatioHigh
        expr: |
          sum(rate(ogen_server_request_count_total{operation_id=~"Site.*", http_response_status_code=~"5.."}[5m]))
            / sum(rate(ogen_server_request_count_total{operation_id=~"Site.*"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: /site is failing {{ $value | humanizePercentage }} of requests
          description: More than 5% of dashboard API requests answered 5xx for 10 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonsiteerrorratiohigh

      - alert: SphericonApiErrorRatioHigh
        expr: |
          sum(rate(ogen_server_request_count_total{operation_id!~"Site.*|Collect.*", http_response_status_code=~"5.."}[5m]))
            / sum(rate(ogen_server_request_count_total{operation_id!~"Site.*|Collect.*"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: /api is failing {{ $value | humanizePercentage }} of requests
          description: More than 5% of external API requests answered 5xx for 10 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonapierrorratiohigh

      - alert: SphericonRequestLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(ogen_server_duration_milliseconds_bucket{operation_id!~"Collect.*"}[5m]))) > 2000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: p95 /site and /api latency is {{ $value | humanize }} ms
          description: The 95th percentile of request duration has been above 2 seconds for 15 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonrequestlatencyhigh

  - name: sphericon.events
    rules:
      - alert: SphericonOutboxLagHigh
        expr: max by (consumer_group) (outbox_lag_seconds) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Event consumer {{ $labels.consumer_group }} is {{ $value | humanizeDuration }} behind
          description: The oldest unprocessed domain event for {{ $labels.consumer_group }} is older than 5 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonoutboxlaghigh

      - alert: SphericonDomainEventsDeadLettered
        expr: max by (consumer_group) (outbox_dead_letters) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value }} domain events of {{ $labels.consumer_group }} are dead-lettered'
          description: The {{ $labels.consumer_group }} handler gave up on these events after its retries. Fix the cause, then run `sphericon events replay {{ $labels.consumer_group }}`.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericondomaineventsdeadlettered

      - alert: SphericonEventHandlerErrors
        expr: |
          sum by (handler) (rate(watermill_messages_processed_total{error="true"}[10m]))
            / sum by (handler) (rate(watermill_messages_processed_total[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Event handler {{ $labels.handler }} fails {{ $value | humanizePercentage }} of messages
          description: More than 5% of messages handled by {{ $labels.handler }} returned an error for 15 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericoneventhandlererrors

  - name: sphericon.jobs
    rules:
      - alert: SphericonJobQueueBacklog
        expr: max by (queue) (river_queue_oldest_available_age_seconds) > 900
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Job queue {{ $labels.queue }} has had a ready job waiting {{ $value | humanizeDuration }}
          description: The oldest job ready to run in queue {{ $labels.queue }} has waited more than 15 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonjobqueuebacklog

      - alert: SphericonJobFailureRatioHigh
        expr: |
          sum by (queue) (rate(river_work_count_total{status!="ok"}[15m]))
            / sum by (queue) (rate(river_work_count_total[15m])) > 0.2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Jobs in queue {{ $labels.queue }} fail {{ $value | humanizePercentage }} of attempts
          description: More than 20% of job attempts in queue {{ $labels.queue }} errored or panicked for 30 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonjobfailureratiohigh

  - name: sphericon.database
    rules:
      - alert: SphericonDBPoolSaturated
        expr: max by (pool) (db_pool_in_use / db_pool_max) >= 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Database pool {{ $labels.pool }} is {{ $value | humanizePercentage }} in use
          description: Connections in pool {{ $labels.pool }} have been at 90% of the configured maximum for 10 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericondbpoolsaturated

      - alert: SphericonDBPoolWaits
        expr: sum by (pool) (increase(db_pool_wait_count[15m])) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Requests are waiting for a connection from pool {{ $labels.pool }}
          description: More than 100 connection waits in 15 minutes on pool {{ $labels.pool }} (the app pool is sql, the job queue pool is river).
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericondbpoolwaits

  - name: sphericon.deliverability
    rules:
      - alert: SphericonEmailSendErrorsHigh
        expr: |
          sum by (provider) (rate(email_send_outcomes_total{status="error"}[15m]))
            / sum by (provider) (rate(email_send_outcomes_total{status=~"accepted|error"}[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Provider {{ $labels.provider }} rejects {{ $value | humanizePercentage }} of sends
          description: More than 10% of send attempts through {{ $labels.provider }} failed for 15 minutes.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonemailsenderrorshigh

      - alert: SphericonEmailBounceRateHigh
        expr: |
          sum by (provider) (increase(email_send_outcomes_total{status="bounce"}[1h]))
            / sum by (provider) (increase(email_send_outcomes_total{status="accepted"}[1h])) > 0.05
          and sum by (provider) (increase(email_send_outcomes_total{status="accepted"}[1h])) > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Bounce rate through {{ $labels.provider }} is {{ $value | humanizePercentage }}
          description: More than 5% of messages accepted by {{ $labels.provider }} bounced in the last hour.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonemailbounceratehigh

      - alert: SphericonEmailComplaintRateHigh
        expr: |
          sum by (provider) (increase(email_send_outcomes_total{status="complaint"}[1h]))
            / sum by (provider) (increase(email_send_outcomes_total{status="accepted"}[1h])) > 0.001
          and sum by (provider) (increase(email_send_outcomes_total{status="accepted"}[1h])) > 1000
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Complaint rate through {{ $labels.provider }} is {{ $value | humanizePercentage }}
          description: More than 0.1% of messages accepted by {{ $labels.provider }} drew a spam complaint in the last hour.
          runbook_url: https://getsphericon.com/docs/operations/runbook#sphericonemailcomplaintratehigh
