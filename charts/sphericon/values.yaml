# Image. The tag defaults to the chart appVersion; pin an explicit version in production.
image:
  repository: ghcr.io/getsphericon/sphericon
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

# Required unless secretFiles.secretName is set. Name of an existing Secret with the keys DATABASE_URL, SPHERICON_JWT_SECRET and
# SPHERICON_ENCRYPTION_KEY. The chart never creates it: the migrate hook Job runs before regular
# resources, so the Secret must already exist.
existingSecret: ''

# Alternative to existingSecret for Docker/Kubernetes-style secret files (docs/self-hosting.md,
# "Secrets from files"). secretName is an existing Secret mounted at /run/secrets/sphericon; keys lists
# the variables it holds (DATABASE_URL, SPHERICON_JWT_SECRET, SPHERICON_ENCRYPTION_KEY,
# SPHERICON_SMTP_PASS, SPHERICON_LICENSE_KEY), each exported as <KEY>_FILE. Set existingSecret too for
# any variable not listed in keys.
secretFiles:
  secretName: ''
  keys: []

# Public base URL of the instance (SPHERICON_APP_URL).
appUrl: ''

# Extra plain environment variables for the Deployment and the migrate Job
# (name/value or valueFrom entries, e.g. SPHERICON_SMTP_HOST, SPHERICON_APP_LOCALE).
extraEnv: []

service:
  type: ClusterIP
  port: 80

# Port the application listens on (PORT).
containerPort: 3000

# Opt-in internal Prometheus listener (SPHERICON_METRICS_ADDR, ADR 0018). Off by default. It is never
# exposed through the public Service or the Ingress.
metrics:
  enabled: false
  port: 9090
  serviceMonitor:
    # Requires the Prometheus Operator CRDs. Needs metrics.enabled.
    enabled: false
    interval: 30s
    labels: {}
  # Example alerting rules (docs/operations/monitoring.md). Requires the Prometheus Operator
  # CRDs and metrics.enabled. Off by default.
  prometheusRule:
    enabled: false
    # Extra labels, e.g. the release label your Prometheus ruleSelector matches.
    labels: {}
    # Base URL of the runbook; each alert links to <runbookUrl>#<alertname>.
    runbookUrl: https://docs.getsphericon.app/operations/runbook

migrate:
  backoffLimit: 1
  activeDeadlineSeconds: 300

ingress:
  enabled: false
  className: ''
  annotations: {}
  host: sphericon.example.com
  tls:
    enabled: false
    secretName: ''

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
