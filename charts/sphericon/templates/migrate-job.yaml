# Runs `sphericon migrate` (goose migrations and river's schema) before install and upgrade.
# Hooks run before regular resources, so the Deployment only rolls once this succeeded.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sphericon.fullname" . }}-migrate
  labels:
    {{- include "sphericon.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "sphericon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "sphericon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          envFrom:
            {{- include "sphericon.envFrom" . | nindent 12 }}
          env:
            {{- include "sphericon.env" . | nindent 12 }}
          {{- if .Values.secretFiles.secretName }}
          volumeMounts:
            {{- include "sphericon.secretFileMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.secretFiles.secretName }}
      volumes:
        {{- include "sphericon.secretFileVolume" . | nindent 8 }}
      {{- end }}
