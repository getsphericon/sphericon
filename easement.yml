# No core tier (kernel, infrastructure, domain) and no Enterprise module or use case imports a
# surface's generated package: what the core shares with a contract is generated into the kernel
# (the scope vocabulary, internal/kernel/tokenscope), and an Enterprise vocabulary into the module
# that owns it (the Service credential scopes, ee/domain/identity/servicecredentials).
x-no-surface-gen: &no-surface-gen
  name: gen-surfaces
  because: no core tier and no Enterprise module or use case imports an API surface's generated package (ADR 0102); a vocabulary shared with a contract is generated into the kernel, as the user scope vocabulary is into internal/kernel/tokenscope, or into the module that owns it, as the Service credential scopes are into ee/domain/identity/servicecredentials
x-no-container: &no-container
  - name: github.com/samber/do
    because: no domain module or handler sees the DI container; a new dependency is a provider in internal/app/container.go (docs/architecture/backend.md, DI)
# The global i18next instance belongs to @workflowbuilder/sdk, which re-initialises it at import time;
# the app runs on its own instance (src/i18n.ts). The types (`TFunction`, `i18n`) stay allowed.
x-no-global-i18n: &no-global-i18n
  forbid_symbol:
    - name: i18next.i18next
      because: the app's strings live on its own instance from src/i18n.ts, reached through useTranslation; the global one is the workflow builder SDK's, which wipes it on import
x-no-dayjs: &no-dayjs
  name: dayjs
  because: dates go through src/utils/datetime.ts (src/AGENTS.md), which holds the plugins, the time zone and the formats

components:
  # The public API surfaces. Each has its own TypeSpec contract, handler package and auth scheme.
  api-site: { in: internal/api/site }
  api-external: { in: internal/api/external }
  api-collect: { in: internal/api/collect }
  api-staff: { in: internal/api/staff }
  # The OAuth 2.1 server for MCP connectors (ADR 0016): its protocol endpoints, a driver beside the
  # surfaces, with no TypeSpec contract of its own (the protocol's RFCs are its contract).
  api-oauth: { in: internal/api/oauth }
  # The security handlers every surface shares.
  api-auth: { in: internal/api/auth }
  # The answer of every refusal on every surface (ADR 0103): shared surface code like the security
  # handlers, so it sits among the drivers and the core never reaches it.
  api-problem:
    in: internal/api/problem
    allow_importers: [api-site, api-external, api-collect, api-staff, mcp, ee-api, wiring]
    because: the Problem mapping is the surfaces' own code (it imports every surface's generated package); a core package returns its refusal and never decides the answer

  # The wiring: the places that may build the whole program, and so may reach the Enterprise Edition.
  wiring:
    in:
      [
        internal/app,
        internal/server,
        internal/testhelper,
        internal/doctor,
        internal/healthcheck,
        cmd/server,
      ]

  # The Enterprise Edition (ADR 0014, ADR 0102) has the core's shape: its domain modules in
  # ee/domain/<context>/<module>, its use cases in ee/usecase/<name>, its surfaces in ee/api and
  # the Edition ee/ee.go, with the License key's gate (ee/licensekey) beside them. Its boundary with
  # the core is unchanged: the core never imports it (no core component lists an ee component, and
  # each ee component names its importers), and only the wiring assembles it.
  #
  # The handlers of the Enterprise surfaces (the Staff console's Enterprise sections and the service
  # endpoints), over the modules ee/domain/insights/workspaceoversight and ee/domain/identity/servicecredentials.
  # The Edition (ee/ee.go) builds them.
  ee-api:
    in: 'ee/api/**'
    allow_importers: [ee-edition]
    because: an Enterprise surface is built by the Edition (ee/ee.go), which the wiring mounts; no Enterprise module reaches a handler
  # The Edition itself (ee/ee.go): the one package that assembles the Enterprise modules and surfaces.
  ee-edition:
    in: 'ee/*.go'
    allow_importers: [wiring]
    because: only the wiring assembles the Enterprise Edition
  # The runtime License key's gate (ee/licensekey): it imports nothing of ours, and every Enterprise
  # package asks it what the License switches on.
  ee-licensekey:
    in: ee/licensekey
    allow_importers:
      [
        wiring,
        ee-edition,
        ee-api,
        ee-usecase,
        ee-usecase-raw,
        ee-domain-identity,
        ee-domain-identity-raw,
        ee-domain-insights,
        ee-domain-insights-raw,
      ]
    because: the core never imports the Enterprise Edition; the wiring reads the License key, and every Enterprise package asks it what the License switches on
  # The Enterprise use cases (ADR 0102, ADR 0112): an operation no single module can own, such as
  # the advanced-retention prune over the License, the Workspaces' windows and the Audit entries. Each directory under ee/usecase is one use case; none imports another, and only an
  # Enterprise surface, the Edition or the wiring imports one. Each holds the raw client today, so
  # each is named in `ee-usecase-raw` (one pattern each, so each is an instance); a new one that
  # holds no raw client lands in `ee-usecase`.
  ee-usecase:
    in: ee/usecase/*
    isolated: true
    optional: true
    allow_importers: [ee-api, ee-edition, wiring]
    because: an Enterprise use case is called by an Enterprise surface or a job the Edition registers, and built by the Edition; no domain module imports one, and no use case imports another (ADR 0102)
  ee-usecase-raw:
    in: ['ee/usecase/auditlogretention*']
    isolated: true
    allow_importers: [ee-api, ee-edition, wiring]
    because: an Enterprise use case is called by an Enterprise surface or a job the Edition registers, and built by the Edition; no domain module imports one, and no use case imports another (ADR 0102)
  # The Enterprise domain modules (ADR 0102), in the core's contexts: an Enterprise module of a
  # context imports the core's modules of its context and of the contexts below, and the Enterprise
  # modules of those contexts, never one above. Identity: the Service credentials (the machine
  # identity of the service endpoints), which hold the raw client.
  ee-domain-identity-raw:
    in: ee/domain/identity/servicecredentials
    allow_importers:
      [
        ee-domain-identity,
        ee-domain-insights-raw,
        ee-domain-insights,
        ee-usecase,
        ee-usecase-raw,
        ee-api,
        ee-edition,
        wiring,
      ]
    because: an Enterprise domain module is reached by the Enterprise use cases, surfaces and modules of its context and above, the Edition and the wiring; the core never imports the Enterprise Edition
  ee-domain-identity:
    in: 'ee/domain/identity/**'
    optional: true
    allow_importers:
      [
        ee-domain-identity-raw,
        ee-domain-insights-raw,
        ee-domain-insights,
        ee-usecase,
        ee-usecase-raw,
        ee-api,
        ee-edition,
        wiring,
      ]
    because: an Enterprise domain module is reached by the Enterprise use cases, surfaces and modules of its context and above, the Edition and the wiring; the core never imports the Enterprise Edition
  # Insights: the Audit entries (auditentries), the Erasures of the Export streams (erasures) and
  # the Usage figures (usages), which own their tables and hold the raw client, the Abuse detector
  # (abusedetector), its limits, its reading of a Workspace's standing and its hourly pass over
  # every Workspace, which holds the raw client (ADR 0112), and the Workspace oversight
  # (workspaceoversight), the Staff's and the services' look across Workspaces, which holds the raw
  # client and sits at the top of the context: it calls the identity and sending modules and the
  # other insights modules, of the core and of the Edition.
  ee-domain-insights-raw:
    in:
      [
        ee/domain/insights/abusedetector,
        ee/domain/insights/auditentries,
        ee/domain/insights/erasures,
        ee/domain/insights/usages,
        ee/domain/insights/workspaceoversight,
      ]
    allow_importers: [ee-domain-insights, ee-usecase, ee-usecase-raw, ee-api, ee-edition, wiring]
    because: an Enterprise domain module is reached by the Enterprise use cases, surfaces and modules of its context, the Edition and the wiring; the core never imports the Enterprise Edition
  ee-domain-insights:
    in: 'ee/domain/insights/**'
    optional: true
    allow_importers:
      [ee-domain-insights-raw, ee-usecase, ee-usecase-raw, ee-api, ee-edition, wiring]
    because: an Enterprise domain module is reached by the Enterprise use cases, surfaces and modules of its context, the Edition and the wiring; the core never imports the Enterprise Edition

  # Frontend (src/AGENTS.md). Generated clients are leaves; a route file binds a page lazily and
  # never imports it, so a page may import its route's `Route` without a cycle.
  web-generated: { in: src/generated }
  web-routes: { in: src/routes }
  # `foo.lazy.tsx` is where the page is bound; `foo.tsx` (guards, search schemas) never sees it.
  web-route-lazy: { in: 'src/routes/**/*.lazy.tsx' }
  # Each directory under src/pages is a feature; features share through src/components, hooks and utils.
  web-pages:
    in: src/pages/*
    isolated: true
    because: a page feature never imports another feature's page; what two features share lives in src/components, src/hooks or src/utils
  web-console: { in: src/console }
  web-shared: { in: [src/components, src/hooks, src/layouts, src/resources, src/utils] }
  # The files directly under src/: router, guards, theme, instance, i18n, entry points.
  web-app: { in: 'src/*' }

  # The drivers (ADR 0102) are the API surfaces above, MCP and the job runner: each receives input,
  # calls a domain module or a use case and returns or records the result (review rule 5), and no
  # core tier imports one. Only the wiring builds MCP and the runner; a package with jobs of its own
  # hands them in as a jobextension.Extension.
  mcp:
    in: internal/mcpserver
    allow_importers: [wiring]
    because: MCP is a driver (ADR 0102) that only the wiring mounts; no core tier imports it
  runner:
    in: internal/jobs
    allow_importers: [wiring]
    because: the job runner is a driver (ADR 0102) that only the wiring builds; no domain module imports it, and a package with jobs of its own hands them in as a jobextension.Extension

  # The use cases (ADR 0102, ADR 0112): an operation whose subject's owner would have to call a
  # module above it, or that no single module can own, such as deleting a Tag after the Removal
  # check of the modules that name it. Each directory under internal/usecase is
  # one use case; it calls the domain modules, opens the transaction they join and takes the
  # Workspace lock where ADR 0099 requires it. Only a driver or the wiring imports one.
  usecase:
    in: internal/usecase/*
    isolated: true
    allow_importers: [api-site, api-external, api-collect, api-staff, api-oauth, runner, wiring]
    because: a use case is called by a driver (an API surface, MCP, a job) and built by the wiring; no domain module imports one, and no use case imports another (ADR 0102)
  # The use cases whose rows belong to no Workspace when the operation starts, so there is no
  # *ent.Scoped to take: the Second factor of a User, the exchange of an OAuth code or refresh
  # token, a secret that names its grant, the deletion cycle of a Workspace, which lists the
  # Workspaces that have no scope yet, the creation of a Workspace, the Sign-up with the steps
  # that make a User Verified with its first one, and Notice delivery, which reads a User or a
  # Workspace's Owners by the ids an event names. They hold the raw client (the closed list of
  # docs/architecture/workspace-scoping.md, Workspace scoping) and are isolated like every use case: one pattern
  # each, so each is an instance, and neither `usecase` nor `usecase-raw` imports the other.
  usecase-raw:
    in:
      [
        'internal/usecase/secondfactorcheck*',
        'internal/usecase/connectionissuance*',
        'internal/usecase/workspacedeletion*',
        'internal/usecase/workspacecreation*',
        'internal/usecase/signup*',
        'internal/usecase/noticedelivery*',
      ]
    isolated: true
    allow_importers: [api-site, api-external, api-collect, api-staff, api-oauth, runner, wiring]
    because: a use case is called by a driver (an API surface, MCP, a job) and built by the wiring; no domain module imports one, and no use case imports another (ADR 0102)

  # The domain tier (ADR 0102) is internal/domain/<context>/<module>, the contexts ordered from
  # the bottom: identity -> contacts -> content -> sending -> orchestration -> insights -> instance.
  # Each context is a few components, one per privilege, named `domain-<context>[-<part>]`:
  # `domain-<context>` (the glob of the context's directory: the modules that hold no raw client),
  # `domain-<context>-raw` (the closed list of its raw-client holders, docs/architecture/workspace-scoping.md,
  # Workspace scoping), and a component of its own where a rule binds part of a context only. A
  # context's modules may import each other (a context only orders packages, it is no box with a
  # facade), so its components name each other in `may_depend_on`, with every component of the
  # contexts below and nothing above: the kernel, the infrastructure and ent are open to all
  # (common). Every package of the core is in a tier or a context; there is no catch-all.
  # The raw-client components follow the closed list "The raw *ent.Client is allowed only in" of
  # docs/architecture/workspace-scoping.md (Workspace scoping), kept in step with it. A package is the unit, so the
  # doc's narrower grants (`capturedmessages` only `Purge`, `automations` only `FenceOn`,
  # `bindings` only `PruneStartTokens`, `sendingdomains` only `Due`, `DevTXTLookup` and
  # `SecretSweeps`, `integrations`, `webhookendpoints`, `rules`, `automations`, `users` and
  # `staffmembers` only their `SecretSweeps` for the re-encryption) are left to review. The composition roots, `internal/api/auth`
  # and the job runner are in the doc's list too; they sit in `wiring`, `api-auth` and `runner`,
  # which do not forbid the client.
  #
  # Identity, the bottom context: the Workspaces, the Memberships, the Users, the Invitations, the
  # Join domains, the API tokens, the Staff members, the OAuth clients, the second step of signing
  # in (Passkeys, Recovery codes), sign-in and sign-up (login, signinprovider, Consent records, Sign-up
  # items, the Sign-up survey responses), suspension, the Account link and the service feeds of Users and
  # Workspaces.
  # Its bottom: the Workspace with its settings and its deletion window, and the Memberships with the
  # Permissions, the Owners and the notices to them. Every module may read a Workspace, ask a
  # Permission or tell the Owners something, so these two import no domain module; both hold the
  # raw client (the closed list of docs/architecture/workspace-scoping.md, Workspace scoping).
  domain-identity-base:
    { in: [internal/domain/identity/workspaces, internal/domain/identity/memberships] }
  # User deletion's module: the one caller of memberships.LeaveDoomedWorkspaceIn (the only Owner
  # leaving a Workspace in its deletion window), which every other component is forbidden.
  domain-identity-users: { in: internal/domain/identity/users }
  # The raw-client holders of identity (docs/architecture/workspace-scoping.md, Workspace scoping).
  domain-identity-raw:
    in:
      [
        internal/domain/identity/consentrecords,
        internal/domain/identity/invitations,
        internal/domain/identity/joindomains,
        internal/domain/identity/oauthclients,
        internal/domain/identity/passkeys,
        internal/domain/identity/recoverycodes,
        internal/domain/identity/signupitems,
        internal/domain/identity/signupsurveyresponses,
        internal/domain/identity/staffmembers,
        internal/domain/identity/suspension,
        internal/domain/identity/usertombstones,
        internal/domain/identity/workspacefeed,
      ]
  # The rest of identity, which holds no raw client; a new module under internal/domain/identity
  # lands here.
  domain-identity: { in: 'internal/domain/identity/**' }

  # Contacts, above identity: the Contacts with their Custom fields and Tags, the Segments and the
  # Conditions they hold, the consent of a Destination (the Confirmations, the Unsubscribes and the
  # stops read in the Channel, channelstop), the Suppressions, eligibility, the Visitors, the Orders
  # and the Event recording (eventrecording, ADR 0112), with the Contact row lock (contactlock) and the hook that keeps stored addresses lower-cased
  # (emailcase: it targets the Contacts as well as identity's Users and Invitations). None holds the
  # raw client, so the context is one component; a raw-client holder would get
  # `domain-contacts-raw`. Counting an unsubscribe on a Broadcast and ending an Enrollment is the
  # unsubscribe use case's (internal/usecase/unsubscriberecording): the orchestration modules are
  # above contacts, so a contacts module cannot import them.
  domain-contacts: { in: 'internal/domain/contacts/**' }

  # Content, above contacts: the email Templates, the Brand kit and the lifecycle every Versioned
  # definition shares (versioneddefinition). None holds the raw client, so the context is one component.
  domain-content: { in: 'internal/domain/content/**' }

  # Sending, above content: the Outbound send with its Holds and send limits (providerlimit), the
  # Integrations and the Presets that read their callbacks, the Sending domains with their DKIM and
  # DMARC primitives, the Tracking domains and their host changes, the Bindings of Telegram
  # chats, the Message tokens (messagetoken), the Link clicks (linkclick), reputation, the Private relay ranges of Machine
  # engagement and the Captured messages. Its raw-client holders (docs/architecture/workspace-scoping.md, Workspace scoping) are
  # `domain-sending-raw`.
  domain-sending-raw:
    in:
      [
        internal/domain/sending/bindings,
        internal/domain/sending/capturedmessages,
        internal/domain/sending/integrations,
        internal/domain/sending/privaterelayranges,
        internal/domain/sending/sendingdomains,
        internal/domain/sending/trackingdomains,
        internal/domain/sending/trackinghostchanges,
      ]
  # The rest of sending, which holds no raw client; a new module under internal/domain/sending
  # lands here.
  domain-sending: { in: 'internal/domain/sending/**' }

  # Orchestration, above sending: what targets Contacts and sends through the contexts below, the
  # Broadcasts, the Automations with their stored Steps (automationstep), the Rules and the
  # Webhook endpoints, with the one shape of a refused removal (liveuse), a leaf below the modules
  # that return it, and the Removal check at its top (removalcheck, a component of its own). Its
  # raw-client holders (docs/architecture/workspace-scoping.md, Workspace scoping) are `domain-orchestration-raw`.
  domain-orchestration-raw:
    in:
      [
        internal/domain/orchestration/automations,
        internal/domain/orchestration/rules,
        internal/domain/orchestration/webhookendpoints,
      ]
  # The Removal check (GLOSSARY "Removal check"): the one importer of the readers of what may hold
  # a row (`domain-*-removalcheck-readers`). It holds no raw client and is called by the use cases
  # that remove a checked row.
  domain-orchestration-removalcheck:
    in: internal/domain/orchestration/removalcheck
    allow_importers: [usecase, wiring]
    because: the Removal check runs inside a use case's transaction under the Workspace lock (ADR 0099), before its unchecked removal; a domain module never removes a row another module may hold
  # The readers of the Removal check: each owner that may hold a row keeps them in a subpackage
  # `<module>use`, which may import its owner and which the owner does not import (the Definition
  # use of the Segments, Rules, Automations and armed Broadcasts, the Live use that sends of the
  # Broadcasts and Automations). They are opened to the Removal check alone, so every removal that
  # checks a row reads every holder, and a new holder is a reader the Removal check adds (ADR 0110:
  # a fence by place). There is one component per context, so a reader keeps its owner's place in
  # the order of contexts. Tests of the owners are not checked.
  domain-contacts-removalcheck-readers:
    in: internal/domain/contacts/segments/segmentsuse
    allow_importers: [domain-orchestration-removalcheck]
    because: a reader of what may hold a row is the Removal check's (internal/domain/orchestration/removalcheck, ADR 0049, ADR 0099), the one list of the holders; a removal that checks a row calls the Removal check under the Workspace lock
  domain-orchestration-removalcheck-readers:
    in:
      [
        internal/domain/orchestration/automations/automationsuse,
        internal/domain/orchestration/broadcasts/broadcastsuse,
        internal/domain/orchestration/rules/rulesuse,
      ]
    allow_importers: [domain-orchestration-removalcheck]
    because: a reader of what may hold a row is the Removal check's (internal/domain/orchestration/removalcheck, ADR 0049, ADR 0099), the one list of the holders; a removal that checks a row calls the Removal check under the Workspace lock
  # The rest of orchestration, which holds no raw client; a new module under
  # internal/domain/orchestration lands here.
  domain-orchestration: { in: 'internal/domain/orchestration/**' }

  # Insights, above orchestration: the read packages that look across the contexts below without
  # owning a table, the Setup checklist, the read side of the Audit log (auditlog) and of the Export
  # streams (exportstream), the Abuse warning the Enterprise Abuse detector fills (abusewarning) and
  # the Data export of one Contact (dataexport). None holds the raw client, so the context is one
  # component.
  domain-insights: { in: 'internal/domain/insights/**' }

  # Instance, the top context: what belongs to the Instance rather than to a Workspace, its state
  # (instancestates) and its audit log (instanceauditentries), which hold the raw client
  # (`domain-instance-raw`), the in-place upgrade of a bare binary (upgrade) and the Upgrade notes
  # of the changelog (upgradenote). The Release check and the Telemetry report are instancestates'
  # own operations (ADR 0112), so it is the client of the Telemetry contract (gen/telemetry).
  domain-instance-raw:
    in: [internal/domain/instance/instancestates, internal/domain/instance/instanceauditentries]
  # The rest of instance, which holds no raw client; a new module under internal/domain/instance
  # lands here.
  domain-instance: { in: 'internal/domain/instance/**' }

  # The infrastructure tier (ADR 0102): the bus, the database connection and migrations, the message
  # providers, the outbound HTTP calls, the throttles, the ent aggregate functions the reports share
  # (aggregates), logging and OpenTelemetry, and the process's
  # configuration (`config`, read by them). It imports only the kernel and never a domain module.
  infra: { in: [internal/infra, config] }
  # The infrastructure packages that hold the raw client (the closed list of docs/architecture/workspace-scoping.md,
  # Workspace scoping): the bus (docs/design/domain-events.md), which stores an Event and queues the
  # jobs of the consumers the wiring registers on it, the database package's schema guard, and the
  # Login throttle, whose counters belong to an address, not a Workspace.
  infra-raw: { in: [internal/infra/events, internal/infra/db, internal/infra/throttle] }

  # The kernel (ADR 0102): the packages that import none of ours. The vocabulary every tier shares
  # (Channels, providers, Hold reasons, the token scopes, job kinds) and the helpers that know no
  # domain module (i18n, validation, pagination, the renderers, the secrets, the credentials).
  kernel: { in: internal/kernel }
  # The generated ent client: a component so the kernel can name it (kernel: must_not_depend_on); to
  # everyone else it stays open (common).
  ent: { in: ent }
  # The generated ogen packages of the API surfaces, which only the drivers, the wiring and the
  # Enterprise Edition import, and the Telemetry contract's client, which the Telemetry report of
  # the Instance state (instancestates) uses.
  gen-surfaces: { in: gen }
  gen-telemetry: { in: gen/telemetry }

  # The packages behind the repository's own commands under cmd/ that are not the application: the
  # generators (scopegen, the fixture catalog, goverter's enum transformer) and the CI checks
  # (contractcopy, prcheck, upgradecheck). No tier, no driver and no wiring imports one.
  tools:
    in:
      [
        internal/contractcopy,
        internal/fixtures/fixturegen,
        internal/goverterenum,
        internal/prcheck,
        internal/scopegen,
        internal/upgradecheck,
      ]
    allow_importers: []
    because: a tool package serves a command of the repository under cmd/ (a generator or a CI check), never the application
  # What tests share below the harness: the committed fixtures' loader and catalog (fixtures, which
  # cmd/seed also loads into the development database), an in-process DNS server (dnstest) and the
  # check of a Telemetry report against its contract (telemetryschema). Tests are not checked, so
  # only the harness is a checked importer.
  testsupport:
    in: [internal/fixtures, internal/dnstest, internal/telemetryschema]
    allow_importers: [wiring]
    because: test support serves the tests and the harness (internal/testhelper), and the seeding command; no tier and no driver imports it

# Every component may use the infrastructure (publish through the bus, among others) and the kernel,
# and import the generated ent client.
common: [infra, infra-raw, kernel, ent]

# Files that are not part of a component's own layer (tests drive whole programs).
exclude: ['**/*_test.go', '**/*.test.ts', '**/*.test.tsx', 'src/test/**', '**/testdata/**']

# Generated code stays in the graph as a target (a page may import a client, a handler its ogen
# package, nothing may import the other way) but its own imports are not checked.
target_only: ['src/generated/**', '**/*.gen.ts', '**/*_gen.go']

rules:
  api-site:
    may_depend_on:
      [
        api-auth,
        api-problem,
        domain-orchestration-raw,
        domain-orchestration,
        domain-insights,
        domain-instance-raw,
        domain-identity,
        domain-identity-raw,
        domain-identity-users,
        domain-identity-base,
        domain-contacts,
        domain-content,
        domain-sending-raw,
        domain-sending,
        gen-surfaces,
        usecase,
        usecase-raw,
      ]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-external:
    may_depend_on:
      [
        api-auth,
        api-problem,
        domain-orchestration-raw,
        domain-orchestration,
        domain-insights,
        domain-identity,
        domain-identity-users,
        domain-identity-base,
        domain-contacts,
        domain-content,
        domain-sending-raw,
        domain-sending,
        gen-surfaces,
        usecase,
      ]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-collect:
    may_depend_on:
      [api-auth, api-problem, domain-contacts, domain-sending-raw, gen-surfaces, usecase]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-staff:
    may_depend_on:
      [
        api-problem,
        domain-insights,
        domain-instance-raw,
        domain-identity,
        domain-identity-raw,
        gen-surfaces,
      ]
    forbid_external: *no-container
    because: the Staff surface depends on the Problem mapping and the core (its session check is the Staff member module's), never on another surface
  api-oauth:
    may_depend_on: [domain-identity-raw, usecase-raw]
    forbid_external: *no-container
    because: the OAuth server reads and registers OAuth clients through their module and exchanges a grant through its use case, never through another surface
  mcp:
    may_depend_on: [api-auth, api-problem, domain-identity, gen-surfaces]
    forbid_external: *no-container
    because: MCP projects the external API's operations as tools over the shared auth handlers and the Problem mapping, never over another surface's handlers
  api-auth:
    may_depend_on: [domain-identity, domain-identity-users, domain-identity-base, gen-surfaces]
    forbid_external: *no-container
    because: the security handlers sit below every surface
  api-problem:
    may_depend_on: [domain-orchestration, domain-identity-users, domain-identity-base, gen-surfaces]
    forbid_external: *no-container
    because: the Problem mapping sits below every surface and reads only the refusals the core returns
  domain-contacts:
    may_depend_on: [domain-identity-base]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: contacts sits above identity in the domain tier (ADR 0102), so a contacts module imports the kernel, the infrastructure, ent, the other contacts modules and identity's (an allowance added with its first import), never a module of a context above (a Template, an Integration, a Broadcast, an Automation, a Rule) nor a use case; an operation that needs one is a use case above both
  domain-content:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: content sits above contacts in the domain tier (ADR 0102), so a content module imports the kernel, the infrastructure, ent, the other content modules and those of identity and contacts (an allowance added with its first import), never a module of a context above (an Integration, an Outbound message, a Broadcast, an Automation, a Rule) nor a use case; an operation that needs one is a use case above both
  domain-sending-raw:
    may_depend_on: [domain-sending, domain-contacts, domain-identity-raw]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: sending sits above content in the domain tier (ADR 0102), so a sending module imports the kernel, the infrastructure, ent, the other sending modules and those of identity, contacts and content, never a module of a context above (a Broadcast, an Automation, a Rule, a Webhook endpoint) nor a use case; an operation that needs one is a use case above both
  domain-sending:
    may_depend_on: [domain-sending-raw, domain-contacts, domain-identity-base]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: sending sits above content in the domain tier (ADR 0102), so a sending module imports the kernel, the infrastructure, ent, the other sending modules and those of identity, contacts and content, never a module of a context above (a Broadcast, an Automation, a Rule, a Webhook endpoint) nor a use case; an operation that needs one is a use case above both
  domain-orchestration-raw:
    may_depend_on: [domain-orchestration, domain-contacts, domain-content, domain-sending]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: orchestration sits above sending in the domain tier (ADR 0102), so an orchestration module imports the kernel, the infrastructure, ent, the other orchestration modules and those of identity, contacts, content and sending, never a module of a context above (the Setup checklist, an Export stream, the Instance state) nor a use case; an operation that needs one is a use case above both
  domain-orchestration:
    may_depend_on: [domain-contacts, domain-sending]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: orchestration sits above sending in the domain tier (ADR 0102), so an orchestration module imports the kernel, the infrastructure, ent, the other orchestration modules and those of identity, contacts, content and sending, never a module of a context above (the Setup checklist, an Export stream, the Instance state) nor a use case; an operation that needs one is a use case above both
  domain-orchestration-removalcheck:
    may_depend_on:
      [
        domain-contacts-removalcheck-readers,
        domain-orchestration-removalcheck-readers,
        domain-orchestration,
      ]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: the Removal check sits at the top of orchestration (ADR 0102), so it imports the readers of the modules that may hold a row and the other orchestration modules, never a module of a context above nor a use case
  domain-contacts-removalcheck-readers:
    may_depend_on: [domain-contacts]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: a reader belongs to its owner's context (ADR 0102), so a contacts reader imports its owner and the modules of contacts and below, never a module of a context above nor a use case
  domain-orchestration-removalcheck-readers:
    may_depend_on: [domain-orchestration-raw, domain-orchestration, domain-contacts]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: a reader belongs to its owner's context (ADR 0102), so an orchestration reader imports its owner, the modules beside it and those below, never a module of a context above nor a use case
  domain-insights:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: insights sits above orchestration in the domain tier (ADR 0102), so an insights package imports the kernel, the infrastructure, ent and the packages of its own context and of the contexts below, (an allowance added with its first import), never a module of the instance context (the Instance state, an upgrade) nor a use case; an operation that needs one is a use case above both
  domain-instance-raw:
    may_depend_on: [domain-identity-base, domain-sending, gen-telemetry]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: instance is the top context of the domain tier (ADR 0102), so an instance module imports the kernel, the infrastructure, ent and the modules of every context (an allowance added with its first import) and the Telemetry contract's client its Telemetry report sends with (ADR 0112), never a use case
  domain-instance:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: instance is the top context of the domain tier (ADR 0102), so an instance module imports the kernel, the infrastructure, ent and the modules of every context (an allowance added with its first import), never a use case
  tools:
    may_depend_on: []
    forbid_external: *no-container
    because: a tool package reads files and contracts, never the application's modules; what it needs from the application is the kernel
  testsupport:
    may_depend_on: [domain-identity-raw]
    forbid_external: *no-container
    because: test support loads the committed fixtures through the modules' own functions where one exists (an Invitation's token) and knows no driver
  usecase:
    may_depend_on:
      [
        domain-orchestration-removalcheck,
        domain-orchestration-raw,
        domain-orchestration,
        domain-insights,
        domain-instance,
        domain-identity-base,
        domain-contacts,
        domain-sending-raw,
        domain-sending,
      ]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: a use case composes the domain modules (ADR 0102); a piece two use cases share moves down into the domain module that owns it, and the kernel, the infrastructure and ent are open to it (common)
  usecase-raw:
    may_depend_on:
      [
        domain-orchestration-raw,
        domain-orchestration,
        domain-instance-raw,
        domain-identity,
        domain-identity-raw,
        domain-identity-users,
        domain-identity-base,
        domain-contacts,
        domain-content,
        domain-sending-raw,
        domain-sending,
      ]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: a use case composes the domain modules (ADR 0102); these hold the raw client because their rows belong to no Workspace when they start, and like the raw-client holders of the core they install no ent hook
  domain-identity-base:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: the Workspace and its Memberships sit at the bottom of identity (ADR 0102); every module may read them, so they import only the kernel and the infrastructure, never a domain module
  domain-identity-users:
    may_depend_on: [domain-identity, domain-identity-raw, domain-identity-base]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: identity is the bottom context of the domain tier (ADR 0102), so an identity module imports the kernel, the infrastructure, ent and the other identity modules, never a module of a context above (a Contact, a send cap, a Broadcast) nor a use case; an operation that needs one is a use case above both
  domain-identity-raw:
    may_depend_on: [domain-identity, domain-identity-users, domain-identity-base]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: identity is the bottom context of the domain tier (ADR 0102), so an identity module imports the kernel, the infrastructure, ent and the other identity modules, never a module of a context above (a Contact, a send cap, a Broadcast) nor a use case; an operation that needs one is a use case above both
  domain-identity:
    may_depend_on: [domain-identity-users, domain-identity-base]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: identity is the bottom context of the domain tier (ADR 0102), so an identity module imports the kernel, the infrastructure, ent and the other identity modules, never a module of a context above (a Contact, a send cap, a Broadcast) nor a use case; an operation that needs one is a use case above both
  runner:
    may_depend_on:
      [
        domain-orchestration-raw,
        domain-orchestration,
        domain-instance-raw,
        domain-identity-raw,
        domain-identity-users,
        domain-identity-base,
        domain-contacts,
        domain-sending-raw,
        domain-sending,
        usecase,
        usecase-raw,
      ]
    forbid_external: *no-container
    because: the job runner calls the core and the use cases, never a surface or the Enterprise Edition; the Edition hands its jobs in through the wiring
  infra:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: infrastructure imports only the kernel and never a domain module (ADR 0102); a domain module, a use case, a driver or the wiring reaches it. The bus's consumers are registered by the wiring, and the ent client's hooks are installed there (internal/app/entclient)
  infra-raw:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: infrastructure imports only the kernel and never a domain module (ADR 0102); a domain module, a use case, a driver or the wiring reaches it. The bus's consumers are registered by the wiring, and the ent client's hooks are installed there (internal/app/entclient)
  kernel:
    may_depend_on: []
    must_not_depend_on:
      - name: infra
        because: the kernel sits below the infrastructure; a package that publishes an Event, reads the configuration or calls out is infrastructure or a domain module, not the kernel (ADR 0102)
      - name: infra-raw
        because: the kernel sits below the infrastructure; a package that publishes an Event, reads the configuration or calls out is infrastructure or a domain module, not the kernel (ADR 0102)
      - name: ent
        because: the kernel knows no table; a package that queries through ent is infrastructure or a domain module (ADR 0102)
      - *no-surface-gen
    # internal/kernel/cleanup reads the container for its shutdown report, the one exception the doc names.
    forbid_external: *no-container
    because: the kernel is the bottom tier (ADR 0102); it imports nothing of ours outside internal/kernel, so every tier can use it
  ent:
    may_depend_on: []
    because: the ent schema reads its Go types from the kernel, and the endpoint URL rule of a Webhook endpoint from internal/infra/webhook; it knows no domain module
  ee-api:
    may_depend_on:
      [
        api-problem,
        domain-identity-raw,
        domain-sending,
        domain-insights,
        ee-domain-identity-raw,
        ee-domain-insights-raw,
        gen-surfaces,
      ]
    forbid_external: *no-container
    because: an Enterprise surface receives input, calls an Enterprise use case or domain module and returns the result (review rule 5); it never holds the raw client
  ee-edition:
    may_depend_on:
      [
        domain-identity-raw,
        domain-sending,
        domain-insights,
        ee-licensekey,
        ee-domain-identity-raw,
        ee-domain-insights-raw,
        ee-usecase-raw,
        ee-api,
        gen-surfaces,
      ]
    forbid_external: *no-container
    because: the Edition builds the Enterprise modules and their surfaces on the core, never on the open surfaces' handlers
  ee-licensekey:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: the License key's gate imports nothing of ours, so every Enterprise package can ask it what the License switches on
  ee-usecase:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: an Enterprise use case composes the domain modules of the core and of the Enterprise Edition (ADR 0102); unlike a core use case it calls no unchecked removal of the core, which only the core's own use case may call
  ee-usecase-raw:
    may_depend_on: [domain-identity-base, ee-licensekey, ee-domain-insights-raw]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: an Enterprise use case composes the domain modules of the core and of the Enterprise Edition (ADR 0102); these hold the raw client because they work across Workspaces, and unlike a core use case they call no unchecked removal of the core and install no ent hook of the core
  ee-domain-identity-raw:
    may_depend_on: [ee-licensekey]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: an Enterprise identity module sits in the bottom context (ADR 0102), so it imports the kernel, the infrastructure, ent, the License key and the identity modules of the core and of the Edition, never a module of a context above nor a use case; it reads a contract's vocabulary from what is generated into it, never from a surface's generated package
  ee-domain-identity:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: an Enterprise identity module sits in the bottom context (ADR 0102), so it imports the kernel, the infrastructure, ent, the License key and the identity modules of the core and of the Edition, never a module of a context above nor a use case; it reads a contract's vocabulary from what is generated into it, never from a surface's generated package
  ee-domain-insights-raw:
    may_depend_on:
      [
        domain-identity-raw,
        domain-identity-base,
        domain-sending,
        domain-insights,
        ee-licensekey,
        ee-domain-identity-raw,
      ]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: an Enterprise insights module sits above orchestration (ADR 0102), so it imports the kernel, the infrastructure, ent, the License key and the modules of the core and of the Edition of its context and the contexts below, never an instance module nor a use case; an operation that needs one is a use case
  ee-domain-insights:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: an Enterprise insights module sits above orchestration (ADR 0102), so it imports the kernel, the infrastructure, ent, the License key and the modules of the core and of the Edition of its context and the contexts below, never an instance module nor a use case; an operation that needs one is a use case
  wiring:
    may_depend_on:
      [
        domain-orchestration-removalcheck,
        domain-orchestration-raw,
        domain-orchestration,
        domain-insights,
        domain-instance-raw,
        domain-instance,
        domain-identity,
        domain-identity-raw,
        domain-identity-users,
        domain-identity-base,
        domain-contacts,
        domain-content,
        domain-sending-raw,
        domain-sending,
        ee-licensekey,
        ee-domain-identity-raw,
        ee-domain-insights-raw,
        ee-edition,
        api-site,
        api-external,
        api-collect,
        api-staff,
        api-oauth,
        api-auth,
        api-problem,
        mcp,
        runner,
        usecase,
        usecase-raw,
        gen-surfaces,
        gen-telemetry,
        testsupport,
      ]
    because: wiring is where the program is assembled; it builds the Telemetry report's client and reads the host the report describes (ADR 0104)

  web-generated:
    may_depend_on: []
    because: generated clients come from the OpenAPI contract and import nothing of ours
  web-shared:
    <<: *no-global-i18n
    may_depend_on: [web-generated, web-routes, web-app]
    because: shared components, hooks and layouts sit below the pages; a page imports them, never the reverse (they link through a route's `Route`, never a path string)
  web-routes:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-app]
    because: a route file holds guards and search schemas and never imports a page (src/AGENTS.md)
  web-route-lazy:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-shared, web-pages, web-console, web-app]
    because: the lazy route file is the one place a page is bound to its route
  web-pages:
    <<: *no-global-i18n
    forbid_external:
      - name: '@mantine/notifications'
        because: toasts go through useNotify (src/hooks/useNotify.ts), never Mantine's global store
      - *no-dayjs
    may_depend_on: [web-generated, web-shared, web-routes, web-app]
    because: a page reaches its route through the route file's `Route` and never imports a lazy route file
  web-console:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-routes, web-app]
    because: the Staff console is its own feature and does not import the workspace pages
  web-app:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-routes]
    because: the files directly under src/ assemble the application

# Each import of a package is declared in the nearest package.json.
manifests: true

# Every checked file belongs to a component, so a new package must be assigned to one. These
# are the generated, tooling and separately built trees that have no layer of their own.
strict: true

# Files behind a build tag are indexed only with that tag; a file and its `!tag` twin cannot both
# be read, so the twin not read is accepted below. `race` stays off (`race_off.go` is read).
indexers:
  go:
    tags: [e2e, embed_spa, embed_changelog]
uncovered_ok:
  - name: '**/race_on.go'
    because: the race-detector twin of race_off.go, built only under -race
  - name: internal/domain/instance/upgradenote/embed_none.go
    because: the twin of embed.go, built when embed_changelog is off
  - name: internal/server/spa_noembed.go
    because: the twin of spa_embed.go, built when embed_spa is off
  - name: internal/kernel/emaildoc/assets/emaildoc.js
    because: the generated document renderer bundle, not source
  - name: ent/entc.go
    because: the ent codegen entry point, built with the `ignore` tag
  - name: ent/internal/schema.go
    because: generated by ent, built with the `tools` tag
unowned:
  - tools/**
  - packages/**
  - mise/**
  - cmd/**
  - e2e/**
  # The TypeSpec contract's decorators (ADR 0069), loaded by the TypeSpec compiler.
  - typespec/**
  # The frontend's ambient type declarations (the i18next resources), read by tsc, imported by none.
  - types/**
  # Tool configs and the two embed files at the repository root. A glob without a directory
  # matches at any depth (`'*.go'` would leave every Go file uncovered), so each file is named.
  - commitlint.config.ts
  - i18next.config.ts
  - knip.ts
  - openapi-ts.config.ts
  - oxfmt.config.ts
  - oxlint.config.ts
  - vite.config.ts
  - migrations.go
  - spec.go
