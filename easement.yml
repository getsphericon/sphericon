# Architecture gate (https://github.com/mokevnin/easement): `mise run check:arch`.
# The boundaries below are the ones docs/architecture.md states in prose; a violation names
# the rule's `because`, so read it before reaching for a baseline entry.
version: 1

# The rule parts several components share, merged with `<<`.
# A domain module's unchecked removal, or the store of a check's outcome (a Sending domain's DKIM
# and DMARC moments), is reachable only from its use case (ADR 0102): each is one anchored item
# here, aliased into the forbid_symbol list of every component but `usecase` and `usecase-raw`
# that may reach the core: `x-no-raw-client` (the API surfaces, the Problem mapping, ee-api),
# `raw-holder-forbids` (the runner, core-raw), `core`, `consent`; api-auth, ee, ee-edition and wiring take this
# list whole. The removal of the only Owner's Membership of a Workspace in its deletion window
# serves User deletion in `internal/users` (core-raw): core-raw alone may call it, so
# it is not in `raw-holder-forbids` but in `raw-driver-forbids` (the runner, identity-base). Its definition is not a use; a call even inside its own module fails, and tests are
# excluded. Name the function as `<import path>.<Name>`: a bare import path matches nothing.
# An unchecked change counts as one too: contacts.UpdateCustomFieldIn, the retype without its check.
# So does contacts.DeleteIn, the Contact row without the rest of its Erasure.
# So do the Second factor's writes that skip its checks (the User's factor, the Recovery codes, all
# Passkeys of a User) and the issue of an OAuth grant's credentials (the Connection, a refresh token),
# the moves of a Workspace's deletion cycle, and the creation of a Workspace with its creator's
# Membership.
x-unchecked-removals: &unchecked-removals
  - &tags-delete-in
    name: github.com/getsphericon/sphericon/internal/tags.DeleteIn
    because: deleting a Tag is the use case internal/usecase/tagdeletion, which checks the Tag's Live use under the Workspace lock first (ADR 0102, ADR 0049, ADR 0099); call the use case
  - &leave-doomed-workspace-in
    name: github.com/getsphericon/sphericon/internal/memberships.LeaveDoomedWorkspaceIn
    because: it lets the only Owner leave, which only User deletion may do, after it has refused a User who solely owns a live Workspace (ADR 0050); call memberships.Module.Leave or LeaveIn
  - &contacts-update-custom-field-in
    name: github.com/getsphericon/sphericon/internal/contacts.UpdateCustomFieldIn
    because: editing a Custom field is the use case internal/usecase/customfieldretyping, which refuses a retype while a Segment, a Rule or an armed Broadcast tests the field with a leaf the new type does not take (ADR 0102, ADR 0065); call the use case
  - &integrations-delete-in
    name: github.com/getsphericon/sphericon/internal/integrations.DeleteIn
    because: deleting an Integration is the use case internal/usecase/integrationdeletion, which checks the Integration's Live use under the Workspace lock first (ADR 0102, ADR 0049, ADR 0099); call the use case
  - &sendingdomains-delete-in
    name: github.com/getsphericon/sphericon/internal/sendingdomains.DeleteIn
    because: deleting a Sending domain is the use case internal/usecase/sendingdomaindeletion, which checks the domain's Live use under the Workspace lock first (ADR 0102, ADR 0049, ADR 0099); call the use case
  - &sendingdomains-record-dkim
    name: github.com/getsphericon/sphericon/internal/sendingdomains.RecordDKIM
    because: a Sending domain becomes verified only by a live DKIM lookup (ADR 0010), which the use case internal/usecase/domainverification runs before it stores the outcome; call the use case
  - &sendingdomains-record-dmarc
    name: github.com/getsphericon/sphericon/internal/sendingdomains.RecordDMARC
    because: a Sending domain becomes bulk-ready only by a live DMARC lookup (ADR 0012), which the use case internal/usecase/domainverification runs before it stores the outcome; call the use case
  - &contacts-delete-in
    name: github.com/getsphericon/sphericon/internal/contacts.DeleteIn
    because: deleting a Contact is Erasure, the use case internal/usecase/contacterasure, which erases the person's Events, Visitors, delivery records and queued work through their owners before the row, in one transaction (ADR 0021, ADR 0102); call the use case
  - &users-set-pending-second-factor
    name: github.com/getsphericon/sphericon/internal/users.SetPendingSecondFactor
    because: enrolling a Second factor is the use case internal/usecase/secondfactorenrolment, which refuses a User whose factor is already active (ADR 0020, ADR 0102); call the use case
  - &users-accept-second-factor-step-in
    name: github.com/getsphericon/sphericon/internal/users.AcceptSecondFactorStepIn
    because: a TOTP time step is accepted only for a code the use case internal/usecase/secondfactorenrolment has matched against the User's secret (ADR 0020, ADR 0102); call the use case
  - &users-confirm-second-factor-in
    name: github.com/getsphericon/sphericon/internal/users.ConfirmSecondFactorIn
    because: a Second factor is confirmed only by a current code, which the use case internal/usecase/secondfactorenrolment checks first (ADR 0020, ADR 0102); call the use case
  - &users-clear-second-factor-in
    name: github.com/getsphericon/sphericon/internal/users.ClearSecondFactorIn
    because: a Second factor is cleared only by its User with a code or by a reset, which the use case internal/usecase/secondfactorenrolment checks first and records (ADR 0020, ADR 0102); call the use case
  - &recoverycodes-replace-in
    name: github.com/getsphericon/sphericon/internal/recoverycodes.ReplaceIn
    because: Recovery codes are issued only with an active or a just confirmed Second factor, which the use case internal/usecase/secondfactorenrolment checks first (ADR 0020, ADR 0102); call the use case
  - &recoverycodes-delete-in
    name: github.com/getsphericon/sphericon/internal/recoverycodes.DeleteIn
    because: Recovery codes go only with their Second factor, through the use case internal/usecase/secondfactorenrolment (ADR 0020, ADR 0102); call the use case
  - &passkeys-delete-all-in
    name: github.com/getsphericon/sphericon/internal/passkeys.DeleteAllIn
    because: every Passkey of a User goes only in a Second factor reset, which the use case internal/usecase/secondfactorenrolment checks and records (ADR 0020, ADR 0052, ADR 0102); call the use case, or passkeys.Module.Remove for one Passkey
  - &apitokens-issue-connection
    name: github.com/getsphericon/sphericon/internal/apitokens.IssueConnection
    because: a Connection is issued only for an authorization code whose PKCE verifier the use case internal/usecase/oauthauthorization has checked and claimed (ADR 0016, ADR 0061, ADR 0102); call the use case
  - &apitokens-rotate-connection
    name: github.com/getsphericon/sphericon/internal/apitokens.RotateConnection
    because: a Connection rotates only for a refresh token the use case internal/usecase/oauthauthorization has checked and claimed (ADR 0016, ADR 0102); call the use case
  - &oauthclients-new-refresh-token-in
    name: github.com/getsphericon/sphericon/internal/oauthclients.NewRefreshTokenIn
    because: a refresh token is issued only with the Connection of a checked and claimed grant, by the use case internal/usecase/oauthauthorization (ADR 0016, ADR 0102); call the use case
  - &workspaces-discard-in
    name: github.com/getsphericon/sphericon/internal/workspaces.DiscardIn
    because: a Workspace is deleted only by the use case internal/usecase/workspacedeletion, which checks the typed name first and records the deletion (ADR 0043, ADR 0102); call the use case
  - &workspaces-restore-in
    name: github.com/getsphericon/sphericon/internal/workspaces.RestoreIn
    because: a deleted Workspace is restored only by the use case internal/usecase/workspacedeletion, for a User whose Role holds workspace:delete there (ADR 0043, ADR 0061, ADR 0102); call the use case
  - &workspaces-tombstone-in
    name: github.com/getsphericon/sphericon/internal/workspaces.TombstoneIn
    because: a Workspace is erased only by the use case internal/usecase/workspacedeletion, after it has removed every row the Workspace owned and the OAuth codes that name it (ADR 0043, ADR 0102); call the use case
  - &workspaces-create-in
    name: github.com/getsphericon/sphericon/internal/workspaces.CreateIn
    because: a Workspace is created only by the use case internal/usecase/workspacecreation, which refuses an Unverified User (ADR 0030), writes its Owner Membership on the same transaction and gives it the Send cap it starts with (ADR 0043, ADR 0067, ADR 0102); call the use case
  - &memberships-add-creator-in
    name: github.com/getsphericon/sphericon/internal/memberships.AddCreatorIn
    because: the creator's Owner Membership is written only with its Workspace, by the use case internal/usecase/workspacecreation (ADR 0043, ADR 0102); call the use case
x-no-raw-client: &no-raw-client
  forbid_symbol:
    - name: github.com/getsphericon/sphericon/ent.Client
      because: a handler takes a *ent.Scoped so every query is workspace-bound (docs/architecture.md, Workspace scoping)
    - *tags-delete-in
    - *leave-doomed-workspace-in
    - *contacts-update-custom-field-in
    - *integrations-delete-in
    - *sendingdomains-delete-in
    - *sendingdomains-record-dkim
    - *sendingdomains-record-dmarc
    - *contacts-delete-in
    - *users-set-pending-second-factor
    - *users-accept-second-factor-step-in
    - *users-confirm-second-factor-in
    - *users-clear-second-factor-in
    - *recoverycodes-replace-in
    - *recoverycodes-delete-in
    - *passkeys-delete-all-in
    - *apitokens-issue-connection
    - *apitokens-rotate-connection
    - *oauthclients-new-refresh-token-in
    - *workspaces-discard-in
    - *workspaces-restore-in
    - *workspaces-tombstone-in
    - *workspaces-create-in
    - *memberships-add-creator-in
# No core tier (kernel, infrastructure, domain) imports a surface's generated package: what the core
# shares with a contract is generated into the kernel (the scope vocabulary, internal/kernel/tokenscope).
x-no-surface-gen: &no-surface-gen
  name: gen-surfaces
  because: no core tier imports an API surface's generated package (ADR 0102); a vocabulary the core shares with a contract is generated into the kernel, as the scope vocabulary is into internal/kernel/tokenscope
x-no-container: &no-container
  - name: github.com/samber/do
    because: no domain module or handler sees the DI container; a new dependency is a provider in internal/app/container.go (docs/architecture.md, Backend architecture)
# The global i18next instance belongs to @workflowbuilder/sdk, which re-initialises it at import time;
# the app runs on its own instance (src/i18n.ts). The types (`TFunction`, `i18n`) stay allowed.
x-no-global-i18n: &no-global-i18n
  forbid_symbol:
    - name: i18next.i18next
      because: the app's strings live on its own instance from src/i18n.ts, reached through useTranslation; the global one is the workflow builder SDK's, which wipes it on import
x-no-dayjs: &no-dayjs
  name: dayjs
  because: dates go through src/utils/datetime.ts (src/AGENTS.md), which holds the plugins, the time zone and the formats

components:
  # The public API surfaces. Each has its own TypeSpec contract, handler package and auth scheme.
  api-site: { in: internal/api/site }
  api-external: { in: internal/api/external }
  api-collect: { in: internal/api/collect }
  api-staff: { in: internal/api/staff }
  # The security handlers every surface shares.
  api-auth: { in: internal/api/auth }
  # The answer of every refusal on every surface (ADR 0103): shared surface code like the security
  # handlers, so it sits among the drivers and the core never reaches it.
  api-problem:
    in: internal/api/problem
    allow_importers: [api-site, api-external, api-collect, api-staff, ee-api, wiring]
    because: the Problem mapping is the surfaces' own code (it imports every surface's generated package); a core package returns its refusal and never decides the answer

  # The wiring: the places that may build the whole program, and so may reach the Enterprise Edition.
  wiring:
    in:
      [
        internal/app,
        internal/server,
        internal/mcpserver,
        internal/testhelper,
        internal/doctor,
        cmd/server,
      ]

  # The handlers of the Enterprise surfaces (the Staff console's Enterprise sections and the service
  # endpoints), over their domain module in ee/staff. The Edition (ee/ee.go) builds them.
  ee-api:
    in: 'ee/api/**'
    allow_importers: [ee-edition]
    because: an Enterprise surface is built by the Edition (ee/ee.go), which the wiring mounts; no Enterprise module reaches a handler
  # The Edition itself (ee/ee.go): the one package that assembles the Enterprise modules and surfaces.
  ee-edition:
    in: 'ee/*.go'
    allow_importers: [wiring]
    because: only the wiring assembles the Enterprise Edition
  # Enterprise Edition, one binary gated by the license key.
  ee:
    in: 'ee/**'
    allow_importers: [wiring, ee-api, ee-edition]
    because: the core never imports the Enterprise Edition; only the wiring assembles it, and an Enterprise surface calls its module

  # Frontend (src/AGENTS.md). Generated clients are leaves; a route file binds a page lazily and
  # never imports it, so a page may import its route's `Route` without a cycle.
  web-generated: { in: src/generated }
  web-routes: { in: src/routes }
  # `foo.lazy.tsx` is where the page is bound; `foo.tsx` (guards, search schemas) never sees it.
  web-route-lazy: { in: 'src/routes/**/*.lazy.tsx' }
  # Each directory under src/pages is a feature; features share through src/components, hooks and utils.
  web-pages:
    in: src/pages/*
    isolated: true
    because: a page feature never imports another feature's page; what two features share lives in src/components, src/hooks or src/utils
  web-console: { in: src/console }
  web-shared: { in: [src/components, src/hooks, src/layouts, src/resources, src/utils] }
  # The files directly under src/: router, guards, theme, instance, i18n, entry points.
  web-app: { in: 'src/*' }

  # The drivers (ADR 0102) are the API surfaces above, MCP (in the wiring) and the job runner: each
  # receives input, calls a domain module or a use case and returns or records the result (review
  # rule 5), and no core tier imports one. Only the wiring builds the runner; a package with jobs of
  # its own hands them in as a jobextension.Extension.
  runner:
    in: internal/jobs
    allow_importers: [wiring]
    because: the job runner is a driver (ADR 0102) that only the wiring builds; no domain module imports it, and a package with jobs of its own hands them in as a jobextension.Extension

  # The use cases (ADR 0102): an operation that spans several domain modules, such as deleting a Tag
  # after the Live use check of the modules that name it. Each directory under internal/usecase is
  # one use case; it calls the domain modules, opens the transaction they join and takes the
  # Workspace lock where ADR 0099 requires it. Only a driver or the wiring imports one.
  usecase:
    in: internal/usecase/*
    isolated: true
    allow_importers: [api-site, api-external, api-collect, api-staff, runner, wiring]
    because: a use case is called by a driver (an API surface, MCP, a job) and built by the wiring; no domain module imports one, and no use case imports another (ADR 0102)
  # The use cases whose rows belong to no Workspace when the operation starts, so there is no
  # *ent.Scoped to take: the Second factor of a User, the exchange of an OAuth code or refresh
  # token, a secret that names its grant, the deletion cycle of a Workspace, which lists the
  # Workspaces that have no scope yet, and the creation of a Workspace, with the steps that make a
  # User Verified with its first one. They hold the raw client (the closed list of
  # docs/architecture.md, Workspace scoping) and are isolated like every use case: one pattern
  # each, so each is an instance, and neither `usecase` nor `usecase-raw` imports the other.
  usecase-raw:
    in:
      [
        'internal/usecase/secondfactorenrolment*',
        'internal/usecase/oauthauthorization*',
        'internal/usecase/workspacedeletion*',
        'internal/usecase/workspacecreation*',
      ]
    isolated: true
    allow_importers: [api-site, api-external, api-collect, api-staff, runner, wiring]
    because: a use case is called by a driver (an API surface, MCP, a job) and built by the wiring; no domain module imports one, and no use case imports another (ADR 0102)

  # The core packages that may hold the raw *ent.Client: the closed list "The raw *ent.Client is
  # allowed only in" of docs/architecture.md (Workspace scoping), kept in step with it. A package
  # is the unit, so the doc's narrower grants (`capturedmessages` only `Purge`, `automations` only
  # `FenceOn`, `bindings` only `PruneStartTokens`, `sendingdomains` only `Due`, `DevTXTLookup` and `Secrets`,
  # `integrations`, `webhooks`, `rules`, `automations`, `users` and `staffmembers` only their
  # `Secrets` for the re-encryption) are left to review. The composition roots, `internal/api/auth` and the job
  # runner are in the doc's list too; they sit in `wiring`, `api-auth` and `runner`, which do not forbid the client.
  core-raw:
    in:
      [
        internal/automations,
        internal/bindings,
        internal/capturedmessages,
        internal/consentrecords,
        internal/integrations,
        internal/instancestates,
        internal/instanceaudit,
        internal/invitations,
        internal/joindomains,
        internal/machine,
        internal/oauthclients,
        internal/passkeys,
        internal/recoverycodes,
        internal/rules,
        internal/sendingdomains,
        internal/signupitems,
        internal/signupsurvey,
        internal/staffmembers,
        internal/suspension,
        internal/trackingdomains,
        internal/trackinghostlog,
        internal/userfeed,
        internal/users,
        internal/webhooks,
        internal/workspacefeed,
      ]

  # The bottom of identity (ADR 0102): the Workspace with its settings and its deletion window, and
  # the Memberships with the Permissions, the Owners and the notices to them. Every module may read
  # a Workspace, ask a Permission or tell the Owners something, so these two import no domain
  # module; both hold the raw client (the closed list of docs/architecture.md, Workspace scoping).
  identity-base: { in: [internal/workspaces, internal/memberships] }

  # The consent of a Destination (ADR 0102): the Confirmation and Unsubscribe owners and the stops
  # read in the Channel itself. They sit in the contacts context, below the Broadcasts and
  # Automations an unsubscribe also touches; counting it on the Broadcast and ending the Enrollment
  # is the unsubscribe use case's (internal/usecase/unsubscriberecording).
  consent: { in: [internal/confirmations, internal/unsubscribes, internal/optout] }

  # The infrastructure tier (ADR 0102): the bus, the database connection and migrations, the message
  # providers, the outbound HTTP calls, the throttles, logging and OpenTelemetry, and the process's
  # configuration (`config`, read by them). It imports only the kernel and never a domain module.
  infra: { in: [internal/infra, config] }
  # The infrastructure packages that hold the raw client (the closed list of docs/architecture.md,
  # Workspace scoping): the bus (docs/design/domain-events.md), which stores an Event and queues the
  # jobs of the consumers the wiring registers on it, the database package's schema guard, and the
  # Login throttle, whose counters belong to an address, not a Workspace.
  infra-raw: { in: [internal/infra/events, internal/infra/db, internal/infra/throttle] }

  # The kernel (ADR 0102): the packages that import none of ours. The vocabulary every tier shares
  # (Channels, providers, Hold reasons, the token scopes, job kinds) and the helpers that know no
  # domain module (i18n, validation, pagination, the renderers, the secrets, the credentials).
  kernel: { in: internal/kernel }
  # The generated ent client: a component so the kernel can name it (kernel: must_not_depend_on); to
  # everyone else it stays open (common).
  ent: { in: ent }
  # The generated ogen packages of the API surfaces, which only the drivers, the wiring and the
  # Enterprise Edition import, and the Telemetry contract's client, which the Telemetry report (a
  # use case) uses.
  gen-surfaces: { in: gen }
  gen-telemetry: { in: gen/telemetry }

  # Everything else under internal/ is the core domain.
  core: { in: 'internal/**' }

# Every component may use the infrastructure (publish through the bus, among others) and the kernel,
# and import the generated ent client.
common: [infra, infra-raw, kernel, ent]

# Files that are not part of a component's own layer (tests drive whole programs).
exclude: ['**/*_test.go', '**/*.test.ts', '**/*.test.tsx', 'src/test/**', '**/testdata/**']

# Generated code stays in the graph as a target (a page may import a client, a handler its ogen
# package, nothing may import the other way) but its own imports are not checked.
target_only: ['src/generated/**', '**/*.gen.ts', '**/*_gen.go']

rules:
  api-site:
    <<: *no-raw-client
    may_depend_on:
      [
        api-auth,
        api-problem,
        core,
        core-raw,
        identity-base,
        consent,
        gen-surfaces,
        usecase,
        usecase-raw,
      ]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-external:
    <<: *no-raw-client
    may_depend_on:
      [api-auth, api-problem, core, core-raw, identity-base, consent, gen-surfaces, usecase]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-collect:
    <<: *no-raw-client
    may_depend_on: [api-auth, api-problem, core, core-raw, gen-surfaces]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-staff:
    <<: *no-raw-client
    may_depend_on: [api-problem, core, core-raw, gen-surfaces, usecase]
    forbid_external: *no-container
    because: the Staff surface depends on the Problem mapping and the core (its session check is the Staff member module's), never on another surface
  api-auth:
    may_depend_on: [core, core-raw, identity-base, gen-surfaces]
    forbid_symbol: *unchecked-removals
    forbid_external: *no-container
    because: the security handlers sit below every surface
  api-problem:
    <<: *no-raw-client
    may_depend_on: [core, core-raw, identity-base, gen-surfaces]
    forbid_external: *no-container
    because: the Problem mapping sits below every surface and reads only the refusals the core returns
  core:
    may_depend_on: [core-raw, identity-base, consent]
    must_not_depend_on: [*no-surface-gen]
    forbid_symbol:
      - name: github.com/getsphericon/sphericon/ent.Client
        because: a domain module takes a *ent.Scoped; needing raw access means a new small package in the closed list of docs/architecture.md (Workspace scoping) and in `core-raw` here, never a field of a module
      - *tags-delete-in
      - *leave-doomed-workspace-in
      - *contacts-update-custom-field-in
      - *integrations-delete-in
      - *sendingdomains-delete-in
      - *sendingdomains-record-dkim
      - *sendingdomains-record-dmarc
      - *contacts-delete-in
      - *users-set-pending-second-factor
      - *users-accept-second-factor-step-in
      - *users-confirm-second-factor-in
      - *users-clear-second-factor-in
      - *recoverycodes-replace-in
      - *recoverycodes-delete-in
      - *passkeys-delete-all-in
      - *apitokens-issue-connection
      - *apitokens-rotate-connection
      - *oauthclients-new-refresh-token-in
      - *workspaces-discard-in
      - *workspaces-restore-in
      - *workspaces-tombstone-in
      - *workspaces-create-in
      - *memberships-add-creator-in
    forbid_external: *no-container
    because: core depends on neither a surface nor the Enterprise Edition; it reaches them through interfaces (site.AuditLog, events.Consumer) wired in internal/app
  core-raw:
    may_depend_on: [core, identity-base]
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    forbid_symbol: &raw-holder-forbids
      - &emailcase-hook
        name: github.com/getsphericon/sphericon/internal/emailcase.Hook
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the raw-client holders of the core and the runner install none
      - &workspacefeed-hook
        name: github.com/getsphericon/sphericon/internal/workspacefeed.Hook
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the raw-client holders of the core and the runner install none
      - &workspacefeed-guard
        name: github.com/getsphericon/sphericon/internal/workspacefeed.Guard
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the raw-client holders of the core and the runner install none
      - &userfeed-hook
        name: github.com/getsphericon/sphericon/internal/userfeed.Hook
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the raw-client holders of the core and the runner install none
      - &userfeed-guard
        name: github.com/getsphericon/sphericon/internal/userfeed.Guard
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the raw-client holders of the core and the runner install none
      - &trackinghostlog-hook
        name: github.com/getsphericon/sphericon/internal/trackinghostlog.Hook
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the raw-client holders of the core and the runner install none
      - &trackinghostlog-guard
        name: github.com/getsphericon/sphericon/internal/trackinghostlog.Guard
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the raw-client holders of the core and the runner install none
      - &upgrade-boundaries
        name: github.com/getsphericon/sphericon/internal/upgrade.Boundaries
        because: the JSON schema status that `upgrade` reads is built in the wiring (app.WriteSchemaBoundaries, ADR 0102); no raw-client holder of the core and no runner knows an upgrade type
      - &upgrade-major-floor
        name: github.com/getsphericon/sphericon/internal/upgrade.MajorFloor
        because: the JSON schema status that `upgrade` reads is built in the wiring (app.WriteSchemaBoundaries, ADR 0102); no raw-client holder of the core and no runner knows an upgrade type
      - *tags-delete-in
      - *contacts-update-custom-field-in
      - *integrations-delete-in
      - *sendingdomains-delete-in
      - *sendingdomains-record-dkim
      - *sendingdomains-record-dmarc
      - *contacts-delete-in
      - *users-set-pending-second-factor
      - *users-accept-second-factor-step-in
      - *users-confirm-second-factor-in
      - *users-clear-second-factor-in
      - *recoverycodes-replace-in
      - *recoverycodes-delete-in
      - *passkeys-delete-all-in
      - *apitokens-issue-connection
      - *apitokens-rotate-connection
      - *oauthclients-new-refresh-token-in
      - *workspaces-discard-in
      - *workspaces-restore-in
      - *workspaces-tombstone-in
      - *workspaces-create-in
      - *memberships-add-creator-in
    because: core depends on neither a surface nor the Enterprise Edition; it reaches them through interfaces (site.AuditLog, events.Consumer) wired in internal/app
  consent:
    may_depend_on: [core]
    must_not_depend_on: [*no-surface-gen]
    forbid_symbol:
      - name: github.com/getsphericon/sphericon/ent.Client
        because: a domain module takes a *ent.Scoped; a signed link's scope comes from workspaces.Module.LinkScope (docs/architecture.md, Workspace scoping)
      - name: github.com/getsphericon/sphericon/internal/automations.Exit
        because: ending the Enrollment an unsubscribe names is the unsubscribe use case's (internal/usecase/unsubscriberecording), in the transaction of the opt-out; the consent modules sit below the Automations (ADR 0102)
      - *tags-delete-in
      - *leave-doomed-workspace-in
      - *contacts-update-custom-field-in
      - *integrations-delete-in
      - *sendingdomains-delete-in
      - *sendingdomains-record-dkim
      - *sendingdomains-record-dmarc
      - *contacts-delete-in
      - *users-set-pending-second-factor
      - *users-accept-second-factor-step-in
      - *users-confirm-second-factor-in
      - *users-clear-second-factor-in
      - *recoverycodes-replace-in
      - *recoverycodes-delete-in
      - *passkeys-delete-all-in
      - *apitokens-issue-connection
      - *apitokens-rotate-connection
      - *oauthclients-new-refresh-token-in
      - *workspaces-discard-in
      - *workspaces-restore-in
      - *workspaces-tombstone-in
      - *workspaces-create-in
      - *memberships-add-creator-in
    forbid_external: *no-container
    because: the consent of a Destination sits in the contacts context (ADR 0102), below the Automations it may not import; an operation that also counts on a Broadcast or ends an Enrollment is a use case above it
  usecase:
    # The Telemetry report is the client of the Telemetry contract (ADR 0102).
    may_depend_on: [core, core-raw, identity-base, consent, gen-telemetry]
    must_not_depend_on: [*no-surface-gen]
    forbid_symbol:
      - name: github.com/getsphericon/sphericon/ent.Client
        because: a use case takes the *ent.Scoped its driver built and hands it to the domain modules it calls; it holds no raw client
    forbid_external: *no-container
    because: a use case composes the domain modules (ADR 0102); a piece two use cases share moves down into the domain module that owns it, and the kernel, the infrastructure and ent are open to it (common)
  usecase-raw:
    may_depend_on: [core, core-raw, identity-base]
    must_not_depend_on: [*no-surface-gen]
    forbid_symbol:
      - *emailcase-hook
      - *workspacefeed-hook
      - *workspacefeed-guard
      - *userfeed-hook
      - *userfeed-guard
      - *trackinghostlog-hook
      - *trackinghostlog-guard
      - *upgrade-boundaries
      - *upgrade-major-floor
      - *leave-doomed-workspace-in
    forbid_external: *no-container
    because: a use case composes the domain modules (ADR 0102); these hold the raw client because their rows belong to no Workspace when they start, and like the raw-client holders of the core they install no ent hook
  identity-base:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    forbid_symbol: &raw-driver-forbids
      - *emailcase-hook
      - *workspacefeed-hook
      - *workspacefeed-guard
      - *userfeed-hook
      - *userfeed-guard
      - *trackinghostlog-hook
      - *trackinghostlog-guard
      - *upgrade-boundaries
      - *upgrade-major-floor
      - *tags-delete-in
      - *leave-doomed-workspace-in
      - *contacts-update-custom-field-in
      - *integrations-delete-in
      - *sendingdomains-delete-in
      - *sendingdomains-record-dkim
      - *sendingdomains-record-dmarc
      - *contacts-delete-in
      - *users-set-pending-second-factor
      - *users-accept-second-factor-step-in
      - *users-confirm-second-factor-in
      - *users-clear-second-factor-in
      - *recoverycodes-replace-in
      - *recoverycodes-delete-in
      - *passkeys-delete-all-in
      - *apitokens-issue-connection
      - *apitokens-rotate-connection
      - *oauthclients-new-refresh-token-in
      - *workspaces-discard-in
      - *workspaces-restore-in
      - *workspaces-tombstone-in
      - *workspaces-create-in
      - *memberships-add-creator-in
    because: the Workspace and its Memberships sit at the bottom of identity (ADR 0102); every module may read them, so they import only the kernel and the infrastructure, never a domain module
  runner:
    may_depend_on: [core, core-raw, identity-base, usecase, usecase-raw]
    forbid_external: *no-container
    forbid_symbol: *raw-driver-forbids
    because: the job runner calls the core and the use cases, never a surface or the Enterprise Edition; the Edition hands its jobs in through the wiring
  infra:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_symbol:
      - name: github.com/getsphericon/sphericon/ent.Client
        because: of the infrastructure only the bus, the database package and the Login throttle hold the raw client (`infra-raw`, the closed list of docs/architecture.md, Workspace scoping)
    forbid_external: *no-container
    because: infrastructure imports only the kernel and never a domain module (ADR 0102); a domain module, a use case, a driver or the wiring reaches it. The bus's consumers are registered by the wiring, and the ent client's hooks are installed there (internal/app/entclient)
  infra-raw:
    may_depend_on: []
    must_not_depend_on: [*no-surface-gen]
    forbid_external: *no-container
    because: infrastructure imports only the kernel and never a domain module (ADR 0102); a domain module, a use case, a driver or the wiring reaches it. The bus's consumers are registered by the wiring, and the ent client's hooks are installed there (internal/app/entclient)
  kernel:
    may_depend_on: []
    must_not_depend_on:
      - name: infra
        because: the kernel sits below the infrastructure; a package that publishes an Event, reads the configuration or calls out is infrastructure or a domain module, not the kernel (ADR 0102)
      - name: infra-raw
        because: the kernel sits below the infrastructure; a package that publishes an Event, reads the configuration or calls out is infrastructure or a domain module, not the kernel (ADR 0102)
      - name: ent
        because: the kernel knows no table; a package that queries through ent is infrastructure or a domain module (ADR 0102)
      - *no-surface-gen
    # internal/kernel/cleanup reads the container for its shutdown report, the one exception the doc names.
    forbid_external: *no-container
    because: the kernel is the bottom tier (ADR 0102); it imports nothing of ours outside internal/kernel, so every tier can use it
  ent:
    may_depend_on: []
    because: the ent schema reads its Go types from the kernel, and the endpoint URL rule of a Webhook endpoint from internal/infra/webhook; it knows no domain module
  ee-api:
    <<: *no-raw-client
    may_depend_on: [api-problem, core, core-raw, ee, gen-surfaces]
    forbid_external: *no-container
    because: an Enterprise surface receives input, calls its domain module in ee/ and returns the result (review rule 5); it never holds the raw client
  ee-edition:
    may_depend_on: [core, core-raw, identity-base, ee, ee-api, gen-surfaces]
    forbid_symbol: *unchecked-removals
    forbid_external: *no-container
    because: the Edition builds the Enterprise modules and their surfaces on the core, never on the open surfaces' handlers
  ee:
    may_depend_on:
      - core
      - core-raw
      - identity-base
      - name: gen-surfaces
        because: the ban on a surface's generated package binds the core tiers; the Enterprise Edition's boundary with the core is unchanged (spec #1120), and ee/staff reads its service surface's ServiceScope until the Edition takes the same tiers
    forbid_symbol: *unchecked-removals
    forbid_external: *no-container
    because: the Enterprise Edition builds on the core and never on a surface's handlers; the Edition (ee-edition) builds its own surfaces
  wiring:
    may_depend_on:
      [
        core,
        core-raw,
        identity-base,
        ee,
        ee-edition,
        api-site,
        api-external,
        api-collect,
        api-staff,
        api-auth,
        api-problem,
        runner,
        usecase,
        usecase-raw,
        gen-surfaces,
      ]
    forbid_symbol: *unchecked-removals
    because: wiring is where the program is assembled

  web-generated:
    may_depend_on: []
    because: generated clients come from the OpenAPI contract and import nothing of ours
  web-shared:
    <<: *no-global-i18n
    may_depend_on: [web-generated, web-routes, web-app]
    because: shared components, hooks and layouts sit below the pages; a page imports them, never the reverse (they link through a route's `Route`, never a path string)
  web-routes:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-app]
    because: a route file holds guards and search schemas and never imports a page (src/AGENTS.md)
  web-route-lazy:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-shared, web-pages, web-console, web-app]
    because: the lazy route file is the one place a page is bound to its route
  web-pages:
    <<: *no-global-i18n
    forbid_external:
      - name: '@mantine/notifications'
        because: toasts go through useNotify (src/hooks/useNotify.ts), never Mantine's global store
      - *no-dayjs
    may_depend_on: [web-generated, web-shared, web-routes, web-app]
    because: a page reaches its route through the route file's `Route` and never imports a lazy route file
  web-console:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-routes, web-app]
    because: the Staff console is its own feature and does not import the workspace pages
  web-app:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-routes]
    because: the files directly under src/ assemble the application

# Each import of a package is declared in the nearest package.json.
manifests: true

# Every checked file belongs to a component, so a new package must be assigned to one. These
# are the generated, tooling and separately built trees that have no layer of their own.
strict: true

# Files behind a build tag are indexed only with that tag; a file and its `!tag` twin cannot both
# be read, so the twin not read is accepted below. `race` stays off (`race_off.go` is read).
go:
  tags: [e2e, embed_spa, embed_changelog]
uncovered_ok:
  - name: '**/race_on.go'
    because: the race-detector twin of race_off.go, built only under -race
  - name: internal/changelog/embed_none.go
    because: the twin of embed.go, built when embed_changelog is off
  - name: internal/server/spa_noembed.go
    because: the twin of spa_embed.go, built when embed_spa is off
  - name: internal/kernel/emaildoc/assets/emaildoc.js
    because: the generated document renderer bundle, not source
  - name: ent/entc.go
    because: the ent codegen entry point, built with the `ignore` tag
  - name: ent/internal/schema.go
    because: generated by ent, built with the `tools` tag
unowned:
  - tools/**
  - packages/**
  - mise/**
  - cmd/**
  - e2e/**
  # The TypeSpec contract's decorators (ADR 0069), loaded by the TypeSpec compiler.
  - typespec/**
  # Tool configs and the two embed files at the repository root.
  - '*.ts'
  - '*.go'
