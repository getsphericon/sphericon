# Architecture gate (https://github.com/mokevnin/easement): `mise run check:arch`.
# The boundaries below are the ones docs/architecture/modules.md states in prose; a violation names
# the rule's `because`, so read it before reaching for a baseline entry. `easement policy` prints
# the policy with its globs expanded.
version: 1

# Every name below may be used only by the components its `allow` lists and the files its
# `allow_in` matches: a use anywhere else fails, in a component with no rule of its own, in a file
# of no component and in the other packages, or the other files, of the module that defines it
# (only its definition is no use). Name a function as `<import path>.<Name>`: a bare import path
# matches nothing.
# The list holds what only the program's builders use (ADR 0110): the raw client, the ent hooks and
# guards, the upgrade boundaries and river's workers. A module's function that only some callers
# may call is fenced by place, never here: it lives in a subpackage whose component names its
# importers, as the unchecked operations do (`domain-<context>-unchecked`).
forbid_symbol:
  # The job runners schedule work (ADR 0102, ADR 0111): a domain module or a use case does the work
  # as a function and may queue a job (its args, river's insert), but it declares no worker and no
  # periodic job; those live in the drivers internal/jobs and ee/jobs, which call the function.
  - name: github.com/riverqueue/river.WorkerDefaults
    allow: &job-schedulers [runner, ee-runner, wiring]
    because: &river-scheduling-because a domain module or a use case does the work as a function and may queue a job, but its worker and its periodic job belong to a driver (ADR 0102, ADR 0111), the job runner internal/jobs or the Enterprise one ee/jobs, which call the function
  - name: github.com/riverqueue/river.AddWorker
    allow: *job-schedulers
    because: *river-scheduling-because
  - name: github.com/riverqueue/river.NewPeriodicJob
    allow: *job-schedulers
    because: *river-scheduling-because
  # The raw ent client: its holders are the closed list of docs/architecture/workspace-scoping.md
  # (Workspace scoping), kept in step with it. `allow` names the components that hold it whole: the
  # composition roots, the security handlers, the job runner internal/jobs (the Enterprise one,
  # ee/jobs, takes its modules from the wiring and holds none), the Workspaces and Memberships at the
  # bottom of identity, the unchecked operations of identity that join their use case's raw
  # transaction, ent and test support. `allow_in` names the other holders package by package: the
  # domain modules, the use cases whose rows belong to no Workspace when they start (so there is no
  # *ent.Scoped to take), and the bus, the database package's schema guard and the Login throttle,
  # whose counters belong to an address. Each pattern is the package's own files (`<package>/*.go`),
  # so its unchecked and reader subpackages stay without the client. A package is the unit, so the
  # doc's narrower grants (`capturedmessages` only `Purge`, `automations` only `FenceOn`, `bindings`
  # only `PruneStartTokens`, and the like) are left to review.
  - name: github.com/getsphericon/sphericon/ent.Client
    allow:
      [
        api-auth,
        domain-identity-base,
        domain-identity-unchecked,
        ee-edition,
        ent,
        runner,
        testsupport,
        wiring,
      ]
    allow_in:
      - internal/domain/identity/apitokens/*.go
      - internal/domain/identity/consentrecords/*.go
      - internal/domain/identity/invitations/*.go
      - internal/domain/identity/joindomains/*.go
      - internal/domain/identity/noticedelivery/*.go
      - internal/domain/identity/oauthclients/*.go
      - internal/domain/identity/passkeys/*.go
      - internal/domain/identity/secondfactors/*.go
      - internal/domain/identity/signup/*.go
      - internal/domain/identity/signupitems/*.go
      - internal/domain/identity/signupsurveyresponses/*.go
      - internal/domain/identity/staffmembers/*.go
      - internal/domain/identity/suspension/*.go
      - internal/domain/identity/users/*.go
      - internal/domain/identity/usertombstones/*.go
      - internal/domain/identity/workspacefeed/*.go
      - internal/domain/sending/bindings/*.go
      - internal/domain/sending/callbackinterpretation/*.go
      - internal/domain/sending/capturedmessages/*.go
      - internal/domain/sending/integrations/*.go
      - internal/domain/sending/outboundmessages/engagement/*.go
      - internal/domain/sending/privaterelayranges/*.go
      - internal/domain/sending/sendingdomains/*.go
      - internal/domain/sending/trackingdomains/*.go
      - internal/domain/sending/trackinghostchanges/*.go
      - internal/domain/orchestration/automations/*.go
      - internal/domain/orchestration/rules/*.go
      - internal/domain/orchestration/webhookendpoints/*.go
      - internal/domain/instance/instancestates/*.go
      - internal/domain/instance/instanceauditentries/*.go
      - internal/usecase/messageretention/*.go
      - internal/usecase/userdeletion/*.go
      - internal/usecase/workspacedeletion/*.go
      - internal/usecase/workspaceview/*.go
      - internal/infra/db/*.go
      - internal/infra/events/*.go
      - internal/infra/throttle/*.go
      - ee/domain/identity/servicecredentials/*.go
      - ee/domain/insights/abusedetector/*.go
      - ee/domain/insights/auditentries/*.go
      - ee/domain/insights/erasures/*.go
      - ee/domain/insights/usages/*.go
      - ee/domain/insights/workspaceoversight/*.go
      - ee/usecase/auditlogretention/*.go
    because: a handler, a domain module or a use case takes a *ent.Scoped so every query is workspace-bound, a use case the one its driver built; raw access is the closed list of docs/architecture/workspace-scoping.md (Workspace scoping), a small package of its own named in this item, never a field of a module, a use case or a handler
  # The ent client's hooks and the upgrade types: only the wiring installs and reads them.
  - name: github.com/getsphericon/sphericon/internal/domain/identity/workspacefeed.Hook
    allow: &client-builders [wiring]
    because: &ent-hooks-because the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); no other package installs one
  - name: github.com/getsphericon/sphericon/internal/domain/identity/workspacefeed.Guard
    allow: *client-builders
    because: *ent-hooks-because
  - name: github.com/getsphericon/sphericon/internal/domain/identity/usertombstones.Hook
    allow: *client-builders
    because: *ent-hooks-because
  - name: github.com/getsphericon/sphericon/internal/domain/identity/usertombstones.Guard
    allow: *client-builders
    because: *ent-hooks-because
  - name: github.com/getsphericon/sphericon/internal/domain/sending/trackinghostchanges.Hook
    allow: *client-builders
    because: *ent-hooks-because
  - name: github.com/getsphericon/sphericon/internal/domain/sending/trackinghostchanges.Guard
    allow: *client-builders
    because: *ent-hooks-because
  # The Enterprise Edition's pair, which ee.Hooks hands the wiring for internal/app/entclient.
  - name: github.com/getsphericon/sphericon/ee/domain/insights/usages.Hook
    allow: &edition-hooks [ee-edition]
    because: &edition-hooks-because the Edition hands its ent hooks to the wiring (ee.Hooks), which builds every ent client with them (internal/app/entclient, ADR 0107); no other package installs one
  - name: github.com/getsphericon/sphericon/ee/domain/insights/usages.Guard
    allow: *edition-hooks
    because: *edition-hooks-because
  # Every ent client is built by internal/app/entclient, with every hook and guard (ADR 0107).
  - name: github.com/getsphericon/sphericon/ent.NewClient
    allow: [ent, wiring]
    allow_in: [internal/infra/db/*.go]
    because: every ent client is built by internal/app/entclient with every hook and its guard (ADR 0107), so no client writes without them; the one other is the schema guard's read-only client of internal/infra/db, built before the application's exists
  - name: github.com/getsphericon/sphericon/internal/app/entclient.Core
    allow: *client-builders
    because: the clients without the Enterprise Edition's hooks are for tests of the core and the wiring's read-only tools (the doctor); the application's clients come from its one entclient.Clients, which carries the Edition's hooks (ADR 0107)
  - name: github.com/getsphericon/sphericon/internal/infra/events.Bus.Use
    because: the application's ent hooks are installed by internal/app/entclient on the client the bus builds for each transaction (ADR 0107); Bus.Use is only a test's seam to inject a fault
  - name: github.com/getsphericon/sphericon/internal/domain/instance/upgrade.Boundaries
    allow: *client-builders
    because: &upgrade-because the JSON schema status that `upgrade` reads is built in the wiring (app.WriteSchemaBoundaries, ADR 0102); no other package knows an upgrade type
  - name: github.com/getsphericon/sphericon/internal/domain/instance/upgrade.MajorFloor
    allow: *client-builders
    because: *upgrade-because
  # The app runs on its own i18next instance (src/i18n.ts); the global default one is never
  # initialised and holds no string. The types (`TFunction`, `i18n`) stay allowed.
  - name: i18next.i18next
    because: the app's strings live on its own instance from src/i18n.ts, reached through useTranslation; the global default instance is never initialised, so a string read from it is its key

# The external modules only some components may use, banned once for every file, a component's own
# list adding to it.
forbid_external:
  - name: github.com/samber/do
    allow: [wiring]
    because: no domain module or handler sees the DI container; a new dependency is a provider in internal/app/container.go (docs/architecture/backend.md, DI)
  - name: dayjs
    allow: [web-dates]
    because: dates go through src/utils/datetime.ts (src/AGENTS.md), which holds the plugins, the time zone and the formats; dayjs is imported only there and by the locale loading of the date inputs (`web-dates`)
  - name: '@mantine/notifications'
    allow_in:
      [src/hooks/useNotify.ts, src/components/NotificationsProvider.tsx, src/main.tsx, package.json]
    because: toasts go through useNotify (src/hooks/useNotify.ts), never Mantine's global store; only it, the provider and the app's root reach Mantine's notifications

# What the frontend's pages and the Staff console both stand on: the generated client, the shared
# UI, the dates, the route files and the application's root files.
sets:
  web-base: [web-generated, web-shared, web-dates, web-routes, web-app]

components:
  # The public API surfaces. Each has its own TypeSpec contract, handler package and auth scheme.
  api-site: { in: internal/api/site }
  api-external: { in: internal/api/external }
  api-collect: { in: internal/api/collect }
  api-staff: { in: internal/api/staff }
  # The OAuth 2.1 server for MCP connectors (ADR 0016): its protocol endpoints, a driver beside the
  # surfaces, with no TypeSpec contract of its own (the protocol's RFCs are its contract).
  api-oauth: { in: internal/api/oauth }
  # The drivers of the public endpoints that have no TypeSpec contract (ADR 0111): the tracked
  # links of the messages sent (`/e/`, `/c/`), the Ingest hook (`/hooks/{key}`, ADR 0037) and the
  # edge's on-demand TLS question on the internal listener (ADR 0038).
  api-tracking: { in: internal/api/tracking }
  api-hooks: { in: internal/api/hooks }
  api-tlsask: { in: internal/api/tlsask }
  # The security handlers every surface shares. `layers` puts them below every driver, so the ones
  # that take no request (the job runners, the command line, the Edition) are closed out by name.
  api-auth:
    in: internal/api/auth
    allow_importers:
      [
        api-site,
        api-external,
        api-collect,
        api-staff,
        api-oauth,
        api-tracking,
        api-hooks,
        api-tlsask,
        mcp,
        ee-api,
        wiring,
      ]
    because: the security handlers authenticate an HTTP request for a surface; a job, a command or the Edition has no request to authenticate
  # The answer of every refusal on every surface (ADR 0103): shared surface code like the security
  # handlers, so it sits among the drivers and the core never reaches it.
  api-problem:
    in: internal/api/problem
    allow_importers:
      [api-site, api-external, api-collect, api-staff, api-hooks, mcp, ee-api, wiring]
    because: the Problem mapping is the surfaces' own code (it imports every surface's generated package); a core package returns its refusal and never decides the answer

  # The wiring: the places that may build the whole program, and so may reach the Enterprise Edition.
  wiring:
    in: [internal/app, internal/server, internal/testhelper, internal/doctor, internal/healthcheck]

  # The Enterprise Edition (ADR 0014, ADR 0102) has the core's shape: its domain modules in
  # ee/domain/<context>/<module>, its use cases in ee/usecase/<name>, its surfaces in ee/api and
  # the Edition ee/ee.go, with the License key's gate (ee/licensekey) beside them. Its boundary with
  # the core is unchanged: the core never imports it (each ee component names its importers, which
  # `layers` cannot open; the command line, `cli`, reaches the Service credentials, which only it
  # issues), and only the wiring assembles it.
  #
  # The handlers of the Enterprise surfaces (the Staff console's Enterprise sections and the service
  # endpoints), over the modules ee/domain/insights/workspaceoversight and ee/domain/identity/servicecredentials.
  # The Edition (ee/ee.go) builds them.
  ee-api:
    in: 'ee/api/**'
    allow_importers: [ee-edition]
    because: an Enterprise surface is built by the Edition (ee/ee.go), which the wiring mounts; no Enterprise module reaches a handler
  # The Edition itself (ee/ee.go): the one package that assembles the Enterprise modules and surfaces.
  ee-edition:
    in: 'ee/*.go'
    allow_importers: [wiring]
    because: only the wiring assembles the Enterprise Edition
  # The Enterprise job runner (ee/jobs, ADR 0111): the workers, periodic schedules and event
  # consumers of the Enterprise modules and use cases, a driver with the core runner's rules. Only
  # the wiring builds it and hands its jobextension.Extension to the core's job client.
  ee-runner:
    in: ee/jobs
    allow_importers: [wiring]
    because: the Enterprise job runner is a driver (ADR 0111) that only the wiring builds; no Enterprise module, use case or the Edition imports it
  # The runtime License key's gate (ee/licensekey): it imports nothing of ours, and every Enterprise
  # package asks it what the License switches on.
  ee-licensekey:
    in: ee/licensekey
    allow_importers: [wiring, 'ee-*']
    because: the core never imports the Enterprise Edition; the wiring reads the License key, and every Enterprise package asks it what the License switches on
  # The Enterprise use cases (ADR 0102, ADR 0112): an operation no single module can own, such as
  # the advanced-retention prune over the License, the Workspaces' windows and the Audit entries.
  # Each directory under ee/usecase is one use case; none imports another, and only an Enterprise
  # surface, the Edition or the wiring imports one.
  ee-usecase:
    in: ee/usecase/*
    isolated: true
    allow_importers: [ee-api, ee-runner, ee-edition, wiring]
    because: an Enterprise use case is called by an Enterprise driver (a surface, a job of ee/jobs) and built by the Edition or the wiring; no domain module imports one, and no use case imports another (ADR 0102)
  # The Enterprise domain modules (ADR 0102), in the core's contexts: an Enterprise module of a
  # context imports the core's modules of its context and of the contexts below, and the Enterprise
  # modules of those contexts, never one above (`layers`). `'ee-domain-*'` lets in the Enterprise
  # modules of every context and their unchecked subpackages, and `layers` keeps each to its own
  # context and those below. Identity: the Service credentials (the machine identity of the service
  # endpoints), which the command line issues, rotates and revokes (ADR 0026).
  ee-domain-identity:
    in: 'ee/domain/identity/**'
    allow_importers: ['ee-domain-*', ee-usecase, ee-api, ee-edition, cli, wiring]
    because: an Enterprise domain module is reached by the Enterprise use cases, surfaces and modules of its context and above, the Edition and the wiring, and the Service credentials by the command line, the only way one is issued, rotated or revoked (ADR 0026); no other core package imports the Enterprise Edition
  # Insights: the Audit entries (auditentries), the Erasures of the Export streams (erasures) and
  # the Usage figures (usages), which own their tables, the Abuse detector (abusedetector), its
  # limits, its reading of a Workspace's standing and its hourly pass over every Workspace
  # (ADR 0112), and the Workspace oversight (workspaceoversight), the Staff's and the services' look
  # across Workspaces, which sits at the top of the context: it calls the identity and sending
  # modules and the other insights modules, of the core and of the Edition.
  ee-domain-insights:
    in: 'ee/domain/insights/**'
    allow_importers: ['ee-domain-*', ee-usecase, ee-api, ee-runner, ee-edition, wiring]
    because: an Enterprise domain module is reached by the Enterprise use cases, surfaces and modules of its context, the Edition and the wiring; the core never imports the Enterprise Edition
  # What stays unchecked in the Enterprise Edition (ADR 0110), as in the core
  # (`domain-<context>-unchecked`): a subpackage `<module>unchecked` of an Enterprise module, imported
  # only by an Enterprise use case, one component per context so that it reaches no more than its
  # owner's context may. None exists today.
  ee-domain-identity-unchecked:
    in: ['ee/domain/identity/**/*unchecked']
    priority: 1
    optional: true
    allow_importers: &ee-unchecked-importers [ee-usecase]
    because: &ee-unchecked-because an unchecked operation leaves its check to the use case that calls it (ADR 0110), so only an Enterprise use case imports it, after the check; call the use case
  ee-domain-insights-unchecked:
    in: ['ee/domain/insights/**/*unchecked']
    priority: 1
    optional: true
    allow_importers: *ee-unchecked-importers
    because: *ee-unchecked-because

  # Frontend (src/AGENTS.md). Generated clients are leaves; a route file binds a page lazily and
  # never imports it, so a page may import its route's `Route` without a cycle.
  web-generated: { in: src/generated }
  web-routes: { in: src/routes }
  # `foo.lazy.tsx` is where the page is bound; `foo.tsx` (guards, search schemas) never sees it.
  web-route-lazy: { in: 'src/routes/**/*.lazy.tsx' }
  # Each directory under src/pages is a feature; features share through src/components, hooks and utils.
  web-pages:
    in: src/pages/*
    isolated: true
    because: a page feature never imports another feature's page; what two features share lives in src/components, src/editing, src/hooks or src/utils
  web-console: { in: src/console }
  web-shared:
    in: [src/components, src/editing, src/hooks, src/layouts, src/resources, src/utils]
  # The one place dayjs is imported, carved out of web-shared (each file is a longer pattern than
  # src/utils): the dates (datetime.ts) and the dayjs locale data of the date inputs (dayjsLocale.ts
  # and its loaders). The rest of the frontend reaches dayjs only through them.
  web-dates:
    in: [src/utils/datetime.ts, src/utils/dayjsLocale.ts, src/utils/dayjsLocaleLoaders.ts]
  # The files directly under src/: router, guards, theme, instance, i18n, entry points.
  web-app: { in: 'src/*' }

  # The drivers (ADR 0102) are the API surfaces above, MCP and the job runner: each receives input,
  # calls a domain module or a use case and returns or records the result (review rule 5), and no
  # core tier imports one. Only the wiring builds MCP and the runner; a package with jobs of its own
  # hands them in as a jobextension.Extension.
  mcp:
    in: internal/mcpserver
    allow_importers: [wiring]
    because: MCP is a driver (ADR 0102) that only the wiring mounts; no core tier imports it
  runner:
    in: internal/jobs
    allow_importers: [wiring]
    because: the job runner is a driver (ADR 0102) that only the wiring builds; no domain module imports it, and a package with jobs of its own hands them in as a jobextension.Extension
  # The command line (ADR 0111): the `sphericon` binary's commands (cmd/server), a driver like the
  # surfaces, and its driver package (internal/commandline), which holds what they print. A command
  # reads its arguments, calls one operation of a domain module or a use case and prints the result;
  # the program it calls is the one the wiring builds (the command app of internal/app), so it is
  # the one driver that imports the wiring.
  cli:
    in: [cmd/server, internal/commandline]
    allow_importers: []
    because: the command line is a driver (ADR 0111); nothing imports it

  # The use cases (ADR 0102, ADR 0112): an operation whose subject's owner would have to call a
  # module above it, or that no single module can own, such as deleting a Tag after the Removal
  # check of the modules that name it. Each directory under internal/usecase is one use case; it
  # calls the domain modules, opens the transaction they join and takes the Workspace lock where
  # ADR 0099 requires it. Only a driver or the wiring imports one. The few whose rows belong to no
  # Workspace when they start hold the raw client (the `allow_in` of ent.Client above).
  usecase:
    in: internal/usecase/*
    isolated: true
    allow_importers:
      [
        api-site,
        api-external,
        api-collect,
        api-staff,
        api-oauth,
        api-tracking,
        api-hooks,
        runner,
        cli,
        wiring,
      ]
    because: a use case is called by a driver (an API surface, a job, a command; MCP reaches one only through the external API's handler, which it is given) and built by the wiring; no domain module imports one, and no use case imports another (ADR 0102)

  # The domain tier (ADR 0102) is internal/domain/<context>/<module>, the contexts ordered from
  # the bottom: identity -> contacts -> content -> sending -> orchestration -> insights -> instance.
  # Each context is the glob of its directory, `domain-<context>`, and a component of its own where
  # a rule binds part of a context only (its bottom, its unchecked operations, the Removal check and
  # its readers). A context's modules may import each other (a context only orders packages, it is
  # no box with a facade), and import every component of the contexts below and nothing above:
  # `layers` states the order once. The raw-client holders among them are the `allow_in` of
  # ent.Client above. The kernel, the infrastructure and ent are open to all (common). Every package
  # of the core is in a tier or a context; there is no catch-all.
  #
  # Identity, the bottom context: the Workspaces, the Memberships, the Users, the Invitations, the
  # Join domains, the API tokens, the Staff members, the OAuth clients, the second step of signing
  # in (Passkeys, the Second factors with their Recovery codes), sign-in and sign-up (login,
  # signinprovider, the Sign-up with every step that makes a User Verified, Consent records, Sign-up
  # items, the Sign-up survey responses), suspension, the Account link and the service feeds of
  # Users and Workspaces.
  # Its bottom: the Workspace with its settings and its deletion window, and the Memberships with the
  # Permissions, the Owners and the notices to them. Every module may read a Workspace, ask a
  # Permission or tell the Owners something, so these two import no domain module; both hold the
  # raw client.
  domain-identity-base:
    { in: [internal/domain/identity/workspaces, internal/domain/identity/memberships] }
  domain-identity: { in: 'internal/domain/identity/**' }

  # Contacts, above identity: the Contacts with their Custom fields and Tags, the Segments and the
  # Conditions they hold, the consent of a Destination (the Confirmations, the Unsubscribes and the
  # stops read in the Channel, channelstop), the Suppressions, eligibility, the Visitors, the Orders
  # and the Event recording (eventrecording, ADR 0112), with the Contact row lock (contactlock).
  # Counting an unsubscribe on a Broadcast and ending an Enrollment is the unsubscribe use case's
  # (internal/usecase/unsubscriberecording): the orchestration modules are above contacts, so a
  # contacts module cannot import them.
  domain-contacts: { in: 'internal/domain/contacts/**' }

  # Content, above contacts: the email Templates, the Brand kit and the lifecycle every Versioned
  # definition shares (versioneddefinition).
  domain-content: { in: 'internal/domain/content/**' }

  # Sending, above content: the Outbound send with its Holds and send limits (providerlimit), the
  # Integrations and the Presets that read their callbacks, the Sending domains with their DKIM and
  # DMARC primitives, the Tracking domains and their host changes, the Bindings of Telegram
  # chats, the Message tokens (messagetoken), the Link clicks (linkclick), reputation, the Private
  # relay ranges of Machine engagement, the Captured messages and the Callback interpretation
  # (callbackinterpretation, ADR 0112), which has no table.
  domain-sending: { in: 'internal/domain/sending/**' }

  # Orchestration, above sending: what targets Contacts and sends through the contexts below, the
  # Broadcasts, the Automations, the Rules and the
  # Webhook endpoints, with the one shape of a refused removal (liveuse), a leaf below the modules
  # that return it, and the Removal check at its top (removalcheck, a component of its own).
  # The Removal check (GLOSSARY "Removal check"): the one importer of the readers of what may hold
  # a row (`domain-*-removalcheck-readers`). It is called by the use cases that remove a checked row.
  domain-orchestration-removalcheck:
    in: internal/domain/orchestration/removalcheck
    allow_importers: [usecase, wiring]
    because: the Removal check runs inside a use case's transaction under the Workspace lock (ADR 0099), before its unchecked removal; a domain module never removes a row another module may hold. The Workspace view runs it before it clears the postal address (ADR 0156)
  # The readers of the Removal check: each owner that may hold a row keeps them in a subpackage
  # `<module>use`, which may import its owner and which the owner does not import (the Definition
  # use of the Segments, Rules, Automations and armed Broadcasts, the Live use that sends of the
  # Broadcasts and Automations). They are opened to the Removal check alone, so every removal that
  # checks a row reads every holder, and a new holder is a reader the Removal check adds (ADR 0110:
  # a fence by place). There is one component per context, so a reader keeps its owner's place in
  # the order of contexts. Tests of the owners are not checked.
  domain-contacts-removalcheck-readers:
    in: internal/domain/contacts/segments/segmentsuse
    allow_importers: &removalcheck [domain-orchestration-removalcheck]
    because: &reader-because a reader of what may hold a row is the Removal check's (internal/domain/orchestration/removalcheck, ADR 0049, ADR 0099), the one list of the holders; a removal that checks a row calls the Removal check under the Workspace lock
  domain-orchestration-removalcheck-readers:
    in:
      [
        internal/domain/orchestration/automations/automationsuse,
        internal/domain/orchestration/broadcasts/broadcastsuse,
        internal/domain/orchestration/rules/rulesuse,
      ]
    allow_importers: *removalcheck
    because: *reader-because
  domain-orchestration: { in: 'internal/domain/orchestration/**' }

  # Insights, above orchestration: the read packages that look across the contexts below without
  # owning a table, the Setup checklist, the read side of the Audit log (auditlog) and of the Export
  # streams (exportstream), the Abuse warning the Enterprise Abuse detector fills (abusewarning) and
  # the Data export of one Contact (dataexport).
  domain-insights: { in: 'internal/domain/insights/**' }

  # Instance, the top context: what belongs to the Instance rather than to a Workspace, its state
  # (instancestates) and its audit log (instanceauditentries), the in-place upgrade of a bare binary
  # (upgrade) and the Upgrade notes of the changelog (upgradenote). The Release check and the
  # Telemetry report are instancestates' own operations (ADR 0112), so the context is the client of
  # the Telemetry contract (gen/telemetry).
  domain-instance: { in: 'internal/domain/instance/**' }

  # What stays unchecked (ADR 0110): a write whose check needs a module its owner may not call (one
  # of a higher context, or several at once) lives in a subpackage `<module>unchecked` of its owner,
  # which may import its owner and which the owner does not import (the Live use writes behind the
  # Removal check, the steps of a Contact's Erasure, the deletion cycle and the creation of a
  # Workspace, User deletion's and the Second factor reset's removals). Only a use case of the core
  # imports one, after its check: no driver, no domain module, no Enterprise package. A new unchecked
  # operation is a method of the Module of its owner's subpackage, which the use case builds and the
  # component of its owner's context takes by its name: one per context, the infrastructure's
  # included (the bus's Erasure step), each in `layers` right above its context, so that a
  # subpackage reaches no more than its owner's context may. The contexts with none today have
  # theirs too (optional), so a first one is fenced. Those of identity take a transaction's raw
  # client (ent.Client's `allow`). The priority puts a subpackage here rather than in its owner's
  # component.
  domain-identity-unchecked:
    in: ['internal/domain/identity/**/*unchecked']
    priority: 1
    allow_importers: &unchecked-importers [usecase]
    because: &unchecked-because an unchecked operation leaves its check to the use case that calls it (ADR 0110), so only a use case of the core imports it, after the check; call the use case
  domain-contacts-unchecked:
    in: ['internal/domain/contacts/**/*unchecked']
    priority: 1
    allow_importers: *unchecked-importers
    because: *unchecked-because
  domain-content-unchecked:
    in: ['internal/domain/content/**/*unchecked']
    priority: 1
    optional: true
    allow_importers: *unchecked-importers
    because: *unchecked-because
  domain-sending-unchecked:
    in: ['internal/domain/sending/**/*unchecked']
    priority: 1
    allow_importers: *unchecked-importers
    because: *unchecked-because
  domain-orchestration-unchecked:
    in: ['internal/domain/orchestration/**/*unchecked']
    priority: 1
    allow_importers: *unchecked-importers
    because: *unchecked-because
  domain-insights-unchecked:
    in: ['internal/domain/insights/**/*unchecked']
    priority: 1
    optional: true
    allow_importers: *unchecked-importers
    because: *unchecked-because
  domain-instance-unchecked:
    in: ['internal/domain/instance/**/*unchecked']
    priority: 1
    optional: true
    allow_importers: *unchecked-importers
    because: *unchecked-because
  infra-unchecked:
    in: ['internal/infra/**/*unchecked']
    priority: 1
    allow_importers: *unchecked-importers
    because: *unchecked-because

  # The infrastructure tier (ADR 0102): the bus (docs/design/domain-events.md), which stores an Event
  # and queues the jobs of the consumers the wiring registers on it, the database connection,
  # migrations and schema guard, the message providers, the outbound HTTP calls, the throttles, the
  # ent aggregate functions the reports share (aggregates), logging and OpenTelemetry, and the
  # process's configuration (`config`, read by them). It imports only the kernel and never a domain
  # module.
  infra: { in: [internal/infra, config] }

  # The kernel (ADR 0102): the packages that import none of ours. The vocabulary every tier shares
  # (Channels, providers, Hold reasons, the token scopes, job kinds) and the helpers that know no
  # domain module (i18n, validation, pagination, the renderers, the secrets, the credentials).
  kernel: { in: internal/kernel }
  # The generated ent client: a component so the kernel can name it (kernel: must_not_depend_on); to
  # everyone else it stays open (common).
  ent: { in: ent }
  # The generated ogen packages of the API surfaces, which only the drivers, the wiring and the
  # Enterprise Edition import, and the Telemetry contract's client, which the Telemetry report of
  # the Instance state (instancestates) uses. `layers` puts the surfaces' packages above the use
  # cases, so no use case, domain module, infrastructure or kernel package of the core or of the
  # Enterprise Edition imports one (ADR 0102): a vocabulary shared with a contract is generated into
  # the kernel, as the user scope vocabulary is into internal/kernel/tokenscope, or into the module
  # that owns it, as the Service credential scopes are into ee/domain/identity/servicecredentials.
  gen-surfaces: { in: gen }
  gen-telemetry: { in: gen/telemetry }

  # The repository's own commands under cmd/ that are not the application: the generators, the CI
  # checks, the development database and the seeding. The `sphericon` binary is the driver `cli`.
  commands:
    in: 'cmd/*'
    isolated: true
  # The packages behind the repository's own commands under cmd/ that are not the application: the
  # generators (scopegen, boundgen, entgen, the fixture catalog, goverter's enum transformer) and the CI
  # checks (contractcopy, contractrevision, prcheck, ticketcheck, upgradecheck). No tier, no driver and no wiring imports one.
  tools:
    in:
      [
        internal/boundgen,
        internal/contractcopy,
        internal/contractrevision,
        internal/entgen,
        internal/fixtures/fixturegen,
        internal/goverterenum,
        internal/prcheck,
        internal/scopegen,
        internal/ticketcheck,
        internal/upgradecheck,
      ]
    allow_importers: [commands]
    because: a tool package serves a command of the repository under cmd/ (a generator or a CI check), never the application
  # What tests share below the harness: the committed fixtures' loader and catalog (fixtures, which
  # cmd/seed also loads into the development database), an in-process DNS server (dnstest) and the
  # check of a Telemetry report against its contract (telemetryschema). Tests are not checked, so
  # only the harness is a checked importer.
  testsupport:
    in: [internal/fixtures, internal/dnstest, internal/telemetryschema]
    allow_importers: [wiring, commands]
    because: test support serves the tests and the harness (internal/testhelper), and the seeding command (cmd/seed); no tier and no driver imports it

# The order of the core (ADR 0102, ADR 0111), from the top: a component may import every one on a
# line below its own, never one above, and the components of one line (siblings) never each other.
# It stands in place of a `may_depend_on` list in each component: such a list holds only an edge
# the order does not give, with its reason. The wiring builds the program from everything below it.
# The drivers (each API surface, MCP, the job runners, the command line, the Enterprise surfaces,
# and the Edition, which builds them) never import each other; below them the code they share, the
# security handlers and the Problem mapping, and the surfaces' generated packages, which no use case
# and no domain module sees. The use cases, core and Enterprise, are an open layer (ADR 0111): a
# driver calls a domain module directly when one module holds the operation, and a use case when it
# spans several; `ee-api` reaches the Enterprise use cases. Below them the contexts from instance
# down to identity: the unchecked operations of a context on top of it, which only a use case
# imports (ADR 0110), the Enterprise modules of a context above the core's, and the readers of the
# Removal check above their owners. Then the unchecked operations of the infrastructure, the
# infrastructure, and the kernel with the License key's gate, which import nothing of ours. `common`
# opens the infrastructure and the kernel to every component whatever the order, and the kernel's
# own `must_not_depend_on` keeps it below them. `allow_importers` closes a component the order would
# open (the Enterprise Edition, the fences, the security handlers, MCP and the runners). Outside the
# order: ent (common), the Telemetry contract's client, the repository's commands and tools, test
# support and the frontend, which keep their lists. tools/analyzers/tier reads the rows, so each is
# written out by name.
layers:
  - wiring
  - [
      api-site,
      api-external,
      api-collect,
      api-staff,
      api-oauth,
      api-tracking,
      api-hooks,
      api-tlsask,
      mcp,
      runner,
      cli,
      ee-api,
      ee-runner,
      ee-edition,
    ]
  - [api-auth, api-problem]
  - gen-surfaces
  - [usecase, ee-usecase]
  # Instance, the top context.
  - domain-instance-unchecked
  - domain-instance
  # Insights.
  - ee-domain-insights-unchecked
  - ee-domain-insights
  - domain-insights-unchecked
  - domain-insights
  # Orchestration.
  - domain-orchestration-removalcheck
  - domain-orchestration-removalcheck-readers
  - domain-orchestration-unchecked
  - domain-orchestration
  # Sending.
  - domain-sending-unchecked
  - domain-sending
  # Content.
  - domain-content-unchecked
  - domain-content
  # Contacts.
  - domain-contacts-removalcheck-readers
  - domain-contacts-unchecked
  - domain-contacts
  # Identity, the bottom context.
  - ee-domain-identity-unchecked
  - ee-domain-identity
  - domain-identity-unchecked
  - domain-identity
  - domain-identity-base
  # The infrastructure and the kernel.
  - infra-unchecked
  - infra
  - [kernel, ee-licensekey]

# Every component may use the infrastructure (publish through the bus, among others) and the kernel,
# and import the generated ent client.
common: [infra, kernel, ent]

# Files that are not part of a component's own layer (tests drive whole programs).
exclude: ['**/*_test.go', '**/*.test.ts', '**/*.test.tsx', 'src/test/**', '**/testdata/**']

# Generated code stays in the graph as a target (a page may import a client, a handler its ogen
# package, nothing may import the other way) but its own imports are not checked.
target_only: ['src/generated/**', '**/*.gen.ts', '**/*_gen.go']

# A rule here holds the `because` its component's violations print, and the edges `layers` does not
# give. samber/do, dayjs and the global i18next instance are banned for every file above.
rules:
  'api-{site,external,collect}':
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-staff:
    because: the Staff surface depends on the Problem mapping and the core (its session check is the Staff member module's), never on another surface
  api-oauth:
    because: the OAuth server reads and registers OAuth clients through their module and exchanges a grant for a Connection through the API tokens module, never through another surface
  api-tracking:
    because: the tracked links record an open or a click through the Outbound message's engagement and an opt-out through its use case (ADR 0111); the host gate's Workspace comes from the shared auth package, never from the wiring
  api-hooks:
    because: the Ingest hook hands each callback to the Callback interpretation, which finds the Integration and scopes to its Workspace (ADR 0111)
  api-tlsask:
    because: the TLS question asks the Tracking domains whether a host is served (ADR 0038, ADR 0111)
  mcp:
    because: MCP projects the external API's operations as tools over the shared auth handlers and the Problem mapping, never over another surface's handlers
  api-auth:
    because: the security handlers sit below every surface
  api-problem:
    because: the Problem mapping sits below every surface and reads only the refusals the core returns
  runner:
    because: the job runner calls the core and the use cases, never a surface or the Enterprise Edition; the Enterprise runner (ee/jobs) hands its jobs in through the wiring
  cli:
    may_depend_on:
      - name: wiring
        because: a command calls the program the wiring builds (the command app of internal/app, ADR 0111), so the command line is the one driver that imports the wiring above it
    because: a command receives its arguments, calls one operation of a domain module or a use case and prints the result (review rule 5, ADR 0111); it takes them from the command app the wiring builds, never the raw client or the container, and of the Enterprise Edition it reaches only the Service credentials
  usecase:
    because: a use case composes the domain modules (ADR 0102); a piece two use cases share moves down into the domain module that owns it, and the kernel, the infrastructure and ent are open to it (common)
  domain-instance:
    may_depend_on:
      - name: gen-telemetry
        because: the Telemetry report is instancestates' own operation (ADR 0112) and sends through the Telemetry contract's client, which stays outside `layers` so that no other context sees it
    because: instance is the top context of the domain tier (ADR 0102), so an instance module imports the kernel, the infrastructure, ent and the modules of every context and the Telemetry contract's client its Telemetry report sends with (ADR 0112), never a use case
  domain-insights:
    because: insights sits above orchestration in the domain tier (ADR 0102), so an insights package imports the kernel, the infrastructure, ent and the packages of its own context and of the contexts below, never a module of the instance context (the Instance state, an upgrade) nor a use case; an operation that needs one is a use case above both
  domain-orchestration-removalcheck:
    because: the Removal check sits at the top of orchestration (ADR 0102), so it imports the readers of the modules that may hold a row and the other orchestration modules, never a module of a context above nor a use case
  domain-orchestration-removalcheck-readers:
    because: a reader belongs to its owner's context (ADR 0102), so an orchestration reader imports its owner, the modules beside it and those below, never a module of a context above nor a use case
  domain-orchestration:
    because: orchestration sits above sending in the domain tier (ADR 0102), so an orchestration module imports the kernel, the infrastructure, ent, the other orchestration modules and those of identity, contacts, content and sending, never a module of a context above (the Setup checklist, an Export stream, the Instance state) nor a use case; an operation that needs one is a use case above both
  domain-sending:
    because: sending sits above content in the domain tier (ADR 0102), so a sending module imports the kernel, the infrastructure, ent, the other sending modules and those of identity, contacts and content, never a module of a context above (a Broadcast, an Automation, a Rule, a Webhook endpoint) nor a use case; an operation that needs one is a use case above both
  domain-content:
    because: content sits above contacts in the domain tier (ADR 0102), so a content module imports the kernel, the infrastructure, ent, the other content modules and those of identity and contacts, never a module of a context above (an Integration, an Outbound message, a Broadcast, an Automation, a Rule) nor a use case; an operation that needs one is a use case above both
  domain-contacts-removalcheck-readers:
    because: a reader belongs to its owner's context (ADR 0102), so a contacts reader imports its owner and the modules of contacts and below, never a module of a context above nor a use case
  domain-contacts:
    because: contacts sits above identity in the domain tier (ADR 0102), so a contacts module imports the kernel, the infrastructure, ent, the other contacts modules and identity's, never a module of a context above (a Template, an Integration, a Broadcast, an Automation, a Rule) nor a use case; an operation that needs one is a use case above both
  domain-identity:
    because: identity is the bottom context of the domain tier (ADR 0102), so an identity module imports the kernel, the infrastructure, ent and the other identity modules, never a module of a context above (a Contact, a send cap, a Broadcast) nor a use case; an operation that needs one is a use case above both
  domain-identity-base:
    because: the Workspace and its Memberships sit at the bottom of identity (ADR 0102); every module may read them, so they import only the kernel and the infrastructure, never a domain module
  '*-unchecked':
    because: an unchecked operation belongs to its owner (ADR 0110), so it imports its owner and what its owner's context may import, never a use case
  infra:
    because: infrastructure imports only the kernel and never a domain module (ADR 0102); a domain module, a use case, a driver or the wiring reaches it. The bus's consumers are registered by the wiring, and the ent client's hooks are installed there (internal/app/entclient)
  kernel:
    must_not_depend_on:
      - name: infra
        because: the kernel sits below the infrastructure; a package that publishes an Event, reads the configuration or calls out is infrastructure or a domain module, not the kernel (ADR 0102)
      - name: ent
        because: the kernel knows no table; a package that queries through ent is infrastructure or a domain module (ADR 0102)
    # internal/kernel/cleanup reads the container for its shutdown report, the one exception the
    # doc names, suppressed at its line.
    because: the kernel is the bottom tier (ADR 0102); it imports nothing of ours outside internal/kernel, so every tier can use it
  ent:
    may_depend_on: []
    because: the ent schema reads its Go types from the kernel, and the endpoint URL rule of a Webhook endpoint from internal/infra/webhook; it knows no domain module
  tools:
    may_depend_on: []
    because: a tool package reads files and contracts, never the application's modules; what it needs from the application is the kernel
  testsupport:
    may_depend_on: []
    because: test support loads the committed fixtures with the kernel's own functions (a secret's hash) and knows no driver
  commands:
    may_depend_on: [tools, testsupport]
    because: a command of the repository runs a generator, a CI check or the development database, never the application
  ee-api:
    because: an Enterprise surface receives input, calls an Enterprise use case or domain module and returns the result (review rule 5); it never holds the raw client
  ee-edition:
    may_depend_on:
      - name: ee-api
        because: the Edition builds the Enterprise surfaces it hands to the wiring; it sits beside the drivers in `layers` so that it reaches no other surface
    forbid_external:
      - name: github.com/riverqueue/river
        because: the Edition schedules nothing; the Enterprise workers, schedules and event consumers are the Enterprise job runner's (ee/jobs, ADR 0111)
    because: the Edition builds the Enterprise modules and their surfaces on the core, never on the open surfaces' handlers
  ee-runner:
    because: the Enterprise job runner receives a job and calls an Enterprise module or use case (review rule 5, ADR 0111), never a surface, the Edition or the core's runner
  ee-licensekey:
    because: the License key's gate imports nothing of ours, so every Enterprise package can ask it what the License switches on
  ee-usecase:
    because: an Enterprise use case composes the domain modules of the core and of the Enterprise Edition (ADR 0102); it imports no unchecked operation of the core, which only the core's own use cases import (`domain-<context>-unchecked`, ADR 0110), and installs no ent hook of the core
  ee-domain-identity:
    because: an Enterprise identity module sits in the bottom context (ADR 0102), so it imports the kernel, the infrastructure, ent, the License key and the identity modules of the core and of the Edition, never a module of a context above nor a use case; it reads a contract's vocabulary from what is generated into it, never from a surface's generated package
  ee-domain-insights:
    because: an Enterprise insights module sits above orchestration (ADR 0102), so it imports the kernel, the infrastructure, ent, the License key and the modules of the core and of the Edition of its context and the contexts below, never an instance module nor a use case; an operation that needs one is a use case
  wiring:
    may_depend_on:
      - name: gen-telemetry
        because: the wiring builds the Telemetry report's client (ADR 0104), which stays outside `layers`
      - name: testsupport
        because: the test harness (internal/testhelper) loads the committed fixtures, which stay outside `layers`
    because: wiring is where the program is assembled; it builds the Telemetry report's client and reads the host the report describes (ADR 0104)

  web-generated:
    may_depend_on: []
    because: generated clients come from the OpenAPI contract and import nothing of ours
  web-dates:
    may_depend_on: []
    because: the dates and the dayjs locale data wrap dayjs and import nothing of ours, so every part of the frontend can use them
  web-shared:
    may_depend_on: [web-generated, web-dates, web-routes, web-app]
    because: shared components, hooks and layouts sit below the pages; a page imports them, never the reverse (they link through a route's `Route`, never a path string)
  web-routes:
    may_depend_on: [web-generated, web-shared, web-app]
    because: a route file holds guards and search schemas and never imports a page (src/AGENTS.md)
  web-route-lazy:
    may_depend_on: [web-shared, web-pages, web-console]
    because: the lazy route file is the one place a page is bound to its route
  web-pages:
    may_depend_on: ['@web-base']
    because: a page reaches its route through the route file's `Route` and never imports a lazy route file
  web-console:
    may_depend_on: ['@web-base']
    because: the Staff console is its own feature and does not import the workspace pages
  web-app:
    may_depend_on: [web-generated, web-shared, web-routes]
    because: the files directly under src/ assemble the application

# The boundaries above, pinned as decisions on dependencies no code writes yet: every check judges
# each one as `easement propose` would, and fails as `example` when a later grant, layer or
# importer list lets a rejected one through or stops an allowed one. They say what the policy
# means, not how it is written: restate a rule and they keep passing. Before adding a new path,
# ask `easement propose <from> <to>` for its decision.
examples:
  # Drivers.
  - from: internal/api/site/access.go
    to: internal/api/staff/handlers.go
    expect: rejected
    because: a surface never imports another surface
  - from: internal/api/site/access.go
    to: internal/usecase/contacterasure/contacterasure.go
    expect: allowed
    because: a driver calls a use case
  # Unchecked operations (ADR 0110).
  - from: internal/api/site/access.go
    to: internal/domain/contacts/contacts/contactsunchecked/contactsunchecked.go
    expect: rejected
    because: only a use case imports an unchecked operation, after its check
  - from: internal/domain/contacts/contacts/bounds.go
    to: internal/domain/contacts/contacts/contactsunchecked/contactsunchecked.go
    expect: rejected
    because: not even the owner of an unchecked operation bypasses the check; its use case calls it
  - from: internal/usecase/contacterasure/contacterasure.go
    to: internal/domain/contacts/contacts/contactsunchecked/contactsunchecked.go
    expect: allowed
    because: the use case that checks first calls the unchecked operation
  # Use cases and domain modules (ADR 0102).
  - from: internal/domain/contacts/contacts/bounds.go
    to: internal/usecase/contacterasure/contacterasure.go
    expect: rejected
    because: no domain module imports a use case
  - from: internal/usecase/contacterasure/contacterasure.go
    to: internal/usecase/tagdeletion/tagdeletion.go
    expect: rejected
    rule: isolation
    because: no use case imports another; what two share moves down into a domain module
  - from: internal/infra/events/account.go
    to: internal/domain/contacts/contacts/bounds.go
    expect: rejected
    because: the bus imports no domain module
  - from: internal/domain/contacts/contacts/bounds.go
    external: github.com/samber/do/v2
    expect: rejected
    because: only the wiring sees the DI container
  - from: internal/app/app.go
    external: github.com/samber/do/v2
    expect: allowed
    because: the wiring builds the container
  # The Enterprise Edition.
  - from: internal/domain/contacts/contacts/bounds.go
    to: ee/domain/insights/abusedetector/deliverability.go
    expect: rejected
    because: the core never imports the Enterprise Edition
  - from: internal/usecase/contacterasure/contacterasure.go
    to: ee/usecase/auditlogretention/auditlogretention.go
    expect: rejected
    because: the core never imports the Enterprise Edition
  # The frontend.
  - from: src/routes/acceptance.tsx
    to: src/pages/activity/page.tsx
    expect: rejected
    because: a route file never imports a page; its lazy file binds it
  - from: src/routes/acceptance.lazy.tsx
    to: src/pages/activity/page.tsx
    expect: allowed
    because: the lazy route file is the one place a page is bound to its route
  - from: src/components/ActionName.tsx
    to: src/pages/activity/page.tsx
    expect: rejected
    because: shared UI sits below the pages and never imports one
  - from: src/pages/account/acceptance.tsx
    to: src/pages/activity/page.tsx
    expect: rejected
    rule: isolation
    because: a page never imports another page
  - from: src/pages/activity/page.tsx
    external: dayjs
    expect: rejected
    because: dates go through src/utils/datetime.ts
  - from: src/components/ActionName.tsx
    external: dayjs
    expect: rejected
    because: shared UI formats dates through src/utils/datetime.ts too
  - from: src/utils/datetime.ts
    external: dayjs
    expect: allowed
    because: src/utils/datetime.ts is where the dates use dayjs
  - from: src/utils/dayjsLocale.ts
    external: dayjs
    expect: allowed
    because: the date inputs load their dayjs locale data there
  # The raw client (Workspace scoping).
  - from: internal/api/site/access.go
    symbol: github.com/getsphericon/sphericon/ent.Client
    expect: rejected
    because: a handler takes a *ent.Scoped, never the raw client
  - from: internal/domain/contacts/contacts/bounds.go
    symbol: github.com/getsphericon/sphericon/ent.Client
    expect: rejected
    because: a domain module outside the closed list of raw-client holders takes a *ent.Scoped
  - from: internal/domain/sending/bindings/bindings.go
    symbol: github.com/getsphericon/sphericon/ent.Client
    expect: allowed
    because: the Bindings are in the closed list of raw-client holders
  - from: internal/domain/sending/integrations/integrationsunchecked/integrationsunchecked.go
    symbol: github.com/getsphericon/sphericon/ent.Client
    expect: rejected
    because: a holder's unchecked subpackage is not in the closed list; it takes the scoped client its use case passes
  - from: internal/usecase/workspacedeletion/workspacedeletion.go
    symbol: github.com/getsphericon/sphericon/ent.Client
    expect: allowed
    because: the deletion cycle starts with no Workspace to scope to
  - from: internal/usecase/contacterasure/contacterasure.go
    symbol: github.com/getsphericon/sphericon/ent.Client
    expect: rejected
    because: a use case takes the *ent.Scoped its driver built

# Each import of a package is declared in the nearest package.json.
manifests: true

# Every checked file belongs to a component, so a new package must be assigned to one. These
# are the generated, tooling and separately built trees that have no layer of their own.
strict: true

# Files behind a build tag are indexed only with that tag; a file and its `!tag` twin cannot both
# be read, so the twin not read is accepted below. `race` stays off (`race_off.go` is read).
indexers:
  go:
    tags: [e2e, embed_spa, embed_changelog]
uncovered_ok:
  - name: '**/race_on.go'
    because: the race-detector twin of race_off.go, built only under -race
  - name: internal/domain/instance/upgradenote/embed_none.go
    because: the twin of embed.go, built when embed_changelog is off
  - name: internal/server/spa_noembed.go
    because: the twin of spa_embed.go, built when embed_spa is off
  - name: internal/kernel/emaildoc/assets/emaildoc.js
    because: the generated document renderer bundle, not source
  - name: ent/entc.go
    because: the ent codegen entry point, built with the `ignore` tag
  - name: ent/internal/schema.go
    because: generated by ent, built with the `tools` tag
unowned:
  - tools/**
  - packages/**
  - mise/**
  - e2e/**
  # The TypeSpec contract's decorators (ADR 0069), loaded by the TypeSpec compiler.
  - typespec/**
  # The frontend's ambient type declarations (the i18next resources), read by tsc, imported by none.
  - types/**
  # Tool configs and the two embed files at the repository root. A glob without a directory
  # matches at any depth (`'*.go'` would leave every Go file uncovered), so each file is named.
  - commitlint.config.ts
  - i18next.config.ts
  - knip.ts
  - openapi-ts.config.ts
  - oxfmt.config.ts
  - oxlint.config.ts
  - vite.config.ts
  - migrations.go
  - spec.go
