# Architecture gate (https://github.com/mokevnin/easement): `mise run check:arch`.
# The boundaries below are the ones docs/architecture.md states in prose; a violation names
# the rule's `because`, so read it before reaching for a baseline entry.
version: 1

# The rule parts several components share, merged with `<<`.
x-no-raw-client: &no-raw-client
  forbid_symbol:
    - name: github.com/getsphericon/sphericon/ent.Client
      because: a handler takes a *ent.Scoped so every query is workspace-bound (docs/architecture.md, Workspace scoping)
# The scope vocabulary of the credentials a User gives is generated into internal/kernel/tokenscope;
# its copy in the /site surface's generated package is the surface's own.
x-scope-because: &scope-because the core reads the scope vocabulary from internal/kernel/tokenscope, generated from the same TypeSpec enums, never from a surface's generated package (ADR 0102)
x-no-surface-scope-1: &no-surface-scope-1
  name: github.com/getsphericon/sphericon/gen/site.GrantableScope
  because: *scope-because
x-no-surface-scope-2: &no-surface-scope-2
  name: github.com/getsphericon/sphericon/gen/site.SendScope
  because: *scope-because
x-no-surface-scope-3: &no-surface-scope-3
  name: github.com/getsphericon/sphericon/gen/site.SetupScope
  because: *scope-because
x-no-surface-scope-4: &no-surface-scope-4
  name: github.com/getsphericon/sphericon/gen/site.PersonalScope
  because: *scope-because
x-no-container: &no-container
  - name: github.com/samber/do
    because: no domain module or handler sees the DI container; a new dependency is a provider in internal/app/container.go (docs/architecture.md, Backend architecture)
# The global i18next instance belongs to @workflowbuilder/sdk, which re-initialises it at import time;
# the app runs on its own instance (src/i18n.ts). The types (`TFunction`, `i18n`) stay allowed.
x-no-global-i18n: &no-global-i18n
  forbid_symbol:
    - name: i18next.i18next
      because: the app's strings live on its own instance from src/i18n.ts, reached through useTranslation; the global one is the workflow builder SDK's, which wipes it on import
x-no-dayjs: &no-dayjs
  name: dayjs
  because: dates go through src/utils/datetime.ts (src/AGENTS.md), which holds the plugins, the time zone and the formats

components:
  # The public API surfaces. Each has its own TypeSpec contract, handler package and auth scheme.
  api-site: { in: internal/api/site }
  api-external: { in: internal/api/external }
  api-collect: { in: internal/api/collect }
  api-staff: { in: internal/api/staff }
  # The security handlers every surface shares.
  api-auth: { in: internal/api/auth }
  # The answer of every refusal on every surface (ADR 0103): shared surface code like the security
  # handlers, so it sits among the drivers and the core never reaches it.
  api-problem:
    in: internal/api/problem
    allow_importers: [api-site, api-external, api-collect, api-staff, ee-api, wiring]
    because: the Problem mapping is the surfaces' own code (it imports every surface's generated package); a core package returns its refusal and never decides the answer

  # The wiring: the places that may build the whole program, and so may reach the Enterprise Edition.
  wiring:
    in:
      [
        internal/app,
        internal/server,
        internal/mcpserver,
        internal/testhelper,
        internal/doctor,
        cmd/server,
      ]

  # The handlers of the Enterprise surfaces (the Staff console's Enterprise sections and the service
  # endpoints), over their domain module in ee/staff. The Edition (ee/ee.go) builds them.
  ee-api:
    in: 'ee/api/**'
    allow_importers: [ee-edition]
    because: an Enterprise surface is built by the Edition (ee/ee.go), which the wiring mounts; no Enterprise module reaches a handler
  # The Edition itself (ee/ee.go): the one package that assembles the Enterprise modules and surfaces.
  ee-edition:
    in: 'ee/*.go'
    allow_importers: [wiring]
    because: only the wiring assembles the Enterprise Edition
  # Enterprise Edition, one binary gated by the license key.
  ee:
    in: 'ee/**'
    allow_importers: [wiring, ee-api, ee-edition]
    because: the core never imports the Enterprise Edition; only the wiring assembles it, and an Enterprise surface calls its module

  # Frontend (src/AGENTS.md). Generated clients are leaves; a route file binds a page lazily and
  # never imports it, so a page may import its route's `Route` without a cycle.
  web-generated: { in: src/generated }
  web-routes: { in: src/routes }
  # `foo.lazy.tsx` is where the page is bound; `foo.tsx` (guards, search schemas) never sees it.
  web-route-lazy: { in: 'src/routes/**/*.lazy.tsx' }
  # Each directory under src/pages is a feature; features share through src/components, hooks and utils.
  web-pages:
    in: src/pages/*
    isolated: true
    because: a page feature never imports another feature's page; what two features share lives in src/components, src/hooks or src/utils
  web-console: { in: src/console }
  web-shared: { in: [src/components, src/hooks, src/layouts, src/resources, src/utils] }
  # The files directly under src/: router, guards, theme, instance, i18n, entry points.
  web-app: { in: 'src/*' }

  # The job runner is a driver, like the API surfaces (review rule 5): it receives a job, calls a
  # domain module and records the result. Only the wiring builds it; a package with jobs of its own
  # hands them in as a jobextension.Extension.
  runner:
    in: internal/jobs
    allow_importers: [wiring]
    because: the job runner is a driver that only the wiring builds; a package with jobs of its own hands them in as a jobextension.Extension, never importing the runner

  # The core packages that may hold the raw *ent.Client: the closed list "The raw *ent.Client is
  # allowed only in" of docs/architecture.md (Workspace scoping), kept in step with it. A package
  # is the unit, so the doc's narrower grants (`capturedmessages` only `Purge`, `automations` only
  # `FenceOn`, `bindings` only `PruneStartTokens`) are left to review. The composition roots, `internal/api/auth` and the job
  # runner are in the doc's list too; they sit in `wiring`, `api-auth` and `runner`, which do not forbid the client.
  core-raw:
    in:
      [
        internal/accounts,
        internal/automations,
        internal/bindings,
        internal/capturedmessages,
        internal/consent,
        internal/consentrecords,
        internal/db,
        internal/domainverify,
        internal/instance,
        internal/instanceaudit,
        internal/joindomains,
        internal/machine,
        internal/oauthserver,
        internal/rekey,
        internal/secondfactor,
        internal/signupitems,
        internal/signupsurvey,
        internal/staffmembers,
        internal/suspension,
        internal/trackingdomains,
        internal/trackinghostlog,
        internal/userfeed,
        internal/workspacedeletion,
        internal/workspacefeed,
      ]
    # The Role definitions take no client at all.
    except: [internal/accounts/roles]

  # The domain-event bus (docs/design/domain-events.md): it stores an Event and queues the jobs of
  # its consumers, which the wiring registers on it. It holds the raw client like core-raw (the
  # closed list of docs/architecture.md, Workspace scoping) and knows no domain module (ADR 0102).
  bus: { in: internal/events }
  # Two domain modules the bus must not know (bus: must_not_depend_on). They are components of
  # their own only so the bus can name them; to everyone else they are core (common, core's rules).
  suppression: { in: internal/suppression }
  messaging: { in: internal/messaging }

  # Everything else under internal/ is the core domain.
  core: { in: ['internal/**', config] }

# Every component may publish through the bus, and reach suppression and messaging as it reaches
# the rest of the core.
common: [bus, suppression, messaging]

# Files that are not part of a component's own layer (tests drive whole programs).
exclude: ['**/*_test.go', '**/*.test.ts', '**/*.test.tsx', 'src/test/**', '**/testdata/**']

# Generated code stays in the graph as a target (a page may import a client, a handler its ogen
# package, nothing may import the other way) but its own imports are not checked.
target_only: ['src/generated/**', '**/*.gen.ts', '**/*_gen.go']

rules:
  api-site:
    <<: *no-raw-client
    may_depend_on: [api-auth, api-problem, core, core-raw]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-external:
    <<: *no-raw-client
    may_depend_on: [api-auth, api-problem, core, core-raw]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-collect:
    <<: *no-raw-client
    may_depend_on: [api-auth, api-problem, core, core-raw]
    forbid_external: *no-container
    because: a surface depends on the shared auth handlers, the Problem mapping and the core, never on another surface
  api-staff:
    <<: *no-raw-client
    may_depend_on: [api-problem, core, core-raw]
    forbid_external: *no-container
    because: the Staff surface depends on the Problem mapping and the core (its session check is the Staff member module's), never on another surface
  api-auth:
    may_depend_on: [core, core-raw]
    forbid_external: *no-container
    because: the security handlers sit below every surface
  api-problem:
    <<: *no-raw-client
    may_depend_on: [core, core-raw]
    forbid_external: *no-container
    because: the Problem mapping sits below every surface and reads only the refusals the core returns
  core:
    may_depend_on: [core-raw]
    forbid_symbol: &core-forbids
      - name: github.com/getsphericon/sphericon/ent.Client
        because: a domain module takes a *ent.Scoped; needing raw access means a new small package in the closed list of docs/architecture.md (Workspace scoping) and in `core-raw` here, never a field of a module
      - *no-surface-scope-1
      - *no-surface-scope-2
      - *no-surface-scope-3
      - *no-surface-scope-4
    # internal/cleanup reads the container for its shutdown report, the one core exception the doc names.
    forbid_external: *no-container
    because: core depends on neither a surface nor the Enterprise Edition; it reaches them through interfaces (site.AuditLog, events.Consumer) wired in internal/app
  core-raw:
    may_depend_on: [core]
    forbid_external: *no-container
    forbid_symbol: &raw-holder-forbids
      - *no-surface-scope-1
      - *no-surface-scope-2
      - *no-surface-scope-3
      - *no-surface-scope-4
      - name: github.com/getsphericon/sphericon/internal/emailcase.Hook
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the database package and the other raw-client holders install none
      - name: github.com/getsphericon/sphericon/internal/workspacefeed.Hook
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the database package and the other raw-client holders install none
      - name: github.com/getsphericon/sphericon/internal/workspacefeed.Guard
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the database package and the other raw-client holders install none
      - name: github.com/getsphericon/sphericon/internal/userfeed.Hook
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the database package and the other raw-client holders install none
      - name: github.com/getsphericon/sphericon/internal/userfeed.Guard
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the database package and the other raw-client holders install none
      - name: github.com/getsphericon/sphericon/internal/trackinghostlog.Hook
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the database package and the other raw-client holders install none
      - name: github.com/getsphericon/sphericon/internal/trackinghostlog.Guard
        because: the wiring builds every ent client with its hooks (internal/app/entclient, ADR 0102); the database package and the other raw-client holders install none
      - name: github.com/getsphericon/sphericon/internal/upgrade.Boundaries
        because: the JSON schema status that `upgrade` reads is built in the wiring (app.WriteSchemaBoundaries, ADR 0102); the database package knows no upgrade type
      - name: github.com/getsphericon/sphericon/internal/upgrade.MajorFloor
        because: the JSON schema status that `upgrade` reads is built in the wiring (app.WriteSchemaBoundaries, ADR 0102); the database package knows no upgrade type
    because: core depends on neither a surface nor the Enterprise Edition; it reaches them through interfaces (site.AuditLog, events.Consumer) wired in internal/app
  runner:
    may_depend_on: [core, core-raw]
    forbid_external: *no-container
    forbid_symbol: *raw-holder-forbids
    because: the job runner calls the core, never a surface or the Enterprise Edition; the Edition hands its jobs in through the wiring
  bus:
    may_depend_on: [core]
    must_not_depend_on:
      - name: suppression
        because: the suppression consumer is a job of the runner (internal/jobs), and suppression refers to the bus's names, never the reverse
      - name: messaging
        because: the send-outcome counter of a bounce or a complaint is recorded by the ingest module, which the wiring registers on the bus (OnStored)
    forbid_external: *no-container
    forbid_symbol: *raw-holder-forbids
    because: the bus is infrastructure (ADR 0102); a consumer, a module or the wiring reaches it, it reaches no domain module
  suppression:
    may_depend_on: [core]
    forbid_symbol: *core-forbids
    forbid_external: *no-container
    because: core depends on neither a surface nor the Enterprise Edition; it reaches them through interfaces (site.AuditLog, events.Consumer) wired in internal/app
  messaging:
    may_depend_on: [core]
    forbid_symbol: *core-forbids
    forbid_external: *no-container
    because: core depends on neither a surface nor the Enterprise Edition; it reaches them through interfaces (site.AuditLog, events.Consumer) wired in internal/app
  ee-api:
    <<: *no-raw-client
    may_depend_on: [api-problem, core, core-raw, ee]
    forbid_external: *no-container
    because: an Enterprise surface receives input, calls its domain module in ee/ and returns the result (review rule 5); it never holds the raw client
  ee-edition:
    may_depend_on: [core, core-raw, ee, ee-api]
    forbid_external: *no-container
    because: the Edition builds the Enterprise modules and their surfaces on the core, never on the open surfaces' handlers
  ee:
    may_depend_on: [core, core-raw]
    forbid_external: *no-container
    because: the Enterprise Edition builds on the core and never on a surface's handlers; the Edition (ee-edition) builds its own surfaces
  wiring:
    may_depend_on:
      [
        core,
        core-raw,
        ee,
        ee-edition,
        api-site,
        api-external,
        api-collect,
        api-staff,
        api-auth,
        api-problem,
        runner,
      ]
    because: wiring is where the program is assembled

  web-generated:
    may_depend_on: []
    because: generated clients come from the OpenAPI contract and import nothing of ours
  web-shared:
    <<: *no-global-i18n
    may_depend_on: [web-generated, web-routes, web-app]
    because: shared components, hooks and layouts sit below the pages; a page imports them, never the reverse (they link through a route's `Route`, never a path string)
  web-routes:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-app]
    because: a route file holds guards and search schemas and never imports a page (src/AGENTS.md)
  web-route-lazy:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-shared, web-pages, web-console, web-app]
    because: the lazy route file is the one place a page is bound to its route
  web-pages:
    <<: *no-global-i18n
    forbid_external:
      - name: '@mantine/notifications'
        because: toasts go through useNotify (src/hooks/useNotify.ts), never Mantine's global store
      - *no-dayjs
    may_depend_on: [web-generated, web-shared, web-routes, web-app]
    because: a page reaches its route through the route file's `Route` and never imports a lazy route file
  web-console:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-routes, web-app]
    because: the Staff console is its own feature and does not import the workspace pages
  web-app:
    <<: *no-global-i18n
    forbid_external: [*no-dayjs]
    may_depend_on: [web-generated, web-shared, web-routes]
    because: the files directly under src/ assemble the application

# Each import of a package is declared in the nearest package.json.
manifests: true

# Every checked file belongs to a component, so a new package must be assigned to one. These
# are the generated, tooling and separately built trees that have no layer of their own.
strict: true

# Files behind a build tag are indexed only with that tag; a file and its `!tag` twin cannot both
# be read, so the twin not read is accepted below. `race` stays off (`race_off.go` is read).
go:
  tags: [e2e, embed_spa, embed_changelog]
uncovered_ok:
  - name: '**/race_on.go'
    because: the race-detector twin of race_off.go, built only under -race
  - name: internal/changelog/embed_none.go
    because: the twin of embed.go, built when embed_changelog is off
  - name: internal/server/spa_noembed.go
    because: the twin of spa_embed.go, built when embed_spa is off
  - name: internal/emaildoc/assets/emaildoc.js
    because: the generated document renderer bundle, not source
  - name: ent/entc.go
    because: the ent codegen entry point, built with the `ignore` tag
  - name: ent/internal/schema.go
    because: generated by ent, built with the `tools` tag
unowned:
  - ent/**
  - tools/**
  - packages/**
  - mise/**
  - cmd/**
  - e2e/**
  # The TypeSpec contract's decorators (ADR 0069), loaded by the TypeSpec compiler.
  - typespec/**
  # Tool configs and the two embed files at the repository root.
  - '*.ts'
  - '*.go'
