# The job runner and the Edition schedule work (ADR 0102): a domain module or a use case does the
# work as a function and may queue a job (its args, river's insert), but it declares no worker and
# no periodic job; those live in internal/jobs and in the Edition's ee/jobs.go, which call the
# function. Every forbid list of a domain module or a use case takes these.
x-river-scheduling: &river-scheduling
  - &river-worker-defaults
    name: github.com/riverqueue/river.WorkerDefaults
    because: &river-scheduling-because a domain module or a use case does the work as a function and may queue a job, but its worker and its periodic job belong to a driver (ADR 0102), internal/jobs or the Edition's ee/jobs.go, which call the function
  - &river-add-worker
    name: github.com/riverqueue/river.AddWorker
    because: *river-scheduling-because
  - &river-new-periodic-job
    name: github.com/riverqueue/river.NewPeriodicJob
    because: *river-scheduling-because
