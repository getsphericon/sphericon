# Architecture gate (https://github.com/mokevnin/easement): `mise run check:arch`.
# The boundaries below are the ones docs/architecture/modules.md states in prose; a violation names
# the rule's `because`, so read it before reaching for a baseline entry.
version: 1

# Every name below may be used only by the components its `allow` lists: a use anywhere else fails,
# in a component with no rule of its own, in a file of no component and in the other packages, or
# the other files, of the module that defines it (only its definition is no use). Tests are
# excluded. Name a function as `<import path>.<Name>`: a bare import path matches nothing.
forbid_symbol:
  # A domain module's unchecked operation, or the store of a check's outcome (a Sending domain's DKIM
  # and DMARC moments), is reachable only from its use case (ADR 0102): the Live use writes, the
  # Workspace's deletion cycle and the erase of its rows, a Contact's Erasure, the Second factor's
  # writes that skip its checks and the issue of an OAuth grant's credentials. The Erasure's purge of
  # queued jobs is a method of the bus's publisher (events.PurgingPublisher), which a name cannot
  # forbid. The removal of the only Owner's Membership of a Workspace in its deletion window serves
  # User deletion, in `internal/domain/identity/users` (`domain-identity-users`), which alone may call it.
  - name: github.com/getsphericon/sphericon/internal/domain/contacts/tags.DeleteIn
    allow: &use-cases [usecase, usecase-raw]
    because: deleting a Tag is the use case internal/usecase/tagdeletion, which runs the Removal check, the Tag's Definition use, under the Workspace lock first (ADR 0102, ADR 0049, ADR 0099); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/contacts/contacts.UpdateCustomFieldIn
    allow: *use-cases
    because: editing a Custom field is the use case internal/usecase/customfieldretyping, which runs the Removal check under the Workspace lock first, refusing a retype while a Segment, a Rule or an armed Broadcast tests the field with a leaf the new type does not take (ADR 0102, ADR 0065, ADR 0099); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/sending/integrations.DeleteIn
    allow: *use-cases
    because: deleting an Integration is the use case internal/usecase/integrationdeletion, which runs the Removal check, the Integration's Live use, under the Workspace lock first (ADR 0102, ADR 0049, ADR 0099); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/sending/sendingdomains.DeleteIn
    allow: *use-cases
    because: deleting a Sending domain is the use case internal/usecase/sendingdomaindeletion, which runs the Removal check, the domain's Live use, under the Workspace lock first (ADR 0102, ADR 0049, ADR 0099); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/sending/sendingdomains.RecordDKIM
    allow: *use-cases
    because: a Sending domain becomes verified only by a live DKIM lookup (ADR 0010), which the use case internal/usecase/sendingdomainverification runs before it stores the outcome; call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/sending/sendingdomains.RecordDMARC
    allow: *use-cases
    because: a Sending domain becomes bulk-ready only by a live DMARC lookup (ADR 0012), which the use case internal/usecase/sendingdomainverification runs before it stores the outcome; call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/contacts/contacts.DeleteIn
    allow: *use-cases
    because: deleting a Contact is Erasure, the use case internal/usecase/contacterasure, which erases the person's Events, Visitors, delivery records and queued work through their owners before the row, in one transaction (ADR 0021, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/users.MoveSecondFactorIn
    allow: *use-cases
    because: a Second factor moves only after the use case internal/usecase/secondfactorcheck checks its code or reset authority, and commits Recovery codes and audit in the same transaction (ADR 0020, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/recoverycodes.ReplaceIn
    allow: *use-cases
    because: Recovery codes are issued only with an active or a just confirmed Second factor, which the use case internal/usecase/secondfactorcheck checks first (ADR 0020, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/recoverycodes.DeleteIn
    allow: *use-cases
    because: Recovery codes go only with their Second factor, through the use case internal/usecase/secondfactorcheck (ADR 0020, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/passkeys.DeleteAllIn
    allow: *use-cases
    because: every Passkey of a User goes only in a Second factor reset, which the use case internal/usecase/secondfactorcheck checks and records (ADR 0020, ADR 0052, ADR 0102); call the use case, or passkeys.Module.Remove for one Passkey
  - name: github.com/getsphericon/sphericon/internal/domain/identity/apitokens.IssueConnection
    allow: *use-cases
    because: a Connection is issued only for an authorization code whose PKCE verifier the use case internal/usecase/connectionissuance has checked and claimed (ADR 0016, ADR 0061, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/apitokens.RotateConnection
    allow: *use-cases
    because: a Connection rotates only for a refresh token the use case internal/usecase/connectionissuance has checked and claimed (ADR 0016, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/oauthclients.NewRefreshTokenIn
    allow: *use-cases
    because: a refresh token is issued only with the Connection of a checked and claimed grant, by the use case internal/usecase/connectionissuance (ADR 0016, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/workspaces.DiscardIn
    allow: *use-cases
    because: a Workspace is deleted only by the use case internal/usecase/workspacedeletion, which checks the typed name first and records the deletion (ADR 0043, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/workspaces.RestoreIn
    allow: *use-cases
    because: a deleted Workspace is restored only by the use case internal/usecase/workspacedeletion, for a User whose Role holds workspace:delete there (ADR 0043, ADR 0061, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/workspaces.TombstoneIn
    allow: *use-cases
    because: a Workspace is erased only by the use case internal/usecase/workspacedeletion, after it has removed every row the Workspace owned and the OAuth codes that name it (ADR 0043, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/workspaces.CreateIn
    allow: *use-cases
    because: a Workspace is created only by the use cases internal/usecase/workspacecreation, which refuses an Unverified User (ADR 0030), and internal/usecase/signup, which creates a User's first one as it makes the User Verified; each writes its Owner Membership on the same transaction and gives it the Send cap it starts with (ADR 0043, ADR 0067, ADR 0102); call a use case
  - name: github.com/getsphericon/sphericon/internal/domain/identity/memberships.AddCreatorIn
    allow: *use-cases
    because: the creator's Owner Membership is written only with its Workspace, by the use cases internal/usecase/workspacecreation and internal/usecase/signup (ADR 0043, ADR 0102); call a use case
  - name: github.com/getsphericon/sphericon/internal/infra/events.EraseEventsIn
    allow: *use-cases
    because: &workspace-erase-because a deleted Workspace is erased only by the use case internal/usecase/workspacedeletion, once its deletion window has passed, one batch of listed ids at a time and in the order of the foreign keys (ADR 0043, ADR 0102); call the use case
  - name: github.com/getsphericon/sphericon/internal/domain/contacts/orders.EraseHeldOrderEventsIn
    allow: *use-cases
    because: *workspace-erase-because
  - name: github.com/getsphericon/sphericon/internal/domain/contacts/orders.EraseOrderMovementsIn
