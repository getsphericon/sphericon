# Workspace acme (id 1). Firings of RuleTagClicked (100): one finished, one whose Actions are
# still to run. Unique (rule_id, source_id).
- id: 100 # fixture: RuleFiringDone
  rule_id: 100
  contact_id: 1
  action: rule_click
  source_id: 'fixture:rule-firing-done'
  actions: '[{"type":"apply_tag","tag":"rule-clicked"}]'
  results: '[{"type":"apply_tag","status":"succeeded"}]'
  completed_at: '{{daysAgo 2}}'
  workspace_id: 1
  created_at: '{{daysAgo 2}}'
  updated_at: '{{daysAgo 2}}'
- id: 101 # fixture: RuleFiringPending
  rule_id: 100
  contact_id: 2
  action: rule_click
  source_id: 'fixture:rule-firing-pending'
  actions: '[{"type":"apply_tag","tag":"rule-clicked"}]'
  results: '[]'
  workspace_id: 1
  created_at: '{{daysAgo 1}}'
  updated_at: '{{daysAgo 1}}'

