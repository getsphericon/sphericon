# Entries into an Automation its entry checks refused (ADR 0127), one per Automation and Event.
# Liam completed the Welcome series and came back: `once`. Emma's second trigger came while her
# Enrollment ran: `active_enrollment`. One 500 days old expires with the analytical Events (ADR 0019).
- {
    id: 1, # fixture: SkippedEntryWelcomeLiam
    automation_id: 100,
    contact_id: 100,
    workspace_id: 1,
    source_id: 'fixture:skipped-welcome-liam',
    reason: once,
    occurred_at: '{{daysAgo 1}}',
    created_at: '{{daysAgo 1}}',
    updated_at: '{{daysAgo 1}}',
  }
- {
    id: 2, # fixture: SkippedEntryWelcomeEmma
    automation_id: 100,
    contact_id: 101,
    workspace_id: 1,
    source_id: 'fixture:skipped-welcome-emma',
    reason: active_enrollment,
    occurred_at: '{{daysAgo 3}}',
    created_at: '{{daysAgo 3}}',
    updated_at: '{{daysAgo 3}}',
  }
- {
    id: 3, # fixture: SkippedEntryExpired
    automation_id: 100,
    contact_id: 100,
    workspace_id: 1,
    source_id: 'fixture:skipped-expired',
    reason: once,
    occurred_at: '{{daysAgo 500}}',
    created_at: '{{daysAgo 500}}',
    updated_at: '{{daysAgo 500}}',
  }
- {
    id: 900, # fixture: SkippedEntryGlobex
    automation_id: 900,
    contact_id: 900,
    workspace_id: 2,
    source_id: 'fixture:skipped-globex',
    reason: once,
    occurred_at: '{{daysAgo 1}}',
    created_at: '{{daysAgo 1}}',
    updated_at: '{{daysAgo 1}}',
  }
