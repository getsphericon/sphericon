# Two Integrations of Acme read their callbacks with the generic Preset, each with a secret of its
# own: a callback signed for one must never be accepted by the other.
- id: 3 # fixture: IntegrationAcmeGenericA
  ingest_key: omik_test_integrationacmegenerica
  name: Relay A (generic Preset)
  channel: email
  provider: smtp
  config_encrypted: '{{ encrypt "{\"host\":\"relay-a.example.com\",\"port\":587,\"from\":\"hello@codebasics.dev\"}" }}'
  preset: generic
  params_encrypted: '{{ encrypt "{\"secret\":\"whsec_c3BoZXJpY29uLXRlc3Qtc2VjcmV0LUEwMTIzNDU2Nzg5\"}" }}'
  enabled: true
  is_default: false
  workspace_id: 1
  created_at: '{{daysAgo 30}}'
  updated_at: '{{daysAgo 30}}'
- id: 4 # fixture: IntegrationAcmeGenericB
  ingest_key: omik_test_integrationacmegenericb
  name: Relay B (generic Preset)
  channel: email
