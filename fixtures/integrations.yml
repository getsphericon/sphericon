# A row that names no topic cannot be saved any more (the `ses` Preset requires one); it stands
# for one stored before that, and the hook must still refuse its notifications.
- id: 901 # fixture: IntegrationGlobexSesNoTopic
  ingest_key: omik_test_integrationglobexsesnotopic
  name: Globex SES (stored without an SNS topic)
  channel: email
  provider: ses
  config_encrypted: '{{ encrypt "{\"region\":\"eu-west-1\",\"accessKeyId\":\"AKIAGLOBEX\",\"from\":\"hello@globex.test\"}" }}'
  preset: ses
  params_encrypted: '{{ encrypt "{}" }}'
  enabled: true
  is_default: false
  workspace_id: 2
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'

# Two Integrations of Acme read their callbacks with the generic Preset, each with a secret of its
# own: a callback signed for one must never be accepted by the other.
