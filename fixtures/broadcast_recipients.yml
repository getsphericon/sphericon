# Workspace acme (id 1). Per-recipient audience and engagement for the sent broadcasts
# (200-205). A recipient holds no delivery state (ADR 0015): how its send ended is its row in
# outbound_messages.yml (kind: broadcast, key "broadcast:<id>"), and a recipient with no message
# is pending. The send time that drives the analytics cohort + time series is the message's;
# opened_at is a subset of sent, clicked_at a subset of opened. A broadcast's figures are
# derived from these rows, never stored.

