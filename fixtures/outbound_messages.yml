# Workspace acme (id 1). Outbound messages (ADR 0015): the durable record of every email
# sent on the workspace's behalf. These rows are the transactional surface's history
# (kind: transactional); template_id is a foreign key into email_templates (set null when the
# Template is deleted). Outcomes cover sent / skipped (suppression) / failed; idempotency_key is
# unique per (workspace, key) and namespaced by surface. Rows 100-105 are anchors.
- id: 100 # fixture: OutboundMessageWelcome
  kind: transactional
  idempotency_key: 'transactional:txn-welcome-100'
  channel: email
  destination: liam.python@codebasics.dev
  contact_id: 100
  template_id: 1
  status: sent
  sending_domain: codebasics.dev
  provider_message_id: '<fixture-100@codebasics.dev>'
