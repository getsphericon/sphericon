# Staff holds (ADR 0009). Both rows are lapsed, so no fixture Workspace is frozen: a
# test that wants a freeze sets a hold through the service endpoints (or the scoped client).
- id: 1 # fixture: HoldAcmeLapsed
  key: lapsed
  reason_code: review
  message: Sending is paused for now.
  expires_at: '{{daysAgo 1}}'
