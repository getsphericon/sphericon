# Usage figures (ADR 0009): one closed Usage snapshot per tenant (Acme December 2025, Globex
# November 2025, so a row copied from one tenant to the other never collides on the unique
# (workspace, period, metric)), both before every fixture Workspace was created, so the usage job (which starts at a
# Workspace's creation month) never touches them.
- id: 1 # fixture: AcmeUsageSnapshot
  workspace_id: 1
  period_start: '2025-12-01 00:00:00'
  metric: emails_sent
  value: 7
  finalized_at: '2026-01-01 00:05:00'
  computed_at: '2026-01-01 00:05:00'
  created_at: '2026-01-01 00:05:00'
  updated_at: '2026-01-01 00:05:00'
- id: 2 # fixture: GlobexUsageSnapshot
  workspace_id: 2
  period_start: '2025-11-01 00:00:00'
  metric: emails_sent
  value: 3
  finalized_at: '2026-01-01 00:05:00'
  computed_at: '2026-01-01 00:05:00'
  created_at: '2026-01-01 00:05:00'
  updated_at: '2026-01-01 00:05:00'
