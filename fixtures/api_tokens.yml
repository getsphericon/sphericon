# Workspace acme (id 1). Anchor token id 1 (prefix testprefix01) authenticates the
# external-API tests — DO NOT change it. Extra tokens cover active/revoked/expired
# states for the dev token UI. ContractToken carries every scope, for `mise run check:contract`.
# prefix is globally unique.
- id: 1 # fixture: AnchorToken
  name: Test Token
  prefix: testprefix01
  secret_hash: '{{secretHash "test-anchor-token-secret-000000000000000"}}'
  scopes: '["contacts:read","contacts:write","tokens:read","tokens:write","events:read","events:write"]'
  workspace_id: 1
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 103 # fixture: ContractToken
  name: Contract fuzzing token
  prefix: contractfz01
  secret_hash: '{{secretHash "contract-token-secret-000000000000000000"}}'
  scopes: '["contacts:read","contacts:write","contacts:erase","segments:read","segments:write","events:read","events:write","broadcasts:read","broadcasts:write","automations:read","automations:write","enrollments:read","templates:read","templates:write","webhooks:read","webhooks:write","webhooks:regenerate","webhooks:test","custom_fields:read","sending_domains:read","sending_domains:write","integrations:read","integrations:write","emails:send","broadcasts:send","automations:publish","mcp:send","tokens:read","tokens:write","audit:read","captured_messages:read","captured_messages:write","export:read"]'
  workspace_id: 1
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 100
  name: Production API key
  prefix: cb_live_prod01
  secret_hash: $2a$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/LewY5FkSWUvtIKI.e
  scopes: '["contacts:read","contacts:write","events:read","events:write","emails:send"]'
  workspace_id: 1
