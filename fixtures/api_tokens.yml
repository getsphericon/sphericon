# Workspace acme (id 1). Anchor token id 1 (prefix testprefix01) authenticates the
# external-API tests — DO NOT change it. Extra tokens cover active/revoked/expired
# states for the dev token UI. ContractToken carries every scope, for `mise run check:contract`.
# prefix is globally unique.
- id: 1 # fixture: AnchorToken
  name: Test Token
  prefix: testprefix01
  secret_hash: '{{bcryptHash "test-anchor-token-secret"}}'
  scopes: '["contacts:read","contacts:write","tokens:read","tokens:write","events:read","events:write"]'
  workspace_id: 1
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
