# The token a contributor gives an MCP client (CONTRIBUTING.md, Dev accounts): it reads and
# writes Contacts, Segments, Broadcasts and Templates, and has no mcp:send, so no send tool.
# The prefix is lowercase letters and digits only: ParseToken rejects an underscore in it.
- id: 20006 # fixture: BrightpathDevMcpToken
  name: 'Dev MCP'
  prefix: 'devmcp000001'
  secret_hash: '{{secretHash "dev-mcp-token-secret-0000000000000000000"}}'
  scopes: '["contacts:read","contacts:write","segments:read","segments:write","broadcasts:read","broadcasts:write","templates:read","templates:write"]'
  workspace_id: 20
  created_at: '{{hoursAgo 24}}'
  updated_at: '{{hoursAgo 24}}'

