# Service credentials (ADR 0026): machine identities of the Staff surface. The secret
# column states the plaintext secret part and the hash is derived at load time; a
# presented value is `smsc_<prefix>_<secret>` (see staff.ServiceCredentialValue).
#
# ServiceCredentialPrimary and ServiceCredentialSecond are two active credentials of one
# service (service-a), as during a rotation. ServiceCredentialReadOnly belongs to
# service-b and carries one scope. Revoked and Expired are refused.
- id: 1 # fixture: ServiceCredentialPrimary
  name: service-a
  prefix: svcprimary01
  secret_hash: '{{secretHash "service-primary-secret-00000000000000000"}}'
  scopes: '["usage:read","workspaces:read","holds:write"]'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 2 # fixture: ServiceCredentialSecond
  name: service-a
  prefix: svcsecond002
  secret_hash: '{{secretHash "service-second-secret-000000000000000000"}}'
  scopes: '["usage:read","workspaces:read"]'
  expires_at: '{{daysAhead 30}}'
  created_at: '2026-01-02 00:00:00'
  updated_at: '2026-01-02 00:00:00'
- id: 3 # fixture: ServiceCredentialReadOnly
  name: service-b
  prefix: svcrdonly003
  secret_hash: '{{secretHash "service-readonly-secret-0000000000000000"}}'
  scopes: '["usage:read"]'
  created_at: '2026-01-03 00:00:00'
  updated_at: '2026-01-03 00:00:00'
- id: 4 # fixture: ServiceCredentialRevoked
  name: service-a
  prefix: svcrevoked04
  secret_hash: '{{secretHash "service-revoked-secret-00000000000000000"}}'
  scopes: '["usage:read"]'
  revoked_at: '2026-01-10 00:00:00'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-10 00:00:00'
- id: 5 # fixture: ServiceCredentialExpired
  name: service-a
  prefix: svcexpired05
  secret_hash: '{{secretHash "service-expired-secret-00000000000000000"}}'
