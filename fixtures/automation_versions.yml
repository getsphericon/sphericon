# The definition of each Automation (ADR 0049, ADR 0065), one version per row: its Trigger, its
# Integration (none here: the Workspace default) and its steps. Id = the Automation's id for
# version 1. The Automation points at its live version and its draft in automations.yml, by the
# rules of the migration that moved the definition here. The linear JSON step list
# ({"type":"email"|"wait", ...}); HTML bodies are kept attribute-free for clean JSON. Onboarding
# drip (106) has two versions, with Enrollments on both.

- id: 100 # fixture: AutomationWelcomeSeriesVersion
  automation_id: 100
  trigger_event: signup
  version: 1
  steps: '[{"type":"email","subject":"Welcome to CodeBasics","body":"<p>Glad you are here.</p>"},{"type":"wait","seconds":86400},{"type":"email","subject":"Pick your first course","body":"<p>Here is how to begin.</p>"}]'
  workspace_id: 1
  created_at: '{{daysAgo 90}}'
  updated_at: '{{daysAgo 90}}'

