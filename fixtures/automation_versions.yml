# The steps of each Automation (ADR 0049), one version per row. Id = the Automation's id for version 1.
# The linear JSON step list ({"type":"email"|"wait", ...}); HTML bodies are kept attribute-free for
# clean JSON. Onboarding drip (106) has two versions, with Enrollments on both.

- id: 100 # fixture: AutomationWelcomeSeriesVersion
  automation_id: 100
  version: 1
  steps: '[{"type":"email","subject":"Welcome to CodeBasics","body":"<p>Glad you are here.</p>"},{"type":"wait","seconds":86400},{"type":"email","subject":"Pick your first course","body":"<p>Here is how to begin.</p>"}]'
  workspace_id: 1
  created_at: '{{daysAgo 90}}'
  updated_at: '{{daysAgo 90}}'

