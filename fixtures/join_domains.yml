# Join domains. Acme holds acme.com verified and has eu.acme.com pending; Globex has
# a pending claim of globex.test. A pending claim never blocks anyone, so the generic
# scoped-client suites may Replant Globex's row into Acme.
- id: 1 # fixture: JoinDomainVerified
  domain: acme.com
  token: 'sphericon-join=acme-verified-token'
  verified_at: '{{daysAgo 30}}'
  last_checked_at: '{{daysAgo 1}}'
  workspace_id: 1
  created_at: '{{daysAgo 30}}'
  updated_at: '{{daysAgo 1}}'
- id: 2 # fixture: JoinDomainPending
  domain: eu.acme.com
  token: 'sphericon-join=acme-pending-token'
  workspace_id: 1
  created_at: '{{daysAgo 2}}'
  updated_at: '{{daysAgo 2}}'
# Hooli (workspace 5, suspended, domain join on) holds hooli.test verified: a suspended
# Workspace admits nobody even with the switch on and the domain verified.
- id: 3 # fixture: JoinDomainHooli
  domain: hooli.test
  token: 'sphericon-join=hooli-verified-token'
  verified_at: '{{daysAgo 30}}'
  last_checked_at: '{{daysAgo 1}}'
  workspace_id: 5
  created_at: '{{daysAgo 30}}'
  updated_at: '{{daysAgo 1}}'

# --- Globex (workspace 2) foreign row, pending — DO NOT change ---
- id: 900 # fixture: JoinDomainGlobex
  domain: globex.test
  token: 'sphericon-join=globex-pending-token'
  workspace_id: 2
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'

# --- Brightpath (workspace 20): the demo's states beyond the first pass (ids 21001+) ---
- id: 21001
  domain: brightpath.example
  token: 'sphericon-join=brightpath-verified-token'
  verified_at: '{{daysAgo 100}}'
  last_checked_at: '{{hoursAgo 1}}'
  workspace_id: 20
  created_at: '{{daysAgo 110}}'
  updated_at: '{{daysAgo 110}}'
- id: 21002
  domain: learn.brightpath.example
  token: 'sphericon-join=brightpath-pending-token'
  workspace_id: 20
  created_at: '{{daysAgo 1}}'
  updated_at: '{{daysAgo 1}}'
