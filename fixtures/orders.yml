# Orders (ADR 0064). Acme's and Globex's are old on purpose (see order_movements.yml): the tests of
# ingesting order Events send Acme's Orders through the API, as ingesting is their subject, and read
# windows of at most 90 days, so these never count there. What the reports of messages sum is read
# from the revenue tenants below (Bazaar, Emporium, Mercado), one tenant per report.
# Workspace acme (id 1): an Order of Alice in USD.
- id: 1 # fixture: OrderAcme
  order_id: fixture-order-1
  contact_id: 1
  currency: USD
  workspace_id: 1
  created_at: '{{daysAgo 200}}'
  updated_at: '{{daysAgo 200}}'

# --- Globex (workspace 2) foreign row — DO NOT change ---
- id: 900 # fixture: OrderGlobex
  order_id: fixture-order-globex
  currency: EUR
  workspace_id: 2
  created_at: '{{daysAgo 200}}'
  updated_at: '{{daysAgo 200}}'

