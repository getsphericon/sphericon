# The Rule versions of rules.yml (ADR 0065): version 1 of every Rule has the id of its Rule. A
# Rule ever published runs its version 1 (live); a Rule never published has it as its draft.
# The Trigger events are in rule_version_triggers.yml. Actions are stored JSON: ent writes the
# same text.
- id: 100 # fixture: RuleTagClickedLiveVersion
  rule_id: 100
  version: 1
  actions: '[{"type":"apply_tag","tag":"rule-clicked"}]'
  workspace_id: 1
  created_at: '{{daysAgo 40}}'
  updated_at: '{{daysAgo 40}}'
# The draft above RuleTagClicked's live version: it applies another Tag. Publishing it makes
# the next Firing apply that Tag; until then the Rule keeps applying rule-clicked.
- id: 120 # fixture: RuleTagClickedDraftVersion
  rule_id: 100
  version: 2
  actions: '[{"type":"apply_tag","tag":"rule-clicked-v2"}]'
  workspace_id: 1
  created_at: '{{daysAgo 3}}'
  updated_at: '{{daysAgo 3}}'
- id: 101
