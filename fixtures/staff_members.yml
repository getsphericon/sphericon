# Platform Staff members (ADR 0026): staff identities, separate from users. StaffEnrolled has a
# confirmed TOTP (the secret is sealed at load time and lifted into
# fixtures.StaffEnrolledTotpSecret); StaffFresh was created by the CLI and has never
# logged in, so it enrols at first login. StaffAlsoCustomer shares its address with the
# fixture User info@getsphericon.com but has its own password and TOTP: the two identities never
# meet.
- id: 1 # fixture: StaffEnrolled
  email: staff@sphericon.test
  password_hash: '{{argonHash "staff-test-password"}}'
  totp_secret_encrypted: '{{encrypt "KRSXG5CTMVRXEZLU"}}'
  totp_confirmed_at: '2026-01-01 00:00:00'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 2 # fixture: StaffFresh
  email: fresh-staff@sphericon.test
  password_hash: '{{argonHash "staff-fresh-password"}}'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 3 # fixture: StaffAlsoCustomer
  email: info@getsphericon.com
  password_hash: '{{argonHash "staff-both-password"}}'
