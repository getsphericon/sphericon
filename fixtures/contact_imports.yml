# CSV imports of Contacts (ADR 0138). Acme's ended long ago with a report row; Globex's was uploaded
# and never mapped. A test that runs an import uploads its own file through the API.
- id: 1 # fixture: ContactImportAcmeDone
  membership_id: 1
  member_name: John
  state: done
  delimiter: comma
  header: '["email","first_name"]'
  size: 64
  row_count: 2
  malformed_rows: 0
  mapping: '{"columns":[{"kind":"key","key":"email"},{"kind":"attribute","attribute":"firstName"}],"decimalSeparator":"."}'
  processed: 2
  created: 1
  refused: 1
  started_at: '{{daysAgo 3}}'
  ended_at: '{{daysAgo 3}}'
  report_expires_at: '{{daysAhead 4}}'
  workspace_id: 1
  created_at: '{{daysAgo 3}}'
  updated_at: '{{daysAgo 3}}'
- id: 2 # fixture: ContactImportGlobexUploaded
  membership_id: 2
  member_name: Jane
  state: uploaded
  delimiter: semicolon
  header: '["email"]'
  size: 32
  row_count: 1
  malformed_rows: 0
  workspace_id: 2
  created_at: '{{daysAgo 1}}'
  updated_at: '{{daysAgo 1}}'
