  email: staff@sphericon.test
  password_hash: '{{argonHash "operator-test-password"}}'
  totp_secret_encrypted: '{{encrypt "KRSXG5CTMVRXEZLU"}}'
  totp_confirmed_at: '2026-01-01 00:00:00'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 2 # fixture: OperatorFresh
  email: fresh-staff@sphericon.test
  password_hash: '{{argonHash "operator-fresh-password"}}'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 3 # fixture: OperatorAlsoCustomer
  email: info@getsphericon.com
  password_hash: '{{argonHash "operator-both-password"}}'
