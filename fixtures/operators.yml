# Platform Operators (ADR 0026): staff identities, separate from users. OperatorEnrolled has a
# confirmed TOTP (the secret is sealed at load time and lifted into
# fixtures.OperatorEnrolledTotpSecret); OperatorFresh was created by the CLI and has never
# logged in, so it enrols at first login. OperatorAlsoCustomer shares its address with the
# fixture User info@getsphericon.com but has its own password and TOTP: the two identities never
# meet.
