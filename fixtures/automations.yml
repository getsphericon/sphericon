# Workspace acme (id 1). Triggers deliberately avoid "contact.created" (used by the
# jobs/automation tests' inline automations) so EvaluateTrigger never enrolls a test
# contact into a fixture automation. The definition (Trigger, Integration, steps) lives in
# automation_versions.yml (ADR 0049, ADR 0065). live_version_id and draft_version_id follow the
# migration that moved the definitions: an active Automation, or one with Enrollments on its newest
# version, has it live; otherwise the newest is the draft and the one before it (if any) is live.
# The Welcome series (100) is active with a live version and a draft.
- id: 100 # fixture: AutomationWelcomeSeries
  name: Welcome series
  status: active
  live_version_id: 100
  draft_version_id: 1001
  workspace_id: 1
  created_at: '{{daysAgo 90}}'
  updated_at: '{{daysAgo 20}}'
