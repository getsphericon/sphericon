# Workspace acme (id 1). Triggers deliberately avoid "contact.created" (used by the
# jobs/automation tests' inline automations) so EvaluateTrigger never enrolls a test
# contact into a fixture automation. definition is the linear JSON step list
# ({"type":"email"|"wait", ...}); MJML bodies are kept attribute-free for clean JSON.
- id: 100 # fixture: AutomationWelcomeSeries
  name: Welcome series
  status: active
  trigger_event: signup
  definition: '[{"type":"email","subject":"Welcome to CodeBasics","body":"<mjml><mj-body><mj-section><mj-column><mj-text>Glad you are here.</mj-text></mj-column></mj-section></mj-body></mjml>"},{"type":"wait","seconds":86400},{"type":"email","subject":"Pick your first course","body":"<mjml><mj-body><mj-section><mj-column><mj-text>Here is how to begin.</mj-text></mj-column></mj-section></mj-body></mjml>"}]'
  workspace_id: 1
  created_at: '{{daysAgo 90}}'
  updated_at: '{{daysAgo 20}}'
- id: 101
  name: Course completion congrats
  status: active
  trigger_event: course_completed
  definition: '[{"type":"email","subject":"You finished a course!","body":"<mjml><mj-body><mj-section><mj-column><mj-text>On to the next one.</mj-text></mj-column></mj-section></mj-body></mjml>"}]'
  workspace_id: 1
  created_at: '{{daysAgo 75}}'
  updated_at: '{{daysAgo 15}}'
- id: 102 # fixture: AutomationWinBack
  name: Win-back lapsed learners
  status: draft
  trigger_event: subscription_cancelled
  definition: '[{"type":"wait","seconds":604800},{"type":"email","subject":"We miss you","body":"<mjml><mj-body><mj-section><mj-column><mj-text>Your courses are waiting.</mj-text></mj-column></mj-section></mj-body></mjml>"}]'
  workspace_id: 1
  created_at: '{{daysAgo 30}}'
  updated_at: '{{daysAgo 30}}'
# Anchor for the "held automation step" test: one email step, trigger unused elsewhere.
- id: 103 # fixture: AutomationHoldDemo
  name: Hold demo
  status: active
  trigger_event: hold_demo
  definition: '[{"type":"email","subject":"Hello from the hold demo","body":"<mjml><mj-body><mj-section><mj-column><mj-text>Hello there.</mj-text></mj-column></mj-section></mj-body></mjml>"}]'
  workspace_id: 1
  created_at: '{{daysAgo 10}}'
  updated_at: '{{daysAgo 10}}'
# Anchor for the tag-step tests: apply "engaged", then remove "vip". Trigger unused elsewhere.
- id: 104 # fixture: AutomationTagOnEngagement
  name: Tag on engagement
  status: active
  trigger_event: tag_demo
  definition: '[{"type":"apply_tag","tag":"engaged"},{"type":"remove_tag","tag":"vip"}]'
  workspace_id: 1
  created_at: '{{daysAgo 5}}'
  updated_at: '{{daysAgo 5}}'
# An HTTP step (ADR 0039): URL, header value and signing secret are sealed per field, as
# a saved step stores them. Draft, trigger unused elsewhere.
- id: 105 # fixture: AutomationNotifySlack
  name: Notify Slack on signup
  status: draft
  trigger_event: http_demo
  definition: '[{"type":"http","id":"01J00000000000000000000001","url":"{{ encrypt "https://hooks.slack.com/services/T000/B000/XXXX" }}","headers":[{"name":"Authorization","value":"{{ encrypt "Bearer slack-demo-token" }}"}],"body":"{\"text\": \"New signup: {{ "{{ first_name }} {{ last_name }}" }}\"}","secret":"{{ encrypt "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw" }}"}]'
  workspace_id: 1
  created_at: '{{daysAgo 3}}'
  updated_at: '{{daysAgo 3}}'

