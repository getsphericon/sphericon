# An HTTP step (ADR 0039): URL, header value and signing secret are sealed per field, as
# a saved step stores them. Draft, trigger unused elsewhere.
- id: 105 # fixture: AutomationNotifySlack
  name: Notify Slack on signup
  status: draft
  trigger_event: http_demo
  workspace_id: 1
  created_at: '{{daysAgo 3}}'
  updated_at: '{{daysAgo 3}}'
# Steps edited while Enrollments stood on the first version (ADR 0049): version 1 keeps its
# Enrollments, the later ones began on version 2. Draft, trigger unused elsewhere.
- id: 106 # fixture: AutomationOnboardingDrip
  name: Onboarding drip
  status: draft
  trigger_event: onboarding_drip
  workspace_id: 1
  created_at: '{{daysAgo 40}}'
  updated_at: '{{daysAgo 6}}'
# Archived (ADR 0049): a discarded draft with no Enrollments. Trigger unused elsewhere.
- id: 107 # fixture: AutomationArchived
  name: Old referral nudge
  status: draft
  trigger_event: referral_nudge
  discarded_at: '{{daysAgo 8}}'
  workspace_id: 1
  created_at: '{{daysAgo 60}}'
  updated_at: '{{daysAgo 8}}'

