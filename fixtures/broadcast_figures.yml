# The frozen figures of finished Broadcasts whose rows message retention deleted (ADR 0143). A
# figures row is what the Broadcast reports, so each one here holds what its Broadcast's rows count:
# none for Acme's (its rows are gone), one sent message for Globex's (pruned_at unset: its prune is
# still under way).
- {
    id: 1, # fixture: BroadcastFigureAcme
    broadcast_id: 108,
    workspace_id: 1,
    recipients: 0,
    unsubscribed: 0,
    sent: 0,
    skipped: 0,
    failed: 0,
    pending: 0,
    delivered: 0,
    undelivered: 0,
    bounced: 0,
    complained: 0,
    opened: 0,
    clicked: 0,
    captured: 0,
    pruned_at: '{{daysAgo 10}}',
    created_at: '{{daysAgo 10}}',
    updated_at: '{{daysAgo 10}}',
  }
- {
    id: 900, # fixture: BroadcastFigureGlobex
    broadcast_id: 7344,
    workspace_id: 2,
    recipients: 0,
    unsubscribed: 0,
    sent: 1,
    skipped: 0,
    failed: 0,
    pending: 0,
    delivered: 0,
    undelivered: 0,
    bounced: 0,
    complained: 0,
    opened: 0,
    clicked: 0,
    captured: 0,
    created_at: '{{daysAgo 1}}',
    updated_at: '{{daysAgo 1}}',
  }
