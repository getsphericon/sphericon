# Workspace acme (id 1). Anchor segments 1-2 are selected by name in the suite —
# DO NOT change them. New rule segments use the JSON combinator definition format.
- id: 1 # fixture: SegmentActive
  name: Active subscribers
  condition: "status == 'active'"
  workspace_id: 1
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 2 # fixture: SegmentNewsletter
  name: Newsletter subscribers
  workspace_id: 1
  created_at: '2026-01-02 00:00:00'
  updated_at: '2026-01-02 00:00:00'

# --- CodeBasics segments ---
- id: 100 # fixture: SegmentProPlan
  name: Pro & team members
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"custom:plan","operator":"eq","value":"pro"}]}'
  workspace_id: 1
  created_at: '{{daysAgo 60}}'
  updated_at: '{{daysAgo 10}}'
- id: 101
  name: Completed a course
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"custom:courses_completed","operator":"neq","value":"0"}]}'
  workspace_id: 1
  created_at: '{{daysAgo 45}}'
  updated_at: '{{daysAgo 12}}'
- id: 102 # fixture: SegmentBlackFriday
  name: Black Friday 2026 audience
  workspace_id: 1
  created_at: '{{daysAgo 30}}'
  updated_at: '{{daysAgo 30}}'
# Rule that no contact matches — anchors the empty-audience broadcast (id 104).
- id: 103
  name: Unreachable plan
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"custom:plan","operator":"eq","value":"__none__"}]}'
  workspace_id: 1
  created_at: '{{daysAgo 30}}'
  updated_at: '{{daysAgo 30}}'
# Used only by a failed broadcast (id 103): history, so it does not block a delete (ADR 0049).
- id: 104 # fixture: SegmentRetired
  name: Retired audience
  workspace_id: 1
  created_at: '{{daysAgo 40}}'
  updated_at: '{{daysAgo 40}}'
# Names the Tag "newsletter" in a rule, so that Tag cannot be deleted while it exists (ADR 0049).
- id: 105 # fixture: SegmentNewsletterReaders
  name: Newsletter readers
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"group","combinator":"or","rules":[{"kind":"rule","field":"tag","operator":"has","value":"newsletter"}]}]}'
  workspace_id: 1
  created_at: '{{daysAgo 20}}'
  updated_at: '{{daysAgo 20}}'
# Archived (ADR 0049): discarded, but the sent broadcast 107 still points at it.
- id: 106 # fixture: SegmentArchived
  name: Archived audience
  workspace_id: 1
  discarded_at: '{{daysAgo 5}}'
  created_at: '{{daysAgo 50}}'
  updated_at: '{{daysAgo 5}}'
# The Segment of origin of the scheduled Broadcast 109, edited since: the Broadcast keeps the
# Condition it copied when it was scheduled (ADR 0065), so this Segment is free to edit and archive.
- id: 107 # fixture: SegmentRenewalAudience
  name: Renewal audience
  workspace_id: 1
  created_at: '{{daysAgo 3}}'
  updated_at: '{{daysAgo 3}}'

# --- Globex (workspace 2) foreign row — DO NOT change ---
- id: 900 # fixture: SegmentGlobex
  name: Globex only
  workspace_id: 2
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'

# --- Brightpath (workspace 20): demo workspace behind the screenshots on getsphericon.com ---
- id: 20001
  name: 'Almost customers'
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"custom:plan","operator":"eq","value":"free"},{"kind":"event","action":"viewed_pricing","operator":"atLeast","times":1,"withinDays":14},{"kind":"event","action":"email.opened","operator":"atMost","times":0,"withinDays":30}]}'
  workspace_id: 20
  created_at: '{{hoursAgo 1080}}'
  updated_at: '{{hoursAgo 360}}'
- id: 20002
  name: 'Pro & team members'
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"group","combinator":"or","rules":[{"kind":"rule","field":"custom:plan","operator":"eq","value":"pro"},{"kind":"rule","field":"custom:plan","operator":"eq","value":"team"}]}]}'
  workspace_id: 20
  created_at: '{{hoursAgo 1680}}'
  updated_at: '{{hoursAgo 552}}'
- id: 20003
  name: 'Completed a course'
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"custom:courses_completed","operator":"neq","value":"0"}]}'
  workspace_id: 20
  created_at: '{{hoursAgo 1440}}'
  updated_at: '{{hoursAgo 480}}'
- id: 20004
  name: 'Black Friday audience'
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"tag","operator":"has","value":"newsletter"},{"kind":"rule","field":"custom:plan","operator":"neq","value":"team"}]}'
  workspace_id: 20
  created_at: '{{hoursAgo 144}}'
  updated_at: '{{hoursAgo 48}}'
- id: 20005
  name: 'Webinar attendees, not yet paying'
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"tag","operator":"has","value":"webinar-attendee"},{"kind":"rule","field":"custom:plan","operator":"eq","value":"free"}]}'
  workspace_id: 20
  created_at: '{{hoursAgo 600}}'
  updated_at: '{{hoursAgo 192}}'
- id: 20006
  name: 'At risk of churning'
  condition: '{"kind":"group","combinator":"or","rules":[{"kind":"rule","field":"tag","operator":"has","value":"churn-risk"},{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"custom:plan","operator":"neq","value":"free"},{"kind":"event","action":"lesson_completed","operator":"atMost","times":0,"withinDays":30}]}]}'
  workspace_id: 20
  created_at: '{{hoursAgo 288}}'
  updated_at: '{{hoursAgo 96}}'

