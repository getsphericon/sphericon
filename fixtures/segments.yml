# Rule that no contact matches — anchors the empty-audience broadcast (id 104).
- id: 103
  revision: 1
  name: Unreachable plan
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"custom:plan","operator":"eq","value":"__none__"}]}'
  workspace_id: 1
  created_at: '{{daysAgo 30}}'
  updated_at: '{{daysAgo 30}}'
# Used only by a failed broadcast (id 103): history, so it does not block an archive (ADR 0100).
- id: 104 # fixture: SegmentRetired
  revision: 1
  name: Retired audience
  workspace_id: 1
  created_at: '{{daysAgo 40}}'
  updated_at: '{{daysAgo 40}}'
# Names the Tag "newsletter" in a rule, so that Tag cannot be deleted while it exists (ADR 0049).
- id: 105 # fixture: SegmentNewsletterReaders
  revision: 1
  name: Newsletter readers
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"group","combinator":"or","rules":[{"kind":"rule","field":"tag","operator":"has","value":"newsletter"}]}]}'
  workspace_id: 1
  created_at: '{{daysAgo 20}}'
  updated_at: '{{daysAgo 20}}'
# The Contacts with no Telegram chat bound, in person or through a Visitor (ADR 0074).
- id: 7400 # fixture: SegmentWithoutTelegram
  revision: 1
  name: Not on Telegram
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"telegram","operator":"doesNotHave"}]}'
  workspace_id: 1
  created_at: '{{daysAgo 5}}'
  updated_at: '{{daysAgo 5}}'
# Archived (ADR 0100), and the sent broadcast 107 still points at it.
- id: 106 # fixture: SegmentArchived
  revision: 1
  name: Archived audience
  workspace_id: 1
  archived_at: '{{daysAgo 5}}'
  created_at: '{{daysAgo 50}}'
  updated_at: '{{daysAgo 5}}'
