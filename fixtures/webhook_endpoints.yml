# Workspace acme (id 1). Secrets are valid Standard Webhooks secrets (whsec_ + base64). secret_encrypted is sealed at load time via the encrypt
# template func (per-env valid). event_types is a JSON array; empty/absent = all events.
- id: 100 # fixture: WebhookCodebasics
  url: https://codebasics.dev/webhooks/sphericon
  secret_encrypted: '{{ encrypt "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw" }}'
  event_types: '["contact.created","email.opened","email.clicked"]'
  enabled: true
  workspace_id: 1
  created_at: '{{daysAgo 70}}'
  updated_at: '{{daysAgo 70}}'
- id: 101 # fixture: WebhookCodebasicsDisabled
  url: https://hooks.codebasics.dev/disabled
  secret_encrypted: '{{ encrypt "whsec_Y29kZWJhc2ljc19kaXNhYmxlZF9zZWNyZXQ=" }}'
  enabled: false
  workspace_id: 1
  created_at: '{{daysAgo 50}}'
  updated_at: '{{daysAgo 50}}'
# A failing endpoint: seven failed deliveries in a row since yesterday, the last one a 503.
- id: 102 # fixture: WebhookCodebasicsFailing
  url: https://failing.codebasics.dev/hook
  secret_encrypted: '{{ encrypt "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw" }}'
  event_types: '["segment.deleted"]'
  enabled: true
  consecutive_failures: 7
  failing_since: '{{hoursAgo 26}}'
  last_error_kind: http_status
  last_error_status: 503
  last_failure_at: '{{hoursAgo 2}}'
  workspace_id: 1
  created_at: '{{daysAgo 40}}'
  updated_at: '{{hoursAgo 2}}'
# An endpoint that turned itself off after its receiver answered 410.
- id: 103 # fixture: WebhookCodebasicsGone
  url: https://gone.codebasics.dev/hook
  secret_encrypted: '{{ encrypt "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw" }}'
  enabled: false
  consecutive_failures: 1
  failing_since: '{{hoursAgo 5}}'
  last_error_kind: http_status
  last_error_status: 410
  last_failure_at: '{{hoursAgo 5}}'
  disabled_reason: gone
  workspace_id: 1
  created_at: '{{daysAgo 40}}'
  updated_at: '{{hoursAgo 5}}'

