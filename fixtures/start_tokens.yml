  integration_id: 9
  contact_id: 100
  token_hash: '{{ secretHash "fixture-start-token-acme" }}'
  expires_at: '{{daysAgo 1}}'
  used_at: '{{daysAgo 5}}'
  workspace_id: 1
  created_at: '{{daysAgo 6}}'
  updated_at: '{{daysAgo 5}}'
