# GoReleaser builds the cross-platform binaries and the multi-arch Docker image.
# It is driven from the release-please workflow (only when a release is cut), so
# it appends artifacts to the GitHub Release that release-please already created
# and leaves the changelog to release-please.
version: 2

project_name: sphericon

# Vite already owns ./dist, so keep GoReleaser's output elsewhere.
dist: dist-release

before:
  hooks:
    # Build the embedded assets (SPA + tracker) before cross-compiling.
    - mise run build:tracker
    - mise run build:spa
    - mise run build:changelog

builds:
  - id: sphericon
    main: ./cmd/server
    binary: sphericon
    flags:
      - -tags=embed_spa,embed_changelog
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/getsphericon/sphericon/internal/buildinfo.Version={{ .Version }} -X github.com/getsphericon/sphericon/internal/buildinfo.Commit={{ .ShortCommit }} -X github.com/getsphericon/sphericon/internal/buildinfo.Date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

# dockers_v2 builds the multi-arch image and pushes the manifest in one step,
# reusing the prebuilt binaries (Dockerfile.release just copies them in).
dockers_v2:
  - images:
      - ghcr.io/getsphericon/sphericon
    tags:
      - '{{ .Version }}'
      - latest
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    ids:
      - sphericon
    # Attach an SBOM attestation to the image (buildx generates it with the push).
    sbom: true

# Keyless cosign (GitHub OIDC, the workflow's id-token permission): the bundle holds the
# signature and the Fulcio certificate, so `cosign verify-blob --bundle` needs nothing else.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

# Signs the image on ghcr.io by digest. `all` because dockers_v2 registers one multi-arch
# artifact of its own type, which `manifests` or `images` alone may not select.
docker_signs:
  - id: images
    cmd: cosign
    artifacts: all
    args:
      - sign
      - --yes
      - ${artifact}@${digest}

# One SPDX SBOM per archive, uploaded to the release next to it (needs syft on the PATH).
sboms:
  - id: archives
    artifacts: archive

# release-please owns the GitHub Release + changelog; just attach artifacts.
release:
  mode: append

changelog:
  disable: true
