<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brightpath (PROTOTYPE: on-site forms)</title>
    <script>
      // ?csp=strict: a site whose CSP allows no inline style. Mantine's own <style> tags break
      // (expected); the question is whether the form's adoptedStyleSheets still apply.
      if (new URLSearchParams(location.search).get('csp') === 'strict') {
        var m = document.createElement('meta')
        m.httpEquiv = 'Content-Security-Policy'
        m.content = "style-src 'self'"
        document.head.appendChild(m)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/entry.ts"></script>
  </body>
</html>
