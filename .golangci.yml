version: '2'
run:
  # Lint the end-to-end suite too (e2e/ is behind this build tag, ADR 0024).
  build-tags:
    - e2e
formatters:
  enable:
    - gofmt

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - modernize
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - thelper
    - usetesting
    - whitespace
    - dogsled
    - forcetypeassert
    - gocritic
    - nolintlint
    - copyloopvar
    - asasalint
    - bidichk
    - iface
    - sloglint
    - makezero
    - tparallel
    - decorder
    - revive
    - unparam
    - errchkjson
    - prealloc
    - funcorder
    - godot
    - gochecknoinits
    - asciicheck
    - canonicalheader
    - containedctx
    - durationcheck
    - exptostd
    - gocheckcompilerdirectives
    - gochecksumtype
    - goprintffuncname
    - intrange
    - loggercheck
    - mirror
    - musttag
    - nilnesserr
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - unconvert
    - usestdlibvars
    - wastedassign
    - dupword
    - misspell
    - godoclint
    - iotamixing
    - inamedparam
    - gosmopolitan
    - importas
    - testableexamples
    - unqueryvet
    - promlinter
    - protogetter
    - spancheck
    - zerologlint
    - grouper
    - nakedret
    - embeddedstructfieldcheck
    - gosec
    # Our own go/analysis checks (tools/analyzers), built into .bin/custom-gcl by `mise run build:lint`.
    - sphericon
  settings:
    custom:
      sphericon:
        type: module
        description: the project's review rules that need Go types (docs/agents/review-rules.md)
    exhaustive:
      # A switch with a default says what happens to every other member; it is checked only for
      # the enums this repository defines, not for html.TokenType, reflect.Kind or yaml.Kind.
      default-signifies-exhaustive: true
      ignore-types: ^(reflect\.Kind|golang\.org/x/net/html\.TokenType|gopkg\.in/yaml\.v3\.Kind)$
    forbidigo:
      analyze-types: true
      forbid:
        # ADR 0017: an entity loaded through the scoped client still carries the raw
        # client, so `entity.Update()` bypasses the scope. Update by id through the
        # scoped client instead (`s.Tag().UpdateOneID(id)`). With analyze-types the
        # matched text is `<package>.<Type>.<Method>`; the entity method is
        # `ent.<Entity>.Update`. The legitimate `ent.<Entity>Client.Update`,
        # `ent.<Entity>Scoped.Update` and the upsert builders (`...UpsertOne`,
        # `...UpsertBulk`, i.e. `.OnConflict...().Update(fn)`) must not match.
        # RE2 has no negative lookahead, so the alternation below is "an `ent` type
        # name that does not end in Client, Scoped, UpsertOne or UpsertBulk" (the
        # suffixes spelled out char by char), plus the entity OAuthClient, whose own
        # name ends in Client. ent/schema/forbidigo_pattern_test.go checks this
        # pattern against every generated entity and builder type.
        - pattern: '^ent\.(OAuthClient|\w*[^dekt]|\w*[^e]d|\w*[^p]ed|\w*[^o]ped|\w*[^c]oped|\w*[^S]coped|\w*[^n]e|\w*[^O]ne|\w*[^t]One|\w*[^r]tOne|\w*[^e]rtOne|\w*[^s]ertOne|\w*[^p]sertOne|\w*[^U]psertOne|\w*[^l]k|\w*[^u]lk|\w*[^B]ulk|\w*[^t]Bulk|\w*[^r]tBulk|\w*[^e]rtBulk|\w*[^s]ertBulk|\w*[^p]sertBulk|\w*[^U]psertBulk|\w*[^n]t|\w*[^e]nt|\w*[^i]ent|\w*[^l]ient|\w*[^C]l[i]ent)\.Update$'
          pkg: '^github\.com/getsphericon/sphericon/ent$'
          msg: entity-level Update() bypasses the workspace scope; use the scoped client's UpdateOneID (ADR 0017)
        - pattern: ^time\.Sleep$
          msg: no sleeps; wait on the condition, take a clock, or call testhelper.Elapse inside a synctest bubble (CODING_STANDARDS.md)
        - pattern: sql\.DB\)?\.(Exec|Query|QueryRow)(Context)?$
          msg: no direct SQL in tests; use ent (env.DB) or a testhelper abstraction (e.g. env.Outbox*)
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/samber/mo
              desc: monads fight Go idioms; use stdlib or samber/lo
            - pkg: html/template
              desc: no HTML in Go; pages are rendered by the SPA
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        # Named results fight the nonamedreturns habit of this codebase (results are named only
        # where a defer needs them).
        - unnamedResult
        # The largest by-value parameters are fixed by interfaces we do not write: ogen's handler
        # methods and goverter's Converter take their DTOs and params by value. A copy of a
        # few hundred bytes next to a database round trip is not a cost worth a pointer elsewhere.
        - hugeParam
        # %q escapes what an email body and an HTML attribute must not escape.
        - sprintfQuotedString
    staticcheck:
      # Every check but two: ST1000 (a package comment in every package, 196 of them) and ST1003
      # (names: the ogen and ent generators spell ApiKeyAuth, ApiToken and HttpStep, and the
      # contract names follow them).
      checks:
        - all
        - -ST1000
        - -ST1003
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout is for readers, not for padding
        - shadow # `err` is shadowed on purpose in if-initialisers all over
    nolintlint:
      require-specific: true
      require-explanation: true
    revive:
      # The default rule set minus `exported` (a comment on every exported name, 635 of them, much
      # of it names that are generated or self-explanatory) and `package-comments`.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    funcorder:
      # Constructors come right after their type; the exported-before-unexported method order is
      # left to the author.
      struct-method: false
    gosmopolitan:
      # The Second factor deadlines are calendar days of the Instance's own zone.
      allow-time-local: true
    dogsled:
      max-blank-identifiers: 2
    gosec:
      # Rules left out are the ones that cannot tell this codebase's deliberate code from a
      # defect (and the only escape would be a //nolint, which we do not use); the rest of
      # gosec stays on.
      excludes:
        - G101 # matches names ("token", "password") of constants and fields, not secrets
        - G115 # counts and page numbers narrow to the contract's int32 fields (bounded values)
        - G117 # marshalling a secret field is how an Integration's config is sealed at rest
        - G122 # tests walk this repository's own tree, whose paths nobody else controls
        - G124 # the Secure attribute follows the instance's URL scheme (plain http in dev)
        - G204 # the exec'd commands are operator tooling (upgrade, e2e), never request input
        - G302 # the upgrade command installs an executable binary
        - G304 # paths come from the operator's flags, config and repo tooling
        - G306 # written files are repository artifacts (migrations) and test executables
        - G404 # math/rand only jitters retry delays
        - G505 # SNS signs messages with SHA-1 (SignatureVersion 1); the protocol fixes it
        - G701 # CREATE/DROP DATABASE take an identifier that cannot be a bound parameter
        - G703 # path taint analysis flags test fixtures' own temp paths
        - G702 # same commands as G204, found by taint analysis
        - G704 # taint analysis cannot see the validation done before the outbound request
        - G705 # the tracking host probe answers text/plain
        - G706 # the logged value is the database name given to the dev tooling
        - G710 # redirect targets are validated or signed (tracking links, OAuth redirect URIs)
  exclusions:
    rules:
      # The SQL rule is for tests; production data access and testhelper itself talk SQL.
      - path-except: _test\.go$
        linters:
          - forbidigo
        text: no direct SQL in tests
      # `// goverter:map Field Field | helper` repeats the field name by design: source, then target.
      - source: goverter:map
        linters:
          - dupword
      # A test helper's parameter that every caller gives the same value is the scenario's knob, and
      # a test double's result that is always nil is the signature its interface fixes.
      - path: _test\.go$
        linters:
          - unparam
        text: always receives|is always nil
      # golangci-lint's module plugin API registers the analyzers from init().
      - path: tools/analyzers/plugin\.go$
        linters:
          - gochecknoinits
      # A failed assertion in a test panics, and the panic fails the test with its stack.
      - path: _test\.go$
        linters:
          - forcetypeassert

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
