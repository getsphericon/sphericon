version: '2'
run:
  # Lint the end-to-end suite too (e2e/ is behind this build tag, ADR 0024).
  build-tags:
    - e2e
formatters:
  enable:
    - gofmt

linters:
  default: standard
  # Linters that exist and are left off because they are harmful here, each with what the findings
  # showed (counts are of the findings at the time; these are the linters the second pass evaluated):
  #   nilnil            23: absence is the documented answer (no such row, nothing joined, no signer
  #                     for a domain, no Staff handler without a license), a NULL or optional *string,
  #                     or an empty map; a sentinel error would make every caller branch on a non-error.
  #   gochecknoglobals  114 outside tests: read-only lookup tables (no const map or slice exists in
  #                     Go; a function returning the literal allocates per call), process singletons
  #                     (a sync.Once or a mutex around a renderer, the i18n bundle, a certificate
  #                     cache, the metrics handler Setup installs and tests swap) and
  #                     buildinfo.Version/Commit/Date, which -ldflags -X can only set as package
  #                     variables.
  #   err113            259 outside tests: configuration, CLI and Preset validation messages that
  #                     nothing matches with errors.Is; a sentinel per message is ceremony.
  #   dupl              26: 22 are API handler bodies (list, export, activate, archive) repeated per
  #                     resource over distinct generated response types, so no helper has a type to
  #                     share; the other 4 are pairs of test bodies.
  #   paralleltest      2910: a test rides a transaction on its package's one database, holds row locks
  #                     on the fixture rows it changes until rollback, and 11 test files use t.Setenv
  #                     and 7 swap OpenTelemetry globals, so t.Parallel would serialize or deadlock;
  #                     packages already run in parallel and the end-to-end tests, which have a
  #                     Workspace each, call t.Parallel.
  #   exhaustruct       3704: ogen DTOs and their Opt types, ent annotations and mixins, urfave/cli and
  #                     net/http structs, and our option structs whose zero values are the default.
  #   nonamedreturns    104: named results document a pair of same-typed or positional results
  #                     ((status int, body string), (address, name string), (wait, ok)), and the
  #                     rule would turn each into an unlabeled tuple.
  #   wrapcheck         1607 findings; 1328 are errors of our own packages, ent and the container, which
  #                     already name their operation, or control-flow errors (river's snooze and
  #                     cancel, ctx.Err), and ignoring them leaves 279 stdlib and
  #                     third-party errors: *PathError, *url.Error and the json errors carry the
  #                     operation and the operand, so a "read file:" prefix only stutters, and the
  #                     rest are pass-through lifecycle methods (Close, Shutdown, Start, Stop, a
  #                     RoundTripper) and ent hooks, where wrapping is wrong.
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - modernize
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - thelper
    - usetesting
    - whitespace
    - dogsled
    - forcetypeassert
    - gocritic
    - nolintlint
    - copyloopvar
    - asasalint
    - bidichk
    - iface
    - sloglint
    - makezero
    - tparallel
    - decorder
    - revive
    - unparam
    - errchkjson
    - prealloc
    - funcorder
    - godot
    - gochecknoinits
    - asciicheck
    - canonicalheader
    - containedctx
    - durationcheck
    - exptostd
    - gocheckcompilerdirectives
    - gochecksumtype
    - goprintffuncname
    - intrange
    - loggercheck
    - mirror
    - musttag
    - nilnesserr
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - unconvert
    - usestdlibvars
    - wastedassign
    - dupword
    - misspell
    - godoclint
    - iotamixing
    - inamedparam
    - gosmopolitan
    - importas
    - testableexamples
    - unqueryvet
    - promlinter
    - protogetter
    - spancheck
    - zerologlint
    - grouper
    - nakedret
    - embeddedstructfieldcheck
    - goconst
    - cyclop
    - gocognit
    - gomoddirectives
    - funlen
    - maintidx
    - nestif
    - nilerr
    - gosec
    # Our own go/analysis checks (tools/analyzers), built into .bin/custom-gcl by `mise run build:lint`.
    - sphericon
  settings:
    custom:
      sphericon:
        type: module
        description: the project's review rules that need Go types (docs/standards/review-rules.md)
    exhaustive:
      # A switch with a default says what happens to every other member; it is checked only for
      # the enums this repository defines, not for html.TokenType, reflect.Kind or yaml.Kind.
      default-signifies-exhaustive: true
      ignore-types: ^(reflect\.Kind|golang\.org/x/net/html\.TokenType|gopkg\.in/yaml\.v3\.Kind)$
    forbidigo:
      analyze-types: true
      forbid:
        # ADR 0017: an entity loaded through the scoped client still carries the raw
        # client, so `entity.Update()` bypasses the scope. Update by id through the
        # scoped client instead (`s.Tag().UpdateOneID(id)`). With analyze-types the
        # matched text is `<package>.<Type>.<Method>`; the entity method is
        # `ent.<Entity>.Update`. The legitimate `ent.<Entity>Client.Update`,
        # `ent.<Entity>Scoped.Update` and the upsert builders (`...UpsertOne`,
        # `...UpsertBulk`, i.e. `.OnConflict...().Update(fn)`) must not match.
        # RE2 has no negative lookahead, so the alternation below is "an `ent` type
        # name that does not end in Client, Scoped, UpsertOne or UpsertBulk" (the
        # suffixes spelled out char by char), plus the entity OAuthClient, whose own
        # name ends in Client. ent/schema/forbidigo_pattern_test.go checks this
        # pattern against every generated entity and builder type.
        - pattern: '^ent\.(OAuthClient|\w*[^dekt]|\w*[^e]d|\w*[^p]ed|\w*[^o]ped|\w*[^c]oped|\w*[^S]coped|\w*[^n]e|\w*[^O]ne|\w*[^t]One|\w*[^r]tOne|\w*[^e]rtOne|\w*[^s]ertOne|\w*[^p]sertOne|\w*[^U]psertOne|\w*[^l]k|\w*[^u]lk|\w*[^B]ulk|\w*[^t]Bulk|\w*[^r]tBulk|\w*[^e]rtBulk|\w*[^s]ertBulk|\w*[^p]sertBulk|\w*[^U]psertBulk|\w*[^n]t|\w*[^e]nt|\w*[^i]ent|\w*[^l]ient|\w*[^C]l[i]ent)\.Update$'
          pkg: '^github\.com/getsphericon/sphericon/ent$'
          msg: entity-level Update() bypasses the workspace scope; use the scoped client's UpdateOneID (ADR 0017)
        - pattern: ^time\.Sleep$
          msg: no sleeps; wait on the condition, take a clock, or call testhelper.Elapse inside a synctest bubble (CODING_STANDARDS.md)
        - pattern: sql\.DB\)?\.(Exec|Query|QueryRow)(Context)?$
          msg: no direct SQL in tests; use ent (env.DB) or a testhelper abstraction (e.g. env.Outbox*)
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/samber/mo
              desc: monads fight Go idioms; use stdlib or samber/lo
            - pkg: html/template
              desc: no HTML in Go; pages are rendered by the SPA
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
        - experimental
      disabled-checks:
        # %q escapes what an email body and an HTML attribute must not escape: both findings
        # (internal/jobs/memberinvite.go, internal/tracking/tracking.go) are a plain-text mail body
        # and an <img src="..."> attribute.
        - sprintfQuotedString
      settings:
        hugeParam:
          # A copy of up to half a kilobyte next to a database round trip or an HTTP call costs
          # nothing worth a pointer; the 80-byte default flags ogen's and goverter's by-value
          # interfaces, which we do not write, and every small dependency struct.
          sizeThreshold: 512
    staticcheck:
      checks:
        - all
      # The default initialisms without API and HTTP: ogen and ent spell ApiKeyAuth, ApiToken and
      # HttpStep, and the interfaces we implement and the contract names follow them. Every other
      # initialism (ID, URL, JSON ...) is still checked.
      initialisms:
        - ACL
        - ASCII
        - CPU
        - CSS
        - DNS
        - EOF
        - GUID
        - HTML
        - HTTPS
        - ID
        - IP
        - JSON
        - QPS
        - RAM
        - RPC
        - SLA
        - SMTP
        - SQL
        - SSH
        - TCP
        - TLS
        - TTL
        - UDP
        - UI
        - GID
        - UID
        - UUID
        - URI
        - URL
        - UTF8
        - VM
        - XML
        - XMPP
        - XSRF
        - XSS
        - SIP
        - RTP
        - AMQP
        - DB
        - TS
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout is for readers, not for padding
        - shadow # `err` is shadowed on purpose in if-initialisers all over
    nolintlint:
      require-specific: true
      require-explanation: true
    revive:
      # The default rule set minus `exported`: 516 of its findings are exported names with no
      # comment, and 450 of those are methods that an interface fixes (ent's Fields/Edges/Mixin on
      # 234 schema types, river's Work/Kind, the ogen handlers whose docs are the TypeSpec's, review
      # rule 6), so the rule would ask for a second copy of what the interface or the contract says.
      rules:
        - name: package-comments
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    funcorder:
      # Constructors come right after their type; the exported-before-unexported method order is
      # left to the author.
      struct-method: false
    gosmopolitan:
      # The Second factor deadlines are calendar days of the Instance's own zone.
      allow-time-local: true
    goconst:
      # A string that four other places repeat is a name for something (a field, a key, a kind).
      min-len: 3
      min-occurrences: 5
      ignore-calls: true
    errcheck:
      # `_ = f()` is the way to say "ignored on purpose", so it is checked too. The functions below
      # are the ones whose error nobody can act on; every other ignored error is handled.
      check-blank: true
      exclude-functions:
        # Terminal output of the command line tools: a write to a closed terminal has no recovery.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
        # The status line is sent; when the client is gone the body write fails and there is nobody to tell.
        - (net/http.ResponseWriter).Write
        # Closing what was only read (a response body, a row set, a zip entry) cannot lose data.
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        # The deferred rollback of a transaction that was committed returns sql.ErrTxDone by design.
        - (*database/sql.Tx).Rollback
        - (*github.com/getsphericon/sphericon/ent.Tx).Rollback
    # Complexity limits are set where the distribution of findings breaks: the functions above them
    # (a wiring list, an invariant table, a document walker) are the ones that were split or
    # tabulated, not a count of how many `if` a function may hold.
    cyclop:
      max-complexity: 30
      skip-tests: true
    gocognit:
      min-complexity: 40
    funlen:
      lines: 150
      statements: 100
    nestif:
      min-complexity: 8
    maintidx:
      under: 20
    dogsled:
      max-blank-identifiers: 2
    gosec:
      # Rules left out are the ones that cannot tell this codebase's deliberate code from a
      # defect (and the only escape would be a //nolint, which we do not use); the rest of
      # gosec stays on.
      excludes:
        - G101 # matches names ("token", "password") of constants and fields, not secrets
        - G117 # marshalling a secret field is how an Integration's config is sealed at rest
        - G122 # tests walk this repository's own tree, whose paths nobody else controls
        - G204 # the exec'd commands are operator tooling (upgrade, e2e), never request input
        - G302 # the upgrade command installs an executable binary
        - G304 # paths come from the operator's flags, config and repo tooling
        - G306 # written files are repository artifacts (migrations) and test executables
        - G505 # SNS signs messages with SHA-1 (SignatureVersion 1); the protocol fixes it
  exclusions:
    rules:
      # The SQL rule is for tests; production data access and testhelper itself talk SQL.
      - path-except: _test\.go$
        linters:
          - forbidigo
        text: no direct SQL in tests
      # gosec's taint rules (G702-G705, G710) and the cookie rule (G124) cannot see a check that
      # is made before the sink. Each exclusion below names the files and the reason; every
      # finding was read, and the ones that were defects are fixed in code.
      #
      # G124: the Secure attribute follows the instance's URL scheme (config.SecureCookies): a
      # plain-http instance would never get a Secure cookie back. The rule wants a constant true.
      - path: ^(ee/staff/session\.go|internal/api/auth/(session|passkey_ceremony|registration_browser|signin_flow)\.go)$
        linters:
          - gosec
        text: G124
      # G702: upgradecheck runs `git` (a constant) with arguments from its own command line; it is
      # a CI tool and takes no request input.
      - path: ^cmd/upgradecheck/main\.go$
        linters:
          - gosec
        text: G702
      # G703: tools and the OTEL_CONFIG_FILE setting read the file the operator names, and tests
      # read and rewrite this repository's own files and temp directories.
      - path: ^(cmd/upgradecheck/(main|immutable)\.go|internal/telemetry/telemetry\.go|.*_test\.go)$
        linters:
          - gosec
        text: G703
      # G704: the health check calls 127.0.0.1 and only the port comes from PORT; the OAuth client
      # metadata fetch runs through an SSRF-hardened client (webhook.NewClientAllowing: private
      # and loopback addresses refused at dial time, no redirects) after validMetadataURL.
      - path: ^(cmd/server/healthcheck|internal/oauthserver/metadata)\.go$
        linters:
          - gosec
        text: G704
      # G705: the probe body is a hex HMAC (trackingdomain.ProbeValue) served as text/plain.
      - path: ^internal/server/trackinghost\.go$
        linters:
          - gosec
        text: G705
      # G710: a click redirects to the destination of a signed token (tracker.DecodeClick) and
      # the OAuth authorize endpoint redirects to a redirect_uri registered by the client (checked
      # by Service.client) or to the Instance's own consent page.
      - path: ^(internal/server/tracking|internal/oauthserver/http)\.go$
        linters:
          - gosec
        text: G710
      # G404: the jitter spreads retries; an attacker who predicts it gains nothing.
      - path: ^internal/outbound/retry\.go$
        linters:
          - gosec
        text: G404
      # nilerr: each file named here has a function that turns an error into the answer its result
      # type carries, and nil is what that answer is: the typed 4xx response of an ogen handler for
      # what the client sent (a cursor, the variables of a message, a link token, the state of a
      # sign-in flow), an MCP tool result for arguments that are not JSON,
      # a rules.Result, an ignored delivery outcome, a Condition that no longer compiles. Each was read:
      # the handlers whose error was not the client's (the Automation switch, the link tokens whose
      # lookup failed) return it now. A new handler file is checked.
      - path: ^(internal/api/external/(audit|emails)\.go|internal/api/site/(audit|auth_recovery|auth_signin|auth_signin_notme|consent)\.go|internal/mcpserver/mcpserver\.go|internal/jobs/rules_http\.go|internal/rules/rules\.go|internal/webhooks/delivery\.go)$
        linters:
          - nilerr
      # Test data is spelled out in each test: a name or an address that five tests share is the
      # scenario's own data (the fixtures hold the rest), and a constant for it only sends the reader
      # to another file.
      - path: _test\.go$
        linters:
          - goconst
      # `// goverter:map Field Field | helper` repeats the field name by design: source, then target.
      - source: goverter:map
        linters:
          - dupword
      # A test helper's parameter that every caller gives the same value is the scenario's knob, and
      # a test double's result that is always nil is the signature its interface fixes.
      - path: _test\.go$
        linters:
          - unparam
        text: always receives|is always nil
      # golangci-lint's module plugin API registers the analyzers from init().
      - path: tools/analyzers/plugin\.go$
        linters:
          - gochecknoinits
      # A failed assertion in a test panics, and the panic fails the test with its stack.
      - path: _test\.go$
        linters:
          - forcetypeassert

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
