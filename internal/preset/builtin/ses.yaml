# yaml-language-server: $schema=../preset.schema.json
version: 1
name: ses
description: Amazon SES bounces and complaints, delivered through an SNS topic.
params:
  type: object
  additionalProperties: false
  properties:
    topic_arn:
      type: string
      title: SNS topic ARN
      description: The one SNS topic your SES bounces and complaints are published to. A signed notification from any other topic is refused; without a topic the hook refuses every notification.
      pattern: ^arn:aws[a-z-]*:sns:[a-z0-9-]+:[0-9]+:[A-Za-z0-9_-]+$
verify:
  kind: sns
  topic: topic_arn
# The SNS message carries the SES event as a JSON string. SES uses notificationType for
# identity notifications and eventType for configuration-set event publishing; either is
# read. Only a bounce and a complaint are failures; a blank recipient is skipped.
transform: |
  def domain:
    (. // "")
    | (capture("<[^<>@\\s]+@(?<d>[^<>\\s]+)>\\s*$") // capture("^\\s*[^<>@\\s]+@(?<d>[^<>\\s]+)\\s*$") // {d: ""})
    | .d;
  def addresses: map(.emailAddress // "" | select(gsub("\\s"; "") != ""));
  .body as $n
  | if $n.Type != "Notification" then []
    else
      ($n.Message | fromjson) as $m
      | ($m.notificationType // $m.eventType) as $type
      | ($m.mail.source | domain) as $d
      | if $type == "Bounce" then
          (($m.bounce.bounceType == "Permanent") as $permanent
          | [($m.bounce.bouncedRecipients // []) | addresses[]
             | {id: $n.MessageId, destination: ., kind: "bounce", permanent: $permanent, sending_domain: $d}])
        elif $type == "Complaint" then
          [($m.complaint.complainedRecipients // []) | addresses[]
           | {id: $n.MessageId, destination: ., kind: "complaint", sending_domain: $d}]
        else [] end
    end
tests:
  - name: a permanent bounce suppresses every recipient and carries the sending domain
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"mail\":{\"source\":\"News \u003chello@Codebasics.dev\u003e\"},\"bounce\":{\"bounceType\":\"Permanent\",\"bouncedRecipients\":[{\"emailAddress\":\"Alice@Example.com\"},{\"emailAddress\":\"b@example.com\"}]}}","MessageId":"sns-msg-1","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      failures:
        - {
            id: sns-msg-1,
            destination: alice@example.com,
            kind: bounce,
            permanent: true,
            sending_domain: codebasics.dev,
          }
        - {
            id: sns-msg-1,
            destination: b@example.com,
            kind: bounce,
            permanent: true,
            sending_domain: codebasics.dev,
          }
  - name: a transient bounce is not permanent
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"bounce\":{\"bounceType\":\"Transient\",\"bouncedRecipients\":[{\"emailAddress\":\"soft@example.com\"}]}}","MessageId":"sns-msg-2","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      failures:
        - { id: sns-msg-2, destination: soft@example.com, kind: bounce, permanent: false }
  - name: a complaint in the configuration-set form, with a blank recipient skipped
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"eventType\":\"Complaint\",\"mail\":{\"source\":\"hello@codebasics.dev\"},\"complaint\":{\"complainedRecipients\":[{\"emailAddress\":\" Stranger@Example.com \"},{\"emailAddress\":\"  \"}]}}","MessageId":"sns-msg-3","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      failures:
        - {
            id: sns-msg-3,
            destination: stranger@example.com,
            kind: complaint,
            sending_domain: codebasics.dev,
          }
  - name: a delivery carries no failure
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Delivery\",\"delivery\":{}}","MessageId":"sns-msg-4","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      failures: []
  - name: a Message that is not JSON cannot be read
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"not json","MessageId":"sns-msg-5","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      refused: transform_failed
  - name: a signed notification from another topic is refused
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"bounce\":{\"bounceType\":\"Permanent\",\"bouncedRecipients\":[{\"emailAddress\":\"victim@example.com\"}]}}","MessageId":"sns-msg-6","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:999999999999:attacker","Type":"Notification"}'
    expect:
      refused: unauthentic
  - name: an Integration that names no topic refuses every notification
    now: '2026-01-01T00:00:00Z'
    params: {}
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"mail\":{\"source\":\"News \u003chello@Codebasics.dev\u003e\"},\"bounce\":{\"bounceType\":\"Permanent\",\"bouncedRecipients\":[{\"emailAddress\":\"Alice@Example.com\"},{\"emailAddress\":\"b@example.com\"}]}}","MessageId":"sns-msg-1","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      refused: unauthentic
  - name: a notification altered after signing is refused
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"mail\":{\"source\":\"News \u003chello@Codebasics.dev\u003e\"},\"bounce\":{\"bounceType\":\"Permanent\",\"bouncedRecipients\":[{\"emailAddress\":\"victim@example.com\"},{\"emailAddress\":\"b@example.com\"}]}}","MessageId":"sns-msg-1","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      refused: unauthentic
  - name: a signature that is not AWS's is refused
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"mail\":{\"source\":\"News \u003chello@Codebasics.dev\u003e\"},\"bounce\":{\"bounceType\":\"Permanent\",\"bouncedRecipients\":[{\"emailAddress\":\"Alice@Example.com\"},{\"emailAddress\":\"b@example.com\"}]}}","MessageId":"sns-msg-1","Signature":"Ym9ndXM=","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      refused: unauthentic
  - name: a signing certificate from outside AWS is refused
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"mail\":{\"source\":\"News \u003chello@Codebasics.dev\u003e\"},\"bounce\":{\"bounceType\":\"Permanent\",\"bouncedRecipients\":[{\"emailAddress\":\"Alice@Example.com\"},{\"emailAddress\":\"b@example.com\"}]}}","MessageId":"sns-msg-1","Signature":"","SignatureVersion":"2","SigningCertURL":"https://evil.example.com/cert.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      refused: unauthentic
  - name: a subscription confirmation is returned as an action to confirm
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"You have chosen to subscribe to the topic arn:aws:sns:eu-west-1:123456789012:acme-ses-events","MessageId":"sns-msg-7","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","SubscribeURL":"https://sns.eu-west-1.amazonaws.com/?Action=ConfirmSubscription\u0026TopicArn=arn:aws:sns:eu-west-1:123456789012:acme-ses-events\u0026Token=abc","Timestamp":"2026-01-01T00:00:00.000Z","Token":"token-sns-msg-7","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"SubscriptionConfirmation"}'
    expect:
      failures: []
      action:
        kind: confirm
        url: 'https://sns.eu-west-1.amazonaws.com/?Action=ConfirmSubscription&TopicArn=arn:aws:sns:eu-west-1:123456789012:acme-ses-events&Token=abc'
  - name: a confirmation for another topic is not confirmed
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"You have chosen to subscribe to the topic arn:aws:sns:eu-west-1:999999999999:attacker","MessageId":"sns-msg-8","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","SubscribeURL":"https://sns.eu-west-1.amazonaws.com/?Action=ConfirmSubscription","Timestamp":"2026-01-01T00:00:00.000Z","Token":"token-sns-msg-8","TopicArn":"arn:aws:sns:eu-west-1:999999999999:attacker","Type":"SubscriptionConfirmation"}'
    expect:
      refused: unauthentic
  - name: a SubscribeURL outside AWS is refused
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"You have chosen to subscribe to the topic arn:aws:sns:eu-west-1:123456789012:acme-ses-events","MessageId":"sns-msg-9","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","SubscribeURL":"https://evil.example.com/?Action=ConfirmSubscription","Timestamp":"2026-01-01T00:00:00.000Z","Token":"token-sns-msg-9","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"SubscriptionConfirmation"}'
    expect:
      refused: unauthentic
