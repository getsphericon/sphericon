          }
  - name: a Message that is not JSON cannot be read
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"not json","MessageId":"sns-msg-5","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      refused: transform_failed
  - name: a signed notification from another topic is refused
