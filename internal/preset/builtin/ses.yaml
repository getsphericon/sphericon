# yaml-language-server: $schema=../preset.schema.json
version: 1
name: ses
description: Amazon SES bounces, complaints, deliveries, delays and drops, delivered through an SNS topic.
params:
  type: object
  required: [topic_arn]
  additionalProperties: false
  properties:
    topic_arn:
      type: string
      title: SNS topic ARN
      description: The one SNS topic your SES events are published to. A signed notification from any other topic is refused.
      pattern: ^arn:aws[a-z-]*:sns:[a-z0-9-]+:[0-9]+:[A-Za-z0-9_-]+$
verify:
  kind: sns
  topic: topic_arn
# The SNS message carries the SES event as a JSON string. SES uses notificationType for
# identity notifications and eventType for configuration-set event publishing; either is
# read. Bounce, complaint, delivery, delay (DeliveryDelay) and drop (Reject, Rendering
# Failure) each become a Delivery notice per recipient, carrying mail.messageId so the notice
# is linked to its Outbound message; a blank recipient is skipped.
transform: |
  def domain:
    (. // "")
    | (capture("<[^<>@\\s]+@(?<d>[^<>\\s]+)>\\s*$") // capture("^\\s*[^<>@\\s]+@(?<d>[^<>\\s]+)\\s*$") // {d: ""})
    | .d;
  def keep: with_entries(select(.value != null and .value != ""));
  def recipients: map(select((.address // "") | gsub("\\s"; "") != ""));
  .body as $n
  | if $n.Type != "Notification" then []
    else
      ($n.Message | fromjson) as $m
      | ($m.notificationType // $m.eventType) as $type
      | ($m.mail.source | domain) as $d
      | def notice($kind): {id: $n.MessageId, destination: .address, kind: $kind, sending_domain: $d, message_id: $m.mail.messageId, reason: .reason} | keep;
        if $type == "Bounce" then
          (($m.bounce.bounceType == "Permanent") as $permanent
          | [($m.bounce.bouncedRecipients // []) | map({address: .emailAddress, reason: .diagnosticCode}) | recipients[]
             | notice("bounce") + {permanent: $permanent}])
        elif $type == "Complaint" then
          [($m.complaint.complainedRecipients // []) | map({address: .emailAddress}) | recipients[] | notice("complaint")]
        elif $type == "Delivery" then
          [($m.delivery.recipients // []) | map({address: .}) | recipients[] | notice("delivery")]
        elif $type == "DeliveryDelay" then
          [($m.deliveryDelay.delayedRecipients // [])
           | map({address: .emailAddress, reason: (.diagnosticCode // $m.deliveryDelay.delayType)}) | recipients[] | notice("delay")]
        elif $type == "Reject" then
          [($m.mail.destination // []) | map({address: ., reason: $m.reject.reason}) | recipients[] | notice("drop")]
        elif $type == "Rendering Failure" then
          [($m.mail.destination // []) | map({address: ., reason: $m.failure.errorMessage}) | recipients[] | notice("drop")]
        else [] end
    end
tests:
  - name: a permanent bounce suppresses every recipient, carries the sending domain, the message id and the reason
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"mail\":{\"source\":\"News \u003chello@Codebasics.dev\u003e\",\"messageId\":\"ses-msg-alice-1\"},\"bounce\":{\"bounceType\":\"Permanent\",\"bouncedRecipients\":[{\"emailAddress\":\"Alice@Example.com\",\"diagnosticCode\":\"smtp; 550 5.1.1 user unknown\"},{\"emailAddress\":\"b@example.com\"}]}}","MessageId":"sns-msg-1","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      notices:
        - {
            id: sns-msg-1,
            destination: alice@example.com,
            kind: bounce,
            permanent: true,
            sending_domain: codebasics.dev,
            message_id: ses-msg-alice-1,
            reason: 'smtp; 550 5.1.1 user unknown',
          }
        - {
            id: sns-msg-1,
            destination: b@example.com,
            kind: bounce,
            permanent: true,
            sending_domain: codebasics.dev,
            message_id: ses-msg-alice-1,
          }
  - name: a notice with no message id stays at the address
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"mail\":{\"source\":\"News \u003chello@Codebasics.dev\u003e\"},\"bounce\":{\"bounceType\":\"Permanent\",\"bouncedRecipients\":[{\"emailAddress\":\"Alice@Example.com\"},{\"emailAddress\":\"b@example.com\"}]}}","MessageId":"sns-msg-1b","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      notices:
        - {
            id: sns-msg-1b,
            destination: alice@example.com,
            kind: bounce,
            permanent: true,
            sending_domain: codebasics.dev,
          }
        - {
            id: sns-msg-1b,
            destination: b@example.com,
            kind: bounce,
            permanent: true,
            sending_domain: codebasics.dev,
          }
  - name: a transient bounce is not permanent
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Bounce\",\"bounce\":{\"bounceType\":\"Transient\",\"bouncedRecipients\":[{\"emailAddress\":\"soft@example.com\"}]}}","MessageId":"sns-msg-2","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      notices:
        - { id: sns-msg-2, destination: soft@example.com, kind: bounce, permanent: false }
  - name: a complaint in the configuration-set form, with a blank recipient skipped
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"eventType\":\"Complaint\",\"mail\":{\"source\":\"hello@codebasics.dev\"},\"complaint\":{\"complainedRecipients\":[{\"emailAddress\":\" Stranger@Example.com \"},{\"emailAddress\":\"  \"}]}}","MessageId":"sns-msg-3","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      notices:
        - {
            id: sns-msg-3,
            destination: stranger@example.com,
            kind: complaint,
            sending_domain: codebasics.dev,
          }
  - name: a delivery notice carries the message id
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"notificationType\":\"Delivery\",\"mail\":{\"source\":\"News \u003chello@Codebasics.dev\u003e\",\"messageId\":\"ses-msg-alice-1\"},\"delivery\":{\"recipients\":[\"Alice@Example.com\"]}}","MessageId":"sns-msg-4","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      notices:
        - {
            id: sns-msg-4,
            destination: alice@example.com,
            kind: delivery,
            sending_domain: codebasics.dev,
            message_id: ses-msg-alice-1,
          }
  - name: a delivery with no message id still maps
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"eventType\":\"Delivery\",\"mail\":{\"source\":\"hello@codebasics.dev\"},\"delivery\":{\"recipients\":[\"Stranger@Example.com\"]}}","MessageId":"sns-msg-4b","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      notices:
        - {
            id: sns-msg-4b,
            destination: stranger@example.com,
            kind: delivery,
            sending_domain: codebasics.dev,
          }
  - name: a delay carries its reason
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"eventType\":\"DeliveryDelay\",\"mail\":{\"source\":\"hello@codebasics.dev\",\"messageId\":\"ses-msg-alice-1\"},\"deliveryDelay\":{\"delayType\":\"RecipientServerError\",\"delayedRecipients\":[{\"emailAddress\":\"Alice@Example.com\",\"diagnosticCode\":\"smtp; 451 4.7.1 try again later\"}]}}","MessageId":"sns-msg-10","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      notices:
        - {
            id: sns-msg-10,
            destination: alice@example.com,
            kind: delay,
            sending_domain: codebasics.dev,
            message_id: ses-msg-alice-1,
            reason: 'smtp; 451 4.7.1 try again later',
          }
  - name: a rejected send is a drop with its reason
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"eventType\":\"Reject\",\"mail\":{\"source\":\"hello@codebasics.dev\",\"messageId\":\"ses-msg-alice-1\",\"destination\":[\"Alice@Example.com\"]},\"reject\":{\"reason\":\"Bad content\"}}","MessageId":"sns-msg-11","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
      notices:
        - {
            id: sns-msg-11,
            destination: alice@example.com,
            kind: drop,
            sending_domain: codebasics.dev,
            message_id: ses-msg-alice-1,
            reason: Bad content,
          }
  - name: a reason is capped at 500 characters
    now: '2026-01-01T00:00:00Z'
    params:
      topic_arn: arn:aws:sns:eu-west-1:123456789012:acme-ses-events
    request:
      body: '{"Message":"{\"eventType\":\"Reject\",\"mail\":{\"source\":\"hello@codebasics.dev\",\"messageId\":\"ses-msg-alice-1\",\"destination\":[\"alice@example.com\"]},\"reject\":{\"reason\":\"éééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé\"}}","MessageId":"sns-msg-12","Signature":"","SignatureVersion":"2","SigningCertURL":"https://sns.eu-west-1.amazonaws.com/SimpleNotificationService-sphericon-test.pem","Timestamp":"2026-01-01T00:00:00.000Z","TopicArn":"arn:aws:sns:eu-west-1:123456789012:acme-ses-events","Type":"Notification"}'
    expect:
