# The Webhook endpoints the boolean `enabled` could describe: enabled, turned off by an owner
# (no reason) and turned off by the delivery worker (reason gone).
- id: 1
  url: https://on.test
  secret_encrypted: x
  enabled: true
  workspace_id: 1
  created_at: '{{now}}'
  updated_at: '{{now}}'
- id: 2
  url: https://owner.test
  secret_encrypted: x
  enabled: false
  workspace_id: 1
  created_at: '{{now}}'
  updated_at: '{{now}}'
- id: 3
  url: https://gone.test
  secret_encrypted: x
  enabled: false
  disabled_reason: gone
  workspace_id: 1
  created_at: '{{now}}'
  updated_at: '{{now}}'
