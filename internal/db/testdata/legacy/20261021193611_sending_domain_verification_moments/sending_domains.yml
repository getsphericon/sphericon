# The Sending domains the boolean `verified` could describe: verified now, lost (verified once,
# not now) and never verified.
- id: 1
  domain: live.test
  dkim_selector: s
  dkim_private_key_encrypted: x
  dkim_public_key: p
  workspace_id: 1
  verified: true
  verified_at: '{{daysAgo 30}}'
  last_checked_at: '{{daysAgo 1}}'
  created_at: '{{now}}'
  updated_at: '{{now}}'
- id: 2
  domain: lost.test
  dkim_selector: s
  dkim_private_key_encrypted: x
  dkim_public_key: p
  workspace_id: 1
  verified: false
  verified_at: '{{daysAgo 30}}'
  last_checked_at: '{{daysAgo 2}}'
  created_at: '{{now}}'
  updated_at: '{{now}}'
- id: 3
  domain: never.test
  dkim_selector: s
  dkim_private_key_encrypted: x
  dkim_public_key: p
  workspace_id: 1
  verified: false
  created_at: '{{now}}'
  updated_at: '{{now}}'
