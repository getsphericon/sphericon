# Message 1 points at a standing Template. Message 2 points at a Template and an Automation run
# that are gone, message 3 at an Integration that is gone: ids that dangle before the keys exist.
- id: 1
  kind: transactional
  idempotency_key: standing
  destination: a@x.test
  template_id: 1
  status: sent
  claimed_at: '{{now}}'
  workspace_id: 1
  created_at: '{{now}}'
  updated_at: '{{now}}'
- id: 2
  kind: transactional
  idempotency_key: gone-template-and-run
  destination: b@x.test
  template_id: 77
  automation_run_id: 88
  status: sent
  claimed_at: '{{now}}'
  workspace_id: 1
  created_at: '{{now}}'
  updated_at: '{{now}}'
- id: 3
  kind: transactional
  idempotency_key: gone-integration
  destination: c@x.test
  integration_id: 66
  status: sent
  claimed_at: '{{now}}'
  workspace_id: 1
  created_at: '{{now}}'
  updated_at: '{{now}}'
