# Jobs the previous release queued: the evaluations named their Workspace at workspace_id, an
# event job at its envelope's workspaceId, a recipient send only by its row.
- id: 1
  kind: automation_evaluate_trigger
  queue: default
  state: available
  args: '{"workspace_id": 1, "contact_id": 5, "action": "page_view"}'
  max_attempts: 25
  priority: 1
  attempt: 0
- id: 2
  kind: rule_evaluate_event
  queue: default
  state: retryable
  args: '{"workspace_id": 1, "contact_id": 5, "action": "page_view", "source_id": "evt-1"}'
  max_attempts: 25
  priority: 1
  attempt: 1
  attempted_at: '2026-03-01 00:00:00'
- id: 3
  kind: automation_evaluate_trigger
  queue: default
  state: running
  args: '{"workspace_id": 1, "contact_id": 6, "action": "page_view"}'
  max_attempts: 25
  priority: 1
  attempt: 1
  attempted_at: '2026-03-01 00:00:00'
- id: 4
  kind: automation_evaluate_trigger
  queue: default
  state: available
  args: '{"workspace_id": 2, "contact_id": 7, "action": "page_view"}'
  max_attempts: 25
  priority: 1
  attempt: 0
