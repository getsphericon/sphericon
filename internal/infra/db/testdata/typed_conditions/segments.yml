# Segments in the Condition shape before ADR 0181: a `rule` leaf names what it tests in `field`
# (`custom:<key>` for a Custom field) with one operator enum, `number`, `date` and `dateWithin` are
# leaves of their own, and a group's entries are its `rules`. One Segment per leaf kind and
# operator, a nested negated group, the empty group (archived), and one already in the typed shape,
# as a run of the migration that was interrupted after its rewrite would leave it.
- id: 1
  revision: 1
  name: first name is Ann
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"first_name","operator":"eq","value":"Ann"}]}'
