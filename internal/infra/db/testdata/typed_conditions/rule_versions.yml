  rule_id: 1
  version: 1
  condition: '{"kind":"group","combinator":"and","rules":[{"kind":"rule","field":"trigger:ref","operator":"null"},{"kind":"rule","field":"trigger:url","operator":"notNull"},{"kind":"rule","field":"trigger:url","operator":"beginsWith","value":"https://acme"},{"kind":"rule","field":"trigger:url","operator":"eq","value":"https://acme.test/pricing"},{"kind":"rule","field":"trigger:url","operator":"neq","value":"https://acme.test/"}]}'
  actions: '[{"type":"apply_tag","tag":"visitor"}]'
  workspace_id: 1
