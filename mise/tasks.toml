# Project tasks, included from .mise.toml (`[task_config] includes`).
#   mise tasks          list them
#   mise run <task>     run one (tasks that need Postgres depend on db:up)
# Tasks run natively with the tools pinned in .mise.toml; the dev stack itself is the
# [daemons] table there.

# --- setup & dev stack ----------------------------------------------------------

[install]
description = "Install frontend and Go dependencies"
run = [
  "pnpm install",
  "go mod download",
  "command -v flock >/dev/null || echo 'warning: flock not found, heavy tasks will not queue (macOS: brew install flock)'",
]

[setup]
description = "Install deps, start Postgres, create this checkout's DBs, migrate and seed, drop the databases of deleted worktrees"
depends = ["install", "db:seed"]
run = [{ task = "worktrees:gc --apply" }]

[dev]
description = "Migrate, then start the whole dev stack (https://sphericon.localhost in the primary checkout, `mise env | grep SPHERICON_APP_URL` elsewhere)"
depends = ["db:migrate"]
run = ["node mise/scripts/check-dev-ports.ts", "mise daemons start caddy"]

["dev:down"]
description = "Stop this checkout's dev stack (never the shared Postgres: `mise -C <primary checkout> daemons stop db` stops it for everyone)"
run = "mise daemons stop caddy backend frontend demo mailpit"

["dev:restart"]
description = "Restart this checkout's dev stack (dev:down, then dev; the shared Postgres keeps running)"
run = ["mise run dev:down", "mise run dev"]

# --- database --------------------------------------------------------------------

["db:up"]
description = "Make sure the shared Postgres runs (the primary checkout's db daemon) and this checkout's databases exist; idempotent, silent when there is nothing to do"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
# A server answering at PGHOST:PGPORT is used as is: that is the no-op case, an external
# Postgres (SPHERICON_PG_*), and what makes concurrent callers safe. Otherwise the primary
# checkout's daemon is started (pitchfork treats a start of a running or starting daemon as
# done), and we wait for the port.
if ! nc -z "$PGHOST" "$PGPORT" 2>/dev/null; then
  case "$PGHOST" in
    127.0.0.1|localhost) ;;
    *) echo "db:up: no Postgres answers at $PGHOST:$PGPORT and it is not local, so it is not started" >&2; exit 1 ;;
  esac
  primary=$(git worktree list --porcelain | sed -n '1s/^worktree //p')
  mise -C "$primary" daemons start db >/dev/null 2>&1 || true
  for _ in $(seq 1 120); do nc -z "$PGHOST" "$PGPORT" 2>/dev/null && break; sleep 0.5; done
  nc -z "$PGHOST" "$PGPORT" 2>/dev/null || { echo "db:up: Postgres did not come up at $PGHOST:$PGPORT; see: mise -C $primary daemons logs db" >&2; exit 1; }
fi
psql=psql
command -v psql >/dev/null || psql="mise x postgres@18 -- psql"
# One session under an advisory lock, so two checkouts creating at once cannot collide.
$psql -X -q -t -A -o /dev/null -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1 <<SQL
select pg_advisory_lock(1982370041);
select format('create database %I', n) from unnest(string_to_array('$DB_NAMES', ' ')) as n
  where not exists (select from pg_database where datname = n) \\gexec
SQL
'''

["db:drop"]
description = "Drop the dev database"
depends = ["db:up"]
run = "go run ./cmd/db drop"

["db:drop-test"]
description = "Drop the test database"
depends = ["db:up"]
env = { SPHERICON_ENV = "test", DATABASE_URL = "{{env.TEST_DB_URL}}" }
run = "go run ./cmd/db drop"

["db:migrate"]
description = "Apply the migrations: the app schema, river's tables and the domain-event outbox (`sphericon migrate`: goose, the runner the start guard and the tests read)"
depends = ["db:up"]
run = "go run ./cmd/server migrate"

["db:seed"]
description = "Load seed data into the dev database"
depends = ["db:migrate"]
run = "go run ./cmd/seed"

["db:reset"]
description = "Drop, recreate and migrate the dev database (run once on a dev database made before the goose-only switch)"
run = [{ task = "db:drop" }, "go run ./cmd/db create", { task = "db:migrate" }]

["db:reset-test"]
description = "Drop and recreate the test database"
run = [{ task = "db:drop-test" }, { task = "db:up" }]

["db:generate"]
description = "Generate the next migration from the ent schema (ent's own diff engine, written as a goose file)"
depends = ["db:up"]
usage = 'arg "<name>" help="migration name"'
run = 'go run ./cmd/db generate "${usage_name}"'

["db:river-migration"]
description = "Write the migrations for river versions the migrations/ directory lacks (after a river upgrade); river's SQL comes from the go.mod version"
run = "go run ./cmd/db river-migration"

["gen:encryption-key"]
description = "Mint a fresh SPHERICON_ENCRYPTION_KEY (base64 Tink keyset) to paste into your .env"
run = "go run ./cmd/server genkey"

# --- worktrees ----------------------------------------------------------------------

["land"]
description = "Land the work of this worktree on main: rebase onto origin/main, mise run check and test, push HEAD to main, close the tickets. `mise run land -- [--skip-test] [<issue>...]`; a detached HEAD with a clean tree"
run = "node mise/scripts/land.ts"

["worktrees:prune"]
description = "Remove clean worktrees whose branch is already in origin/main, then run worktrees:gc; dry run unless --apply"
usage = 'flag "--apply" help="actually remove, instead of listing"'
run = '''
git fetch -q origin main
main_wt=$(git worktree list --porcelain | sed -n '1s/^worktree //p')
git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch /{b=substr($0,8)} /^$/{if(p&&b)print p"\t"b; p="";b=""} END{if(p&&b)print p"\t"b}' |
while IFS=$'\t' read -r path ref; do
  [ "$path" = "$main_wt" ] && continue
  branch=${ref#refs/heads/}
  [ -n "$(git -C "$path" status --porcelain)" ] && { echo "keep    $path ($branch): uncommitted changes"; continue; }
  git merge-base --is-ancestor "$ref" origin/main || { echo "keep    $path ($branch): not in origin/main"; continue; }
  if [ -z "${usage_apply:-}" ]; then echo "would remove $path ($branch)"; continue; fi
  git worktree unlock "$path" 2>/dev/null || true
  git worktree remove "$path" && git branch -D "$branch" >/dev/null && echo "removed $path ($branch)"
done
# What the removed worktrees leave behind (daemons, databases) is worktrees:gc's to sweep.
mise run worktrees:gc ${usage_apply:+--apply}
'''

["worktrees:gc"]
description = "Drop the databases of deleted worktrees from the shared Postgres and the daemon state they left (mise daemons prune); idempotent, dry run unless --apply"
usage = 'flag "--apply" help="actually drop and prune, instead of listing"'
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
apply=${usage_apply:-}

# 1. Databases. The shared server only holds sphericon databases, each checkout's DB_NAMES (see
#    .mise.toml). A live worktree is a `git worktree list` entry whose directory exists; its
#    names are read from its own mise environment. Whatever cannot be read leaves the keep
#    list incomplete (a worktree on a commit before DB_NAMES, an untrusted config), so then
#    nothing is dropped. The server itself is never touched: it is the primary's daemon.
keep=$(mktemp)
trap 'rm -f "$keep"' EXIT
refuse=""
worktrees=$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10); pr=0} /^prunable/{pr=1} /^$/{if(p) print p"\t"pr; p=""} END{if(p) print p"\t"pr}') || worktrees=""
[ -n "$worktrees" ] || refuse="cannot enumerate git worktrees"
while IFS=$'\t' read -r path prunable; do
  [ -n "$path" ] || continue
  if [ ! -d "$path" ]; then
    if [ "$prunable" = 1 ]; then echo "gone    $path (deleted worktree)"; continue; fi
    refuse="$refuse; $path is missing but git does not mark it prunable"; continue
  fi
  if ! out=$(mise -C "$path" env 2>/dev/null); then
    refuse="$refuse; cannot read the mise environment of $path (mise trust it?)"; continue
  fi
  names=$(printf '%s\n' "$out" | sed -n "s/^export DB_NAMES=//p" | tr -d "'")
  if [ -z "$names" ]; then refuse="$refuse; $path exports no DB_NAMES (merge main into it)"; continue; fi
  printf '%s\n' $names >> "$keep"
  echo "live    $path -> ${names%% *}"
done <<< "$worktrees"

status=0
if [ -n "$refuse" ]; then
  echo "db: refusing to drop anything: ${refuse#; }" >&2
elif ! nc -z "$PGHOST" "$PGPORT" 2>/dev/null; then
  echo "db: no Postgres at $PGHOST:$PGPORT, nothing to sweep (mise run db:up starts it)"
else
  psql=psql
  command -v psql >/dev/null || psql="mise x postgres@18 -- psql"
  psql="$psql -X -A -t -q -h $PGHOST -p $PGPORT -U $PGUSER -d postgres"
  for d in $($psql -c "select datname from pg_database where not datistemplate and datname <> 'postgres'"); do
    if grep -qxF "$d" "$keep"; then continue; fi
    case "$d" in *\"*) echo "keep    database $d (unusual name)"; continue ;; esac
    # pgtestdb's per-test databases belong to a test that may be running in any checkout.
    case "$d" in testdb_tpl_*) echo "keep    database $d (pgtestdb)"; continue ;; esac
    # A live checkout's test process databases: `<test db>_w<i>` and `<test db>_tpl_<hash>`
    # (dbcleaner.WithTemplate, wired in internal/testhelper). They go with the checkout's `<test db>`.
    base=${d%_w[0-9]*}; base=${base%_tpl_*}
    if [ "$base" != "$d" ] && grep -qxF "$base" "$keep"; then continue; fi
    if [ -z "$apply" ]; then echo "would drop database $d"; continue; fi
    $psql -c "drop database \"$d\" with (force)" >/dev/null && echo "dropped database $d"
  done
fi

# 2. Daemon state of deleted worktrees and projects (stops their daemons, deletes state and
#    data). Live checkouts, the primary and its Postgres included, are never touched.
if [ -z "$apply" ]; then mise daemons prune --dry-run; else mise daemons prune --yes; fi
exit "$status"
'''

# --- tests -----------------------------------------------------------------------

[test]
description = "Go tests, packages in parallel, each on a database of its own (creates the test DB first); shuffled when CI is set, cached results otherwise; pass packages/flags after `--`"
depends = ["db:up"]
env = { SPHERICON_ENV = "test", DATABASE_URL = "{{env.TEST_DB_URL}}" }
usage = 'arg "[go_test_args]" var=#true default="./..." help="packages and flags for go test"'
run = 'eval "set -- $usage_go_test_args"; mise/scripts/heavy.sh go test ${CI:+-shuffle=on} "$@"'

["test:race"]
description = "Go tests under the race detector, two packages at a time (the JavaScript runtime is several times slower with it, so this runs nightly, not per pull request)"
depends = ["db:up"]
env = { SPHERICON_ENV = "test", DATABASE_URL = "{{env.TEST_DB_URL}}", CGO_ENABLED = "1" }
run = "mise/scripts/heavy.sh go test -race -shuffle=on -p 2 ./..."

["test:mutation"]
description = "Mutation testing of the packages whose logic decides what is sent (go-mutesting, three workers); pass other packages after `--`. A surviving mutant is a change the tests do not notice: nightly, not per pull request"
depends = ["db:up"]
env = { SPHERICON_ENV = "test", DATABASE_URL = "{{env.TEST_DB_URL}}" }
usage = 'arg "[packages]" var=#true help="packages to mutate (default: eligibility and sendlimit)"'
run = 'eval "set -- $usage_packages"; [ $# -gt 0 ] || set -- ./internal/eligibility/... ./internal/sendlimit/...; go tool go-mutesting --workers 3 --quiet --no-diffs --min-msi 75 "$@"'

["test:fuzz"]
description = "Go native fuzzing of the parsers that take outside input (FUZZTIME per target, default 30s); a crash lands in the package's testdata/fuzz as a regression"
env = { FUZZTIME = "30s" }
run = [
  "go test ./internal/emaildoc -run '^$' -fuzz '^FuzzPrepare' -fuzztime $FUZZTIME",
  "go test ./internal/preset -run '^$' -fuzz '^FuzzParse' -fuzztime $FUZZTIME",
  "go test ./ee/licensekey -run '^$' -fuzz '^FuzzParseOf' -fuzztime $FUZZTIME",
  "go test ./internal/validation -run '^$' -fuzz '^FuzzAccountEmail$' -fuzztime $FUZZTIME",
  "go test ./internal/validation -run '^$' -fuzz '^FuzzPassword$' -fuzztime $FUZZTIME",
]

["test:cover"]
description = "Go tests with coverage over cmd/ and internal/ (ee/ too), failing under the total in .testcoverage.yml"
depends = ["db:up"]
env = { SPHERICON_ENV = "test", DATABASE_URL = "{{env.TEST_DB_URL}}" }
run = [
  "mise/scripts/heavy.sh go test -shuffle=on ./... -coverpkg=./cmd/...,./internal/...,./ee/... -coverprofile=cover.out -covermode=atomic",
  "go tool go-test-coverage --config=.testcoverage.yml",
]

["test:e2e"]
description = "End-to-end suite (ADR 0024): rebuilds the dedicated e2e DB, starts its own Mailpit, boots the app in-process; pass `go test` flags after `--`; HOLD=true keeps the stack up after the run for inspection"
depends = ["db:up"]
env = { SPHERICON_ENV = "e2e", DATABASE_URL = "{{env.E2E_DB_URL}}", SPHERICON_METRICS_ADDR = "" }
usage = 'arg "[go_test_args]" var=#true default="./e2e/..." help="packages and flags for go test"'
run = [
  "go run ./cmd/db drop",
  "go run ./cmd/db create",
  "go run ./cmd/server migrate",
  '''eval "set -- $usage_go_test_args"; mise/scripts/heavy.sh go test -tags e2e -count=1 -p 1 -shuffle=on "$@"''',
]

["test:watch"]
description = "Frontend tests in watch mode"
run = "pnpm exec vitest"

["test:frontend"]
description = "One-shot frontend run with v8 coverage and thresholds (Vitest Browser Mode, headless Chromium); html report in coverage/. CI runs it as test:frontend:shard + test:frontend:merge"
run = "mise/scripts/heavy.sh pnpm exec vitest run --coverage"

# CI splits the frontend suite over runners: each shard writes a blob report that carries its coverage
# (.vitest/blob), and test:frontend:merge joins them and checks the thresholds. A shard sees a third of
# the suite, so its own thresholds are zeroed; the merged run enforces the ones in vite.config.ts.
["test:frontend:shard"]
description = "One shard of the frontend suite (CI): blob report with coverage in .vitest/blob, no thresholds"
usage = 'arg "<shard>" help="shard as index/count, e.g. 1/3"'
run = '''mise/scripts/heavy.sh pnpm exec vitest run --coverage --reporter=blob --shard="${usage_shard}" --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.lines=0'''

["test:frontend:merge"]
description = "Join the shards' blob reports from .vitest/blob and enforce the coverage thresholds (CI)"
run = "pnpm exec vitest --merge-reports=.vitest/blob --coverage"

# --- dependency updates ----------------------------------------------------------

[update]
description = "Update npm, Go and skills dependencies"
depends = ["update:npm", "update:go", "update:skills"]

["update:npm"]
# openapi-ts stays on its pinned next channel: stable still needs the TypeScript package, which breaks under TS7.
run = "pnpm exec ncu -u --reject @hey-api/openapi-ts && pnpm update"

["update:go"]
run = "go get -u ./... && go mod tidy"

["update:skills"]
run = "npx skills@latest update -y"

# --- code generation (TypeSpec -> OpenAPI -> Go + TS) -----------------------------

["generate:typespec-external"]
run = "pnpm exec tsp compile typespec/external"

["generate:typespec-site"]
run = "pnpm exec tsp compile typespec/site"

["generate:typespec-collect"]
run = "pnpm exec tsp compile typespec/collect"

["generate:typespec-staff"]
run = "pnpm exec tsp compile typespec/staff"

["generate:typespec-service"]
run = "pnpm exec tsp compile typespec/service"

["generate:typespec-telemetry"]
run = "pnpm exec tsp compile typespec/telemetry"

["generate:typespec"]
description = "TypeSpec -> OpenAPI"
depends = [
  "generate:typespec-external",
  "generate:typespec-site",
  "generate:typespec-collect",
  "generate:typespec-staff",
  "generate:typespec-service",
  "generate:typespec-telemetry",
]

["generate:openapi"]
description = "OpenAPI -> TS clients (site and staff clients, collect types, one config)"
run = "pnpm exec openapi-ts -f openapi-ts.config.ts"

["generate:routes"]
description = "src/routes -> src/routeTree.gen.ts (TanStack Router file-based route tree)"
run = "pnpm exec tsr generate"

["generate:i18n-types"]
run = "pnpm run i18n:types"

["generate:backend"]
description = "OpenAPI/ent -> Go (ent, ogen, goverter)"
run = [
  "cd ent && ../mise/scripts/heavy.sh go run -mod=mod entc.go",
  "mise/scripts/heavy.sh go tool ogen --target gen/site --package siteapi --clean openapi/site.openapi.json",
  "mise/scripts/heavy.sh go tool ogen --target gen/external --package externalapi --clean openapi/external.openapi.json",
  "mise/scripts/heavy.sh go tool ogen --target gen/collect --package collectapi --clean openapi/collect.openapi.json",
  "mise/scripts/heavy.sh go tool ogen --target gen/staff --package staffapi --clean openapi/staff.openapi.json",
  "mise/scripts/heavy.sh go tool ogen --target gen/service --package serviceapi --clean openapi/service.openapi.json",
  "mise/scripts/heavy.sh go tool ogen --config ogen.telemetry.yml --target gen/telemetry --package telemetryapi --clean openapi/telemetry.openapi.json",
  "mise/scripts/heavy.sh go tool goverter gen ./internal/api/site/resources ./internal/api/external/resources ./ee/staff/resources",
]

["generate:mocks"]
description = "Go interfaces -> test mocks (moq, *_gen_test.go next to the tests that use them)"
run = [
  "go tool moq -out internal/jobs/mocks_gen_test.go -pkg jobs_test ./internal/outbound Senders",
  "go tool moq -out internal/messaging/mocks_gen_test.go -pkg messaging_test ./internal/messaging EmailSender",
]

["generate:fixtures"]
description = "fixtures/*.yml -> Go (fixture catalog constants for `# fixture: Name` rows)"
run = "go run ./cmd/fixturegen"

["generate:scopes"]
description = "openapi/service (x-required-scopes) -> Go (ee/staff service operation-to-scopes map)"
run = "go run ./cmd/scopegen"

[generate]
description = "Full cycle: typespec -> openapi -> backend -> test mocks -> fixture catalog -> frontend (clients, route tree) -> i18n types -> format"
run = [
  { task = "generate:typespec" },
  { task = "generate:openapi" },
  { task = "generate:routes" },
  { task = "generate:backend" },
  { task = "generate:scopes" },
  { task = "generate:mocks" },
  { task = "generate:fixtures" },
  { task = "fix" },
]

["generate:check"]
description = "Review rule 1: fail when committed generated output differs from what `generate` produces (CI gate, needs a clean tree)"
# `git status --porcelain` lists a modified, deleted or new file. A generated path that is not
# checked in is excluded by .gitignore and nowhere else, each for its reason: internal/server/assets/t.js
# and packages/*/dist (the tracker bundle, built by `build:tracker`), internal/server/assets/spa/ and
# internal/changelog/CHANGELOG.md (release-only copies); none is produced by `generate`.
run = [
  { task = "generate" },
  '''test -z "$(git status --porcelain)" || { echo 'Review rule 1 (docs/standards/review-rules.md): generated files must come from the generator, never from a hand edit or a stale run. Run `mise run generate` and commit the result. Differing files:'; git status --short; git diff | head -80; exit 1; }''',
]

# --- checks ----------------------------------------------------------------------

[check]
description = "Every linter, type-check and security check"
depends = [
  "check:fe",
  "check:i18n",
  "check:be",
  "check:deps",
  "check:security",
  "check:ast",
  "check:openapi",
  "check:copies",
  "check:typos",
  "check:adr",
  "check:helm",
  "check:shell",
  "check:links",
]

["check:fe"]
description = "tsc, oxlint, oxfmt --check, no custom CSS"
depends = ["check:css"]
run = [
  "mise/scripts/heavy.sh pnpm exec tsc --noEmit",
  "pnpm exec oxlint",
  "pnpm exec oxfmt --check",
]

["check:css"]
description = "The project has no custom CSS: no stylesheet may be tracked (library CSS comes from node_modules)"
run = '''
if git ls-files | grep -Ei '\.(css|scss|sass|less|pcss|styl)$'; then
  echo 'error: custom CSS is not allowed, style through Mantine'; exit 1
fi
'''

["check:adr"]
description = "ADR numbers are unique (parallel integration branches each pick the next free number)"
run = '''
nums=$(ls docs/adr | sed -n 's/^\([0-9][0-9]*\)-.*/\1/p')
dup=$(echo "$nums" | sort | uniq -d)
if [ -n "$dup" ]; then
  next=$(printf '%04d' $(( $(echo "$nums" | sort -n | tail -1 | sed 's/^0*//') + 1 )))
  echo "error: duplicate ADR numbers in docs/adr: $(echo $dup); renumber the newer file (next free: $next)"; exit 1
fi
'''

["check:upgrade"]
description = "ADR 0033 in CI: a destructive migration needs a breaking PR title, a migration that locks a live table fails under any title, a breaking change needs an `Upgrade:` line in its `BREAKING CHANGE:` footer (cmd/upgradecheck runs Squawk over the added migrations; PR_TITLE, PR_BODY_FILE and BASE come from the pull request, default to the last commit against origin/main)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
base="${BASE:-origin/main}"
title="${PR_TITLE:-$(git log -1 --format=%s)}"
args=(--title "$title" --base "$base")
go run ./cmd/upgradecheck migrations "${args[@]}"
go run ./cmd/upgradecheck breaking "${args[@]}" ${PR_BODY_FILE:+--body-file "$PR_BODY_FILE"}
go run ./cmd/upgradecheck immutable --base "$base" ${PR_BODY_FILE:+--body-file "$PR_BODY_FILE"}
'''

["check:pr-body"]
description = "What a pull request body must say: the AI assistance option is checked and each added `contract-copy:` marker has a `Contract-Copy: <file>: <reason>` line (cmd/prcheck; PR_BODY and BASE come from the pull request, BASE defaults to origin/main)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${PR_BODY?set PR_BODY to the pull request body}"
base="${BASE:-origin/main}"
go run ./cmd/prcheck disclosure
git diff --unified=0 --no-color "$base...HEAD" | go run ./cmd/prcheck markers
'''

["check:pr-title"]
description = "The pull request title parses as a Conventional Commit under commitlint.config.ts: the repository squashes with it and release-please reads it (PR_TITLE comes from the pull request)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${PR_TITLE?set PR_TITLE to the pull request title}"
printf '%s' "$PR_TITLE" | pnpm exec commitlint
'''

["check:deps"]
description = "Unused files, exports and dependencies (knip.ts)"
run = "mise/scripts/heavy.sh pnpm exec knip"

["check:i18n"]
description = "i18n key drift (read-only: --dry-run never writes, --ci exits non-zero on drift)"
run = [
  "pnpm exec i18next-cli extract --ci --dry-run",
  "pnpm exec i18next-cli types --ci",
  "pnpm exec i18next-cli lint",
]

["check:be"]
description = "golangci-lint with our analyzers (incl. the gofmt formatter), the analyzers' own tests, and go.mod tidiness"
depends = ["build:lint", "check:lint-pins"]
run = [
  "mise/scripts/heavy.sh .bin/custom-gcl run --allow-serial-runners ./...",
  "cd tools/analyzers && ../../mise/scripts/heavy.sh ../../.bin/custom-gcl run --allow-serial-runners --config ../../.golangci.yml ./... && go test ./...",
  "go mod tidy -diff",
  "cd tools/analyzers && go mod tidy -diff",
]

["build:lint"]
description = "Build .bin/custom-gcl: golangci-lint with our analyzers (.custom-gcl.yml, tools/analyzers); rebuilt only when they change"
sources = [
  ".custom-gcl.yml",
  "tools/analyzers/**/*.go",
  "tools/analyzers/go.mod",
  "tools/analyzers/go.sum",
  "mise.lock",
]
outputs = [".bin/custom-gcl"]
run = "mise/scripts/heavy.sh golangci-lint custom --version v$(mise current golangci-lint)"

["check:lint-pins"]
description = "The analyzers' x/tools and plugin-register versions are the ones that golangci-lint itself uses"
run = "node mise/scripts/check-lint-pins.ts"

["check:schema"]
description = "schemalens: the ent schema and the migrated database agree, and the database passes its rules"
depends = ["db:migrate"]
run = "schemalens check --dsn \"$DATABASE_URL\" --adapter ent"

["check:vulns"]
description = "No call to a known-vulnerable dependency or stdlib function (network: the vulnerability database). Not part of check: a new advisory fails it with no change on our side, so the nightly workflow runs it"
run = "go tool govulncheck ./..."

["check:ast"]
description = "Project-specific syntax rules (sgconfig.yml, ast-grep/): tests, then scan"
run = ["ast-grep test", "ast-grep scan"]

["check:copies"]
description = "Rule 6: no hand-written copy of a TypeSpec enum, limit or scope in Go, TypeScript or fixtures (cmd/contractcopy reads openapi/*.openapi.json; a value that only looks like a contract value carries `// contract-copy: <reason>`)"
run = "go run ./cmd/contractcopy"

["check:typos"]
description = "Spelling in code, docs and comments (_typos.toml)"
run = "typos"

["check:tracker-size"]
description = "Tracker (t.js) gzip size budget (package.json size-limit); builds it first"
run = ["pnpm build:tracker", "pnpm exec size-limit"]

["check:helm"]
description = "Helm chart: lint, schema-validated render (default and all-features), and refusal without existingSecret"
run = '''
set -eu
chart=charts/sphericon
helm lint "$chart" --set existingSecret=sphericon-secrets
if helm template r "$chart" >/dev/null 2>&1; then
  echo 'error: chart rendered without existingSecret'; exit 1
fi
# ServiceMonitor is a CRD kind: kubeconform has no built-in schema for it.
kc='kubeconform -strict -summary -ignore-missing-schemas'
helm template r "$chart" --set existingSecret=sphericon-secrets | $kc
helm template r "$chart" --set existingSecret=sphericon-secrets \
  --set ingress.enabled=true --set ingress.tls.enabled=true --set ingress.tls.secretName=tls \
  --set metrics.enabled=true --set metrics.serviceMonitor.enabled=true \
  --set metrics.prometheusRule.enabled=true | $kc
# The release packages the chart with chart version = app version.
mise run release:chart -- 9.9.9
'''

["release:chart"]
description = "Package the Helm chart with chart version = app version (no leading v) and push it to an OCI registry path; without a registry only package and verify"
usage = '''
arg "<version>" help="app and chart version, no leading v"
arg "[registry]" help="oci://host/path to push to"
'''
run = '''
set -eu
version=$usage_version
out=$(mktemp -d)
helm package charts/sphericon --version "$version" --app-version "$version" --destination "$out"
pkg="$out/sphericon-$version.tgz"
test "$(helm show chart "$pkg" | sed -n 's/^appVersion: *//p' | tr -d '"')" = "$version" \
  || { echo "error: packaged appVersion is not $version"; exit 1; }
if [ -n "${usage_registry:-}" ]; then helm push "$pkg" "$usage_registry"; fi
'''

["check:openapi"]
description = "vacuum lints the generated OpenAPI documents (the recommended ruleset; a finding of severity error fails)"
run = "for f in openapi/*.openapi.json; do vacuum lint --no-banner --silent --no-style --fail-severity error \"$f\" || exit 1; done"

["check:osv"]
description = "osv-scanner over go.mod and pnpm-lock.yaml (nightly, like govulncheck: its answer changes with the advisory database, not with the diff); the advisories that stand are in osv-scanner.toml"
run = "osv-scanner scan source --recursive --config osv-scanner.toml ."

["check:contract"]
description = "Schemathesis fuzzes the external API against openapi/external.openapi.json: rebuilds the dedicated e2e DB (never the dev one: the fuzzer writes and deletes), seeds it, boots the server on it as the `contract` daemon (nightly: a minute or two)"
depends = ["db:up", "check:contract:prepare"]
depends_post = ["check:contract:stop"]
# The daemon starts here, not through `daemons`: that starts it before `depends` has built the binary.
# The anchor API token of the fixtures (fixtures/api_tokens.yml ContractToken): every scope, so no
# operation answers 403. The omtk_ token format is omtk_<prefix>_<secret>.
run = [
  "mise daemons start contract",
  '''uvx schemathesis run openapi/external.openapi.json --url "http://localhost:$CONTRACT_PORT/api" -H "Authorization: Bearer omtk_contractfz01_contract-token-secret" --max-examples 25 --workers 2''',
]

["check:contract:prepare"]
description = "The e2e database rebuilt and seeded, and the server binary the contract daemon runs"
depends = ["db:up"]
env = { SPHERICON_ENV = "e2e", DATABASE_URL = "{{env.E2E_DB_URL}}", SPHERICON_METRICS_ADDR = "" }
run = [
  "go run ./cmd/db drop",
  "go run ./cmd/db create",
  "go run ./cmd/server migrate",
  "go run ./cmd/seed",
  "go build -o .bin/contract-server ./cmd/server",
]

["check:contract:stop"]
description = "Stop the contract daemon; a 500 tells the client nothing, so show what the server logged for failed requests"
run = '''
mise daemons logs contract | grep '"msg":"request failed"' | sort -u | head -20 || true
mise daemons stop contract
'''

["check:shell"]
description = "shellcheck the scripts under mise/scripts/"
run = "shellcheck -x --source-path=SCRIPTDIR mise/scripts/*.sh"

["check:links"]
description = "Links between the Markdown files of the repository and their #fragments resolve (lychee --offline, lychee.toml)"
run = "lychee --config lychee.toml --offline --no-progress '**/*.md'"

["check:links:remote"]
description = "External links in the Markdown files answer (network: not part of check, a site can be down with no change on our side, so the nightly workflow runs it)"
run = "lychee --config lychee.toml --no-progress '**/*.md'"

["check:security"]
description = "Secrets and workflow linters"
run = ["gitleaks git --no-banner --redact", "jactionlint", "zizmor --no-progress .github"]

[fix]
description = "Auto-fix i18n keys, lint and formatting"
run = [{ task = "fix:i18n" }, { task = "fix:fe" }, { task = "fix:be" }]

["fix:i18n"]
description = "Extract i18n keys (runs first so oxfmt formats the fresh JSON)"
run = "pnpm exec i18next-cli extract --with-types"

["fix:fe"]
description = "oxlint --fix, tsp format, oxfmt"
# tsp format rewrites tspconfig.yaml quotes; oxfmt must run last to normalize them.
run = ["pnpm exec oxlint --fix", "pnpm exec tsp format typespec", "pnpm exec oxfmt"]

["fix:be"]
run = "go fmt ./..."

# --- build -----------------------------------------------------------------------

["build:tracker"]
description = "Build the standalone tracker (IIFE) and copy it into the Go embed tree"
run = ["pnpm build:tracker", "cp packages/analytics/dist/t.js internal/server/assets/t.js"]

["build:emaildoc"]
description = "Build the email document renderer bundle (the editor's export code for goja) its schema listing and the editor version into internal/emaildoc/assets"
run = [
  "pnpm build:emaildoc",
  "cp packages/emaildoc/dist/emaildoc.js packages/emaildoc/dist/schema.json packages/emaildoc/dist/editor-version.txt internal/emaildoc/assets/",
]

["build:spa"]
description = "Build the SPA (Vite) into the Go embed tree (gitignored; release builds only)"
run = [
  "pnpm build",
  "rm -rf internal/server/assets/spa",
  "mkdir -p internal/server/assets/spa",
  "cp -R dist/. internal/server/assets/spa/",
]

["build:changelog"]
description = "Copy CHANGELOG.md into the Go embed tree (gitignored; release builds only)"
run = "cp CHANGELOG.md internal/changelog/CHANGELOG.md"

[build]
description = "Self-contained release binary (tracker, SPA, changelog embedded); VERSION env overrides `dev`"
depends = ["build:tracker", "build:spa", "build:changelog"]
run = '''
commit=$(git rev-parse --short HEAD 2>/dev/null || echo none)
date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
go build -tags embed_spa,embed_changelog -ldflags "-s -w -X github.com/getsphericon/sphericon/internal/buildinfo.Version=${VERSION:-dev} -X github.com/getsphericon/sphericon/internal/buildinfo.Commit=$commit -X github.com/getsphericon/sphericon/internal/buildinfo.Date=$date" -o bin/sphericon ./cmd/server
'''

[loc]
description = "Lines-of-code report (scc) over hand-written files only"
# The set of generated files is the source of truth in .gitattributes
# (linguist-generated=true), so only tracked files git marks as hand-written are fed to scc.
run = '''
git ls-files | git check-attr --stdin linguist-generated | awk -F': ' '$3!="true"{print $1}' | xargs scc
'''
