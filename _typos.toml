[files]
# Generated code, lockfiles and catalogs.
extend-exclude = [
  "gen",
  "ent/*.go",
  "ent/*/",
  "openapi",
  "**/generated",
  "**/*_gen.go",
  "go.mod",
  "go.sum",
  "pnpm-lock.yaml",
  "mise.lock",
  "internal/kernel/i18n/locales",
  "locales",
  "internal/server/assets",
  "internal/kernel/emaildoc/assets",
  "internal/kernel/emaildoc/testdata/golden",
  "CHANGELOG.md",
  ".agents/skills",
]

[default]
# Long opaque blobs (DKIM keys, hashes) are not prose.
extend-ignore-re = ["[A-Za-z0-9+/=_-]{40,}"]

[default.extend-words]
# Intentional fragments: hyphenated "mis-quoted", a header folded mid-word in a test
# comment, the CSS "styl" extension regex, OTP plural, the "optin" brand spelling and the
# RTO (recovery time objective) of the restore drill, and the golangci-lint linters decorder and importas.
mis = "mis"
Unsubscrib = "Unsubscrib"
unsubscrib = "unsubscrib"
styl = "styl"
OT = "OT"
optin = "optin"
Optin = "Optin"
Maily = "Maily"
maily = "maily"
RTO = "RTO"
decorder = "decorder"
importas = "importas"
# COSE (CBOR Object Signing and Encryption), the key format of a Passkey's public key.
COSE = "COSE"
# German words the Regional format tests expect (src/utils/regionalFormat.test.ts): the month
# "Dezember" and the "vor" of "vor 5 Minuten". The checker would turn them into English.
Dezember = "Dezember"
vor = "vor"
