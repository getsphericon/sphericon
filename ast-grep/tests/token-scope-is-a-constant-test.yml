id: token-scope-is-a-constant
valid:
  - |
    func TestReads(t *testing.T) {
    	c := env.ExternalScoped(t, apitokens.ScopeContactsRead)
    	_ = c
    }
invalid:
  - |
    func TestReads(t *testing.T) {
    	c := env.ExternalScoped(t, "contacts:read")
    	_ = c
    }
  - |
    func TestReads(t *testing.T) {
    	bearer := env.ScopedBearerFor(t, fixtures.GlobexID, apitokens.ScopeContactsRead, "events:read")
    	_ = bearer
    }
