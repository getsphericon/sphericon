id: no-path-literal-navigation
valid:
  - |-
    navigate({ to: contactsRoute.to, params: { workspaceId } })
  - |-
    <Link to={contactsRoute.to}>x</Link>
  - |-
    const route = { path: '/contacts' }
invalid:
  - |-
    navigate({ to: '/login' })
  - |-
    redirect({ to: `/w/${workspaceId}` })
  - |-
    <Link to="/login">x</Link>
  - |-
    <Link to={'/login'}>x</Link>
