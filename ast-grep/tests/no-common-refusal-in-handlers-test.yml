id: no-common-refusal-in-handlers
valid:
  - |
    func (h *Handlers) SiteTagsDelete(ctx context.Context, params siteapi.SiteTagsDeleteParams) (siteapi.SiteTagsDeleteRes, error) {
    	if err := h.tags.Delete(ctx, workspaceScope(ctx), int64(params.ID)); err != nil {
    		return nil, err
    	}
    	return &siteapi.SiteTagsDeleteNoContent{}, nil
    }
  - |
    func (h *Handlers) proveCurrentPassword(ctx context.Context, u *ent.User, password string) error {
    	if _, err := h.login.Prove(ctx, u.Email, u.PasswordHash, password); err != nil {
    		return err
    	}
    	return nil
    }
invalid:
  - |
    func notFound() siteapi.ProblemDetails {
    	return problem(http.StatusNotFound, "workspace not found")
    }
  - |
    func refused(err error) (siteapi.InUseProblemDetails, bool) {
    	if used, ok := inuse.As(err); ok {
    		return inUseProblem(used), true
    	}
    	return siteapi.InUseProblemDetails{}, false
    }
  - |
    func invalid(err error) bool {
    	var verr *validation.Error
    	return errors.As(err, &verr)
    }
  - |
    func templateNotFound(err error) siteapi.ProblemDetails {
    	return problem(http.StatusNotFound, validation.Message(err))
    }
  - |
    func sentinel(err error) bool {
    	_, ok := errors.AsType[*validation.RefusalError](err)
    	return ok
    }
