id: no-hand-written-problem-in-handlers
valid:
  - |
    func (h *ServiceHandlers) ServiceHoldsList(ctx context.Context, params serviceapi.ServiceHoldsListParams) (*serviceapi.HoldList, error) {
    	rows, err := h.module.ActiveHolds(ctx, string(params.WorkspaceId))
    	if err != nil {
    		return nil, err
    	}
    	return &serviceapi.HoldList{Items: serviceMapper.HoldsToResources(rows)}, nil
    }
  - |
    func (h *Handlers) SiteTagsDelete(ctx context.Context, params siteapi.SiteTagsDeleteParams) error {
    	return h.tags.Delete(ctx, workspaceScope(ctx), int64(params.ID))
    }
invalid:
  - |
    func notFoundProblem() staffeeapi.ProblemDetails {
    	return staffeeapi.ProblemDetails{Detail: staffeeapi.NewOptString("not found")}
    }
  - |
    func (h *Handlers) NewError(ctx context.Context, err error) *siteapi.ProblemDetailsStatusCode {
    	return &siteapi.ProblemDetailsStatusCode{StatusCode: 404}
    }
  - |
    func (h *Handlers) ContactsGet(ctx context.Context, params externalapi.ContactsGetParams) (*externalapi.ContactResource, error) {
    	return nil, &problem.Error{Status: http.StatusNotFound, Detail: "contact not found"}
    }
