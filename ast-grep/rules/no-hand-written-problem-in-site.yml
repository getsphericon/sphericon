id: no-hand-written-problem-in-site
language: Go
severity: error
message: "rule 15: a site handler writes a refusal's problem by hand; fix: return the module's sentinel refusal (validation.Refuse/RefuseField/NotFound/Conflict/ConflictField/Forbidden/Unauthorized/Denied/Unverified/LinkInvalid/Incomplete/UnknownReference) and let refusalProblem in internal/server answer it"
note: >-
  A refusal answers the same on every surface and is mapped once (review rule 15): the module that
  decides it returns a sentinel whose kind carries its status and code (not found 404, refused 422,
  conflict 409, forbidden 403 permission_required, unauthorized 401, denied 403, unverified 403
  email_verification_required, an invalid link 400, incomplete 428, an unknown reference 400), and
  the server's error handler writes the problem. A handler that calls problem/problemWithErrors,
  builds a siteapi.*ProblemDetails literal or names an operation's error response writes a second
  mapping of the decision, next to the handler rather than the module, which drifts from the other surfaces. The files under `ignores` keep an
  answer no refusal kind gives; a new file is covered at once. no-hand-written-problem-in-external
  is the same rule for /api.
rule:
  any:
    - kind: call_expression
      has:
        field: function
        kind: identifier
        regex: ^(problem|problemWithErrors)$
    - kind: composite_literal
      has:
        field: type
        regex: ^siteapi\.\w*ProblemDetails$
    # An operation's error response, however its body was built: converted to (a selector) or
    # built as a literal (a qualified type).
    - kind: selector_expression
      regex: &response ^siteapi\.Site\w+(BadRequest|Unauthorized|PaymentRequired|Forbidden|NotFound|Conflict|Gone|PreconditionRequired|UnprocessableEntity)$
    - kind: qualified_type
      regex: *response
files:
  - internal/api/site/**/*.go
ignores:
  - '**/*_test.go'
  - '**/*_gen.go'
  # The helper the files below call.
  - internal/api/site/problem.go
  # No refusal kind fits these: the 402 of a missing Enterprise license (audit) and the 410 of an
  # expired confirmation link (consent). A single kept answer in a file that is otherwise covered
  # carries an `ast-grep-ignore` comment saying why instead (schema).
  - internal/api/site/audit.go
  - internal/api/site/consent.go
