id: no-common-refusal-in-handlers
language: Go
severity: error
message: "rule 15: a handler maps a refusal the server's error handler renders; fix: return the module's error (a validation.Refuse/RefuseField/NotFound/Conflict/ConflictField/Forbidden/Unauthorized/Denied/Unverified/LinkInvalid/Incomplete/UnknownReference sentinel or memberships.Require, validation.FieldsError, liveuse.Error, workspaces.ErrNotFound) and let internal/api/problem answer it"
note: >-
  A module's sentinel refusal (`validation.RefusalError`) carries its kind, which decides its
  answer: not found 404, refused 422, conflict 409, forbidden 403 with code permission_required (a
  Role without a Permission, memberships.Require), unauthorized 401, denied 403, unverified 403 with
  code email_verification_required, an invalid link 400, incomplete 428, an unknown reference 400.
  A form a module refused (`*validation.FieldsError`, 422), a removal refused while live work uses the row (`*liveuse.Error`, 409) and a Workspace the
  caller cannot reach (`workspaces.ErrNotFound`, 404) answer the same on every surface too, so
  internal/api/problem writes their problem once, through the surface's NewError. A handler that reads a
  refusal's message (`validation.Message`), matches these types, or spells the 404's text, writes
  a second copy that can drift from the first.
rule:
  any:
    - kind: interpreted_string_literal
      regex: '^"workspace not found"$'
    - kind: qualified_type
      regex: '^(validation\.(RefusalError|FieldsError)|liveuse\.\w+)$'
    - kind: selector_expression
      regex: '^(liveuse\.\w+|validation\.Message)$'
files:
  - internal/api/site/**/*.go
  - internal/api/external/**/*.go
  - internal/api/staff/**/*.go
  - ee/api/**/*.go
ignores:
  - '**/*_test.go'
  - '**/*_gen.go'
