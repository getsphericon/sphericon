id: no-status-write-outside-lifecycle
language: Go
severity: error
message: A lifecycle column is written only by its transition table, not by a bare update (ADR 0046).
note: >-
  An update that sets `status` or `tracking_state` skips the table, so it can make a move the table
  refuses and it loses no race. Fire a trigger on the entity's machine instead (its table lives in
  the owning module, built with `lifecycle.New`); the compare-and-swap `Write` inside
  `lifecycle.Storage{...}` is the one place the column is set. Creating a row in its first state
  is not an update. The status of a Versioned definition (an Automation, a Rule) moves only through
  internal/drafts, which calls the generated pointer operations (ADR 0065).
# A Go pattern such as `x.SetStatus($$$A)` parses as a type conversion, so each call pattern
# names its statement context and selects the call_expression.
rule:
  kind: call_expression
  any:
    - pattern:
        context: 'func _() { $RECV.SetStatus($$$ARGS) }'
        selector: call_expression
    - pattern:
        context: 'func _() { $RECV.SetTrackingState($$$ARGS) }'
        selector: call_expression
  all:
    - has:
        stopBy: end
        any:
          - pattern:
              context: 'func _() { $_.Update() }'
              selector: call_expression
          - pattern:
              context: 'func _() { $_.UpdateOneID($_) }'
              selector: call_expression
    - not:
        inside:
          stopBy: end
          kind: composite_literal
          has:
            field: type
            regex: ^lifecycle\.Storage\[
files:
  - '**/*.go'
ignores:
  - '**/*_test.go'
  - ent/**
  - gen/**
