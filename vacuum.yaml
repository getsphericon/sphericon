# vacuum's recommended ruleset (mise run check:openapi), with the rules of our own contract.
extends: [[vacuum:oas, recommended]]
rules:
  # Every refusal or failure of an operation (a body that does not decode, a missing scope, a
  # module's refusal, a fault) is answered with the one Problem, declared as the operation's
  # `default` response; ogen reduces it to the surfaces' error type (ogen.yml) and fails the
  # generation without it, and this says so on the contract itself.
  operation-declares-problem:
    description: Every operation declares the Problem as its default response
    severity: error
    recommended: true
    given: $.paths[*][get,put,post,delete,patch].responses
    then:
      field: default
      function: truthy
