name: release-please

on:
  push:
    branches:
      - main
  # Publishes the artifacts of a release that already exists, when its build failed:
  # `gh workflow run release-please.yml -f tag=v1.2.3`.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to build and publish, such as v1.2.3
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A pull request opened by GITHUB_TOKEN waits for a manual "Approve and run workflows"
          # on every push; a token of its own runs CI and CodeQL on the release pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build + publish artifacts only when release-please actually cut a release.
  # A tag pushed by release-please via GITHUB_TOKEN would not trigger a separate
  # `on: push: tags` workflow, so GoReleaser must be chained here.
  goreleaser:
    needs: release-please
    if: >-
      !cancelled() && (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write # keyless cosign signing (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # Same pinned toolchain as CI (go, node, pnpm, ...); provides `mise run` for the
      # GoReleaser before-hooks (build:tracker / build:spa).
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          # 0.4.0 died building four targets at once, most likely out of memory: two at a time.
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The chart is published as an OCI artifact with its version equal to the app version, so
  # `helm upgrade sphericon oci://ghcr.io/getsphericon/charts/sphericon --version X --reuse-values`
  # is the whole Upgrade on Kubernetes (ADR 0034).
  chart:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - name: Publish the chart
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          mise run release:chart -- "${TAG_NAME#v}" oci://ghcr.io/getsphericon/charts
