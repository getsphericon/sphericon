name: Pull request body

# What a pull request title and body must say is checked when they are edited, not only when code is
# pushed: ci.yml runs on the default events, which skip an edit. Nothing here has a secret to lose,
# so it runs on pull_request from forks too.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The AI assistance section of the pull request template is filled in, and each `contract-copy:`
  # marker the change adds is declared in the body. A bot's pull request (dependabot) has no template
  # to fill in, and neither has the release pull request, which release-please opens as the maintainer
  # when it runs with a personal access token: a skipped job counts as passed for a required check.
  # A fork cannot borrow the release branch name, because the head must live in this repository.
  pr-body:
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && !(github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'release-please--branches--main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          # Runs on pull requests only, which save no cache: it reads the one CI's `checks` job seeds on main.
          scope: checks

      # The body is attacker-controlled text: it reaches the program through the environment, never
      # through the script.
      - name: Check the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: mise run check:pr-body

  # The repository squashes a pull request with its title, and release-please reads that title, so it
  # must parse as a Conventional Commit: the rules every commit is held to (commitlint.config.ts).
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The title is attacker-controlled text: it reaches commitlint through the environment, never
      # through the script.
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: mise run check:pr-title
