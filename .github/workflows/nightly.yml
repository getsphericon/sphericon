name: Nightly

# Checks that do not need to run on every pull request: the Go coverage floor (with the real
# document export on the save paths), the race detector, mutation testing, fuzzing, the contract fuzz, the external links of the Markdown files,
# the compose.yaml smoke test, and the dependency scan, whose answer changes with the advisory
# database rather than with our code. One scheduled run covers them; `workflow_dispatch` runs them
# on demand. A scheduled workflow only runs from the default branch.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# Read-only everywhere: no job in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Go suite over cmd/, internal/ and ee/, failing under the total in
  # .testcoverage.yml. It saves documents through the editor's real export: a pull request's
  # suite fakes it everywhere but internal/kernel/emaildoc, internal/kernel/emailrender and the tests of what
  # the export makes of the starter and fixture documents, as a runtime takes seconds to start.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      # The task starts the `db` mise daemon (Postgres preset) itself.
      - name: Run tests with coverage
        run: mise run test:cover
        env:
          SPHERICON_TEST_EMAIL_RENDERER: goja

  # The whole Go suite under the race detector: slow (the JavaScript runtime that renders email
  # documents is several times slower with it), so it runs here and not on a pull request.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Run tests with the race detector
        run: mise run test:race

  # Mutation testing of the logic that decides what is sent: a surviving mutant is a change the
  # tests do not notice.
  mutation:
    runs-on: ubuntu-latest
    # 273 mutants took 44 minutes on 2026-11-05, and the count grows with the logic it mutates.
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Mutate the logic packages
        run: mise run test:mutation

  # Schemathesis fuzzes the external API against its OpenAPI contract on a server of its own.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The server is built here and its start guard compares its version with the floor of
          # the database: a shallow clone has no tags, so the build is v0.0.0-… and is refused.
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Fuzz the external API against its contract
        run: mise run check:contract

  # Native fuzzing of the parsers that take outside input; a crash is saved under testdata/fuzz.
  # The Fuzz targets, found by name (test:fuzz:targets): the fuzz job runs one job per target, so a
  # new target adds a job rather than minutes to one job's timeout.
  fuzz-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: List the Fuzz targets
        id: targets
        run: echo "targets=$(mise run --quiet test:fuzz:targets | jq --raw-input . | jq --slurp --compact-output .)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: fuzz-targets
    runs-on: ubuntu-latest
    # One target for SPHERICON_FUZZTIME, with its build.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Fuzz the target
        run: mise run test:fuzz -- "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          SPHERICON_FUZZTIME: 3m

  # govulncheck. A new advisory can fail this with no change on our side, which
  # is why it runs here and not on a pull request.
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Check for vulnerable dependencies
        run: mise run check:vulns

      - name: Check the Go and pnpm lockfiles against OSV
        run: mise run check:osv

  # External links in the Markdown files: a site that is down or moves a page fails this with no
  # change on our side, which is why it runs here and not on a pull request.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Check external links
        run: mise run check:links:remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # compose.yaml is the Self-hoster's entry point: build the image, start the file and wait for
  # /healthz, so the file cannot rot. Nightly, not per pull request: the image built here comes from
  # the top-level Dockerfile, while a release ships the GoReleaser image (Dockerfile.release), so a
  # pull request gains three minutes of build for a check on a path no release takes.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag ghcr.io/getsphericon/sphericon:ci .

      - name: Write .env
        run: |
          {
            echo "SPHERICON_VERSION=ci"
            echo "SPHERICON_APP_URL=http://localhost:3000"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "SPHERICON_JWT_SECRET=$(openssl rand -hex 32)"
            echo "SPHERICON_ENCRYPTION_KEY=$(docker run --rm ghcr.io/getsphericon/sphericon:ci genkey)"
          } > .env

      # --wait returns once every service is healthy (the image HEALTHCHECK hits /healthz) and
      # fails if one exits non-zero, so a failed `migrate` fails the step.
      - name: Start the stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
