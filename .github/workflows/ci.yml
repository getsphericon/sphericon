name: CI

on:
  pull_request:
  # A pull request only restores caches saved on its own branch or on the default one, and it
  # saves none (.github/actions/go-cache): a run on main is what seeds the caches for every pull request.
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The scip indexers serve easement alone (the arch job). On a mise cache miss, `go install` of
  # scip-go fills the Go module cache with read-only files before go-cache restores it, tar cannot
  # overwrite them and the module cache restore is dropped.
  MISE_DISABLE_TOOLS: go:github.com/scip-code/scip-go/cmd/scip-go,npm:@sourcegraph/scip-typescript

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false

      # One toolchain for everything: go, node, pnpm, golangci-lint, gitleaks,
      # jactionlint, zizmor, ... all pinned in .mise.toml.
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # golangci-lint type-checks the whole module and its dependencies: ~4 minutes cold, a fraction
      # of that with the Go build cache and its own analysis cache restored.
      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          scope: lint
          # golangci-lint builds both modules (the app and tools/analyzers): this job saves the
          # module cache every other one restores.
          save-modules: 'true'

      # golangci-lint with our analyzers (build:lint), keyed by the task's own sources. mise rebuilds
      # an output older than its sources, and the checkout is newer than any restored file: the
      # touch is what lets a restored binary count as fresh.
      - name: Cache the custom golangci-lint
        id: custom-gcl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin/custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml', 'tools/analyzers/**/*.go', 'tools/analyzers/go.mod', 'tools/analyzers/go.sum', 'mise.lock') }}

      - name: Mark the restored binary fresh
        if: steps.custom-gcl.outputs.cache-hit == 'true'
        run: touch .bin/custom-gcl

      # Saved on main only, as the Go cache is (.github/actions/go-cache).
      - name: Cache golangci-lint
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'mise.lock', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'mise.lock', '.golangci.yml') }}-
            golangci-lint-${{ runner.os }}-

      - name: Restore golangci-lint cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'mise.lock', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'mise.lock', '.golangci.yml') }}-
            golangci-lint-${{ runner.os }}-

      - name: Run checks
        run: mise run check:lint

  # Package boundaries (easement.yml). Its indexers, scip-go and scip-typescript, type-check both
  # code bases: on the lint runner they compete with golangci-lint and tsc for the same cores.
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # easement needs scip-go on PATH even when every index is cached.
    env:
      MISE_DISABLE_TOOLS: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # easement keeps each SCIP index under a key of the files its indexer reads, so a run that
      # changes no Go file reads scip-go's output from an earlier one instead of running it. Saved
      # by pull requests too, unlike the Go cache: the indexes are megabytes, not gigabytes, and a
      # second push to a pull request finds those of its first.
      - name: Cache the SCIP indexes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/easement
          key: easement-${{ runner.os }}-${{ github.sha }}
          restore-keys: easement-${{ runner.os }}-

      # An indexer needs its toolchain set up only when it runs: `--cache-only` runs none and
      # exits 3 when an index is not cached. Any other answer (a pass, a violation, an error) is
      # left to the check below.
      - name: Look for every index in the cache
        id: indexes
        run: |
          status=0
          easement check --cache-only > /dev/null 2>&1 || status=$?
          if [ "$status" -eq 3 ]; then
            echo "cached=false" >> "$GITHUB_OUTPUT"
          else
            echo "cached=true" >> "$GITHUB_OUTPUT"
          fi

      # scip-typescript type-checks the frontend against its dependencies.
      - name: Install dependencies
        if: steps.indexes.outputs.cached != 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Go
        if: steps.indexes.outputs.cached != 'true'
        uses: $/.github/actions/go-cache
        with:
          scope: arch

      - name: Check package boundaries
        run: mise run check:arch

  # The short checks, each a few seconds of work after a setup that used to be repeated per job.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint and the upgrade check read the commits in the pushed range.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          scope: checks
          fallback: generated

      # Regenerates everything and fails if the committed output differs. First: it needs a clean
      # tree, and the tracker build below writes (ignored) files.
      - name: Check generated code is up to date
        run: mise run generate:check

      # The contract decorators refuse what generate:check cannot see: a malformed declaration.
      - name: Test the contract decorators
        run: mise run test:typespec

      # The tracker is shipped to customer sites; keep it within the size budget.
      - name: Check the tracker size budget
        run: mise run check:tracker-size

      # Conventional Commits drive release-please; lint only the commits being added.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.sha }}
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against; skipping"
          else
            pnpm lint:commits --from "$FROM" --to "$TO"
          fi

      # ADR 0033: a removal or a rename reaches a minor release only through a breaking pull
      # request, and a breaking one says what a Self-hoster does. The repository squashes with the
      # pull request title, so the title is what release-please reads. The title and the body are
      # attacker-controlled text: they reach the program through the environment and a file, never
      # through the script.
      - name: Check migrations and breaking changes
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          PR_BODY_FILE="$RUNNER_TEMP/pr-body.md" mise run check:upgrade

  # The Go suite over three runners. internal/api/site runs its tests one after another (they ride
  # one database in transactions, so they do not call t.Parallel: .golangci.yml, paralleltest) and
  # finished last when it shared a runner; the other packages alternate between two shards by their
  # place in `go list`. Each package process leases a database of its own, so the shards share
  # nothing.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [site, rest-1, rest-2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          scope: test-${{ matrix.shard }}
          fallback: test-rest

      # The task starts the `db` mise daemon (Postgres preset) itself.
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          site=github.com/getsphericon/sphericon/internal/api/site
          if [ "$SHARD" = site ]; then
            mise run test -- "$site"
          else
            # rest-1 takes the odd lines, rest-2 the even ones.
            # shellcheck disable=SC2046 # one argument per package
            mise run test -- $(go list ./... | grep -vxF "$site" | awk -v n="${SHARD#rest-}" 'NR % 2 == n % 2')
          fi

      # Needs the migrated database the tests' Postgres provides, so it is not part of `check`.
      - name: Check the schema against the models
        if: matrix.shard == 'rest-1'
        run: mise run check:schema

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain also provides the mailpit binary the suite starts.
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          scope: e2e

      # Separate from `test` so a slow or flaky run does not block the fast
      # checks. The task starts the `db` daemon and rebuilds the e2e database.
      - name: Run end-to-end tests
        run: mise run test:e2e

  # The whole frontend suite, the logic tests (*.test.ts) with the UI ones (*.test.tsx), so a page a
  # change breaks fails its pull request rather than the next night. It is CPU-bound (a real
  # Chromium per test file, v8 coverage on top), so it is split over three runners. Each shard
  # uploads a blob report that carries its coverage; test-frontend-coverage joins them and enforces
  # the thresholds.
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest Browser Mode needs a real Chromium. The browser download is cached per lockfile;
      # `install` still runs for the system libraries and finds the browser already there.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend tests (shard ${{ matrix.shard }}/3)
        run: mise run test:frontend:shard ${{ matrix.shard }}/3

      - name: Upload the shard's report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          retention-days: 1
          if-no-files-found: error

  test-frontend-coverage:
    needs: test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true

      - name: Join the reports and check coverage
        run: mise run test:frontend:merge

  # The one check branch protection requires of this workflow: jobs can be split, merged or renamed
  # without touching the ruleset. `always()` makes it report a failure rather than be skipped.
  ci:
    if: always()
    needs: [lint, arch, checks, test, test-e2e, test-frontend, test-frontend-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job ended in: $result"
              exit 1
            fi
          done
