name: CI

on:
  pull_request:
  # A pull request only restores caches saved on its own branch or on the default one:
  # a run on main is what seeds the Go cache for every new pull request.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false

      # One toolchain for everything: go, node, pnpm, golangci-lint, gitleaks,
      # jactionlint, zizmor, ... all pinned in .mise.toml.
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: mise run check

  generated:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          scope: generated

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Regenerates everything and fails if the committed output differs.
      - name: Check generated code is up to date
        run: mise run generate:check

  commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint reads the commits in the pushed range.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Conventional Commits drive release-please; lint only the commits being added.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.sha }}
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against; skipping"
          else
            pnpm lint:commits --from "$FROM" --to "$TO"
          fi

  # ADR 0033: a removal or a rename reaches a minor release only through a breaking pull request,
  # and a breaking one says what a Self-hoster does. The repository squashes with the pull request
  # title, so the title is what release-please reads.
  upgrade:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          scope: upgrade

      # The title and the body are attacker-controlled text: they reach the program through
      # the environment and a file, never through the script.
      - name: Check migrations and breaking changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          PR_BODY_FILE="$RUNNER_TEMP/pr-body.md" mise run check:upgrade

  tracker-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tracker is shipped to customer sites; keep it within the size budget.
      - name: Build tracker
        run: pnpm build:tracker

      - name: Check size budget
        run: pnpm exec size-limit

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          scope: test

      # The task starts the `db` mise daemon (Postgres preset) itself.
      - name: Run tests
        run: mise run test

  test-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain also provides the mailpit binary the suite starts.
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Cache Go
        uses: $/.github/actions/go-cache
        with:
          scope: e2e

      # Separate from `test` so a slow or flaky run does not block the fast
      # checks. The task starts the `db` daemon and rebuilds the e2e database.
      - name: Run end-to-end tests
        run: mise run test:e2e

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest Browser Mode needs a real Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend tests
        run: mise run test:frontend

  # compose.yaml is the Self-hoster's entry point: build the image, start the file and wait for
  # /healthz, so the file cannot rot.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag ghcr.io/getsphericon/sphericon:ci .

      - name: Write .env
        run: |
          {
            echo "SPHERICON_VERSION=ci"
            echo "SPHERICON_APP_URL=http://localhost:3000"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "SPHERICON_JWT_SECRET=$(openssl rand -hex 32)"
            echo "SPHERICON_ENCRYPTION_KEY=$(docker run --rm ghcr.io/getsphericon/sphericon:ci genkey)"
          } > .env

      # --wait returns once every service is healthy (the image HEALTHCHECK hits /healthz) and
      # fails if one exits non-zero, so a failed `migrate` fails the step.
      - name: Start the stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
