# Hot-reload for the Go dev server (used by the `backend` compose service).
# Rebuilds and restarts cmd/server on source changes.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = "./tmp/server"
include_ext = ["go"]
exclude_dir = [
  ".cache",
  "node_modules",
  "npm-cache",
  "tmp",
  "dist",
  "openapi",
  "packages",
  "src",
  "locales",
  ".git",
]
delay = 500
stop_on_error = true

[log]
time = true
# Hide the per-directory "watching ..." lines (watcher logs); keep main air messages.
main_only = true
