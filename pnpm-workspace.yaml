packages:
  - 'packages/*'
# Install platform-native binaries (oxlint, oxfmt, tsgo, esbuild…) for every target: the
# glibc dev container, the darwin host (so host LSP/CLI works), and both CPUs / CI.
supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  # Mantine is taken as soon as it is released, without the release-age wait.
  - '@mantine/*'
  - '@react-email/editor@1.8.4'
  - '@react-email/render@2.3.1'
  - '@sentry/browser-utils@11.12.0'
  - '@sentry/browser@11.12.0'
  - '@sentry/core@11.12.0'
  - '@sentry/feedback@11.12.0'
  - '@sentry/react@11.12.0'
  - '@sentry/replay-canvas@11.12.0'
  - '@sentry/replay@11.12.0'
  - i18next@27.1.1
  - knip@6.45.0
  - libphonenumber-js@1.13.16
  - react-email@6.11.11
# Transitive dependencies of the build tooling that an advisory has fixed; pnpm picks the fixed
# release whichever package asks for them.
overrides:
  undici: '>=7.29.1'
  js-yaml: '>=5.4.1'
  esbuild: '>=0.28.1'
  happy-dom: '>=21.0.4'
permissions:
  '@tanstack/react-router':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  react-querybuilder:
    skills: true
# Where pnpm links the approved packages' skills: the directory mise links its tools' skills into
# (.claude/skills links to it). Named here, since pnpm finds no directory of its own on a
# machine where neither an agent runs nor mise has linked one yet (CI with a warm tool cache).
skills:
  dirs:
    - .agents/skills
patchedDependencies:
  # Remove after an SDK release includes https://github.com/synergycodes/workflowbuilder/pull/266.
  # v3 also needs the context-unmount guard already present upstream (PR #236).
  '@workflowbuilder/sdk@3.0.0': patches/@workflowbuilder__sdk@3.0.0.patch
