packages:
  - 'packages/*'
# Install platform-native binaries (oxlint, oxfmt, tsgo, esbuild…) for every target: the
# glibc dev container, the darwin host (so host LSP/CLI works), and both CPUs / CI.
supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  # Mantine is taken as soon as it is released, without the release-age wait.
  - '@mantine/*'
  - '@react-email/render@2.3.1'
  - i18next@27.2.1
  - knip@6.46.1
  - libphonenumber-js@1.13.16
  - '@react-querybuilder/core@8.27.1 || 8.28.0'
  - '@react-querybuilder/mantine@8.27.1 || 8.28.0'
  - '@reduxjs/toolkit@2.15.0'
  - '@vitest/browser-playwright@5.1.1'
  - '@vitest/browser@5.1.1'
  - '@vitest/coverage-v8@5.1.1'
  - '@vitest/mocker@5.1.1'
  - '@vitest/pretty-format@5.1.1'
  - '@vitest/spy@5.1.1'
  - '@vitest/ui@5.1.1'
  - '@vitest/utils@5.1.1'
  - js-base64@3.9.7
  - react-querybuilder@8.27.1 || 8.28.0
  - react-router@8.5.2
  - vitest@5.1.1
  - '@oxlint-tsgolint/darwin-arm64@7.0.2008'
  - '@oxlint-tsgolint/darwin-x64@7.0.2008'
  - '@oxlint-tsgolint/linux-arm64@7.0.2008'
  - '@oxlint-tsgolint/linux-x64@7.0.2008'
  - '@oxlint-tsgolint/win32-arm64@7.0.2008'
  - '@oxlint-tsgolint/win32-x64@7.0.2008'
  - '@sentry/browser-utils@11.16.0'
  - '@sentry/browser@11.16.0'
  - '@sentry/core@11.16.0'
  - '@sentry/feedback@11.16.0'
  - '@sentry/react@11.16.0'
  - '@sentry/replay-canvas@11.16.0'
  - '@sentry/replay@11.16.0'
  - '@tanstack/query-core@5.108.2'
  - '@tanstack/query-devtools@5.108.2'
  - '@tanstack/react-query-devtools@5.108.2'
  - '@tanstack/react-query@5.108.2'
  - i18next-cli@1.93.1
  - mantine-datatable@9.8.3
  - oxlint-tsgolint@7.0.2008
# Transitive dependencies of the build tooling that an advisory has fixed; pnpm picks the fixed
# release whichever package asks for them.
overrides:
  undici: '>=7.29.1'
  js-yaml: '>=5.4.1'
  esbuild: '>=0.28.1'
  happy-dom: '>=21.0.4'
permissions:
  '@tanstack/react-router':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  react-querybuilder:
    skills: true
# Where pnpm links the approved packages' skills: the directory mise links its tools' skills into
# (.claude/skills links to it), and only there. Unset, pnpm links into every `.<name>/skills` of
# the root and creates the directory of the agent that runs it, so under Claude Code a checkout
# without the link would get a .claude/skills directory of its own; named, it is created if
# missing.
skills:
  dirs:
    - .agents/skills
