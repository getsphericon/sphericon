<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sphericon</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Instance locale, substituted at serve time: the Go backend replaces the
         {{APP_LOCALE}} sentinel in the embedded index.html (see internal/server/spa.go),
         and the Vite dev server does the same in dev (see vite.config.ts). The SPA reads
         window.__APP_LOCALE__ synchronously at boot (src/i18n.ts) — no extra request —
         and sets <html lang> from it (kept a valid "en" here so the a11y lint passes). -->
    <script>
      window.__APP_LOCALE__ = '{{APP_LOCALE}}'
      // Email verification gate (ADR 0030), substituted the same way: registration
      // collects a password only when the Instance does not require verification, as a selfhosted
      // Mode does not (src/instance.ts).
      window.__REQUIRE_EMAIL_VERIFICATION__ = '{{REQUIRE_EMAIL_VERIFICATION}}' !== 'false'
      // DSN of the browser error reporter, empty (reporting off) unless the Instance sets
      // SPHERICON_SENTRY_DSN; substituted the same way (see src/sentry.ts).
      window.__SENTRY_DSN__ = '{{SENTRY_DSN}}'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
