[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-31
reason = "deepmerge 4.3.1 (no fixed release) reaches us through @react-email/editor -> @react-email/render -> html-to-text, whose two merge calls combine its own default options with the options @react-email/render passes and the selectors list; no document or request data is merged, so an attacker cannot supply the poisoning source object."
